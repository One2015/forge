<!-- delivery-sheet-extras:start -->
<sc-if value="{{ sheet.extras.visible }}" hint-placeholder-val="{{ false }}">
  <section class="forge-delivery-sheet-extras" aria-label="交付清单与审核技能">
    <div class="forge-delivery-section-heading"><h2>List 清单 <span class="forge-delivery-heading-count">{{ sheet.extras.count }}</span></h2><div class="forge-delivery-extra-actions"><sc-if value="{{ sheet.extras.hasArchive }}" hint-placeholder-val="{{ false }}"><button type="button" class="forge-delivery-text-button" sc-camel-on-click="{{ sheet.extras.downloadArchive }}">[[icon:paperclip:16]]{{ sheet.extras.archiveName }}</button></sc-if><sc-if value="{{ sheet.extras.hasTags }}" hint-placeholder-val="{{ false }}"><select aria-label="按 Tag 筛选清单" value="{{ sheet.extras.filter }}" sc-camel-on-change="{{ sheet.extras.onFilter }}"><option value="">全部 Tag</option><sc-for list="{{ sheet.extras.tags }}" as="tag" hint-placeholder-count="0"><option value="{{ tag.id }}" label="{{ tag.name }}">{{ tag.name }}</option></sc-for></select></sc-if></div></div>
    <sc-if value="{{ sheet.extras.hasEntries }}" hint-placeholder-val="{{ false }}"><div class="forge-delivery-saved-list"><sc-for list="{{ sheet.extras.entries }}" as="entry" hint-placeholder-count="0"><div class="forge-delivery-saved-entry"><strong title="{{ entry.source }}">{{ entry.name }}</strong><span class="forge-delivery-help">{{ entry.status }}</span><sc-if value="{{ entry.hasTag }}" hint-placeholder-val="{{ false }}"><span class="forge-delivery-tag" style="background:{{ entry.tagColor }};color:{{ entry.tagFg }}">{{ entry.tagName }}</span></sc-if></div></sc-for></div><p class="forge-delivery-help">显示 {{ sheet.extras.shownCount }} / {{ sheet.extras.count }} 项 · 未关联条目不会计入交付完成数</p></sc-if>
    <sc-if value="{{ sheet.extras.emptyEntries }}" hint-placeholder-val="{{ true }}"><p class="forge-delivery-help">还没有清单条目，可通过顶部「编辑数据单」上传 ZIP 或粘贴文本。</p></sc-if>
    <sc-if value="{{ sheet.extras.hasSkills }}" hint-placeholder-val="{{ false }}"><div class="forge-delivery-bound-skills"><strong>审核 Skill <span>{{ sheet.extras.skillCount }}</span></strong><div><sc-for list="{{ sheet.extras.skills }}" as="skill" hint-placeholder-count="0"><span class="forge-delivery-skill-token" title="{{ skill.description }}">{{ skill.command }}</span></sc-for></div><p class="forge-delivery-help">在已关联 Item 的审核会话中调用 · 演示模式</p></div></sc-if>
  </section>
</sc-if>
<!-- delivery-sheet-extras:end -->
