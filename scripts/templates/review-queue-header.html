<div class="review-queue-card-header" sc-camel-on-click="{{ it.toggle }}" style="flex:none;display:grid;grid-template-columns:124px minmax(0,1fr) clamp(190px,20vw,220px);gap:clamp(12px,1.6vw,18px);align-items:center;height:122px;padding:14px 16px;cursor:pointer;background:{{ it.cardBg }}" style-hover="background:#fcfbf9">
  <div style="height:82px;border-radius:10px;border:1px solid #e8e2d9;background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px)"></div>
  <!-- review-queue-card-copy:start -->
  <div class="review-queue-card-copy">
    <h3 class="review-queue-card-title" title="{{ it.domain }}">{{ it.domain }}</h3>
    <button type="button" class="review-queue-item-id" sc-camel-on-click="{{ it.openLife }}" title="查看这条 Item 的完整记录：{{ it.id }}"><span class="review-queue-item-id-label">Item ID</span><code>{{ it.id }}</code></button>
    <div class="review-queue-card-meta">
      <span class="review-queue-card-round">{{ it.round }}</span>
      <span class="review-queue-card-author" title="{{ it.authorLabel }}"><span class="review-queue-card-avatar" aria-hidden="true" style="background:{{ it.authorBg }}">{{ it.authorInitial }}</span><span class="review-queue-card-author-label">{{ it.authorLabel }}</span></span>
      <sc-if value="{{ it.mine }}" hint-placeholder-val="{{ false }}"><span class="review-queue-card-status">待我审核</span></sc-if>
    </div>
  </div>
  <!-- review-queue-card-copy:end -->
  <div style="display:flex;flex-direction:column;justify-content:center;gap:7px;align-items:flex-end">
    <sc-if value="{{ it.pending }}" hint-placeholder-val="{{ true }}"><button type="button" class="forge-review-cta cta-repair" aria-haspopup="dialog" sc-camel-on-click="{{ it.start }}">开始审核</button></sc-if>
    <sc-if value="{{ it.drafting }}" hint-placeholder-val="{{ false }}"><button type="button" class="forge-review-cta cta-repair" aria-haspopup="dialog" sc-camel-on-click="{{ it.start }}">继续填写返工说明</button></sc-if>
    <sc-if value="{{ it.needsReroll }}" hint-placeholder-val="{{ false }}"><button type="button" class="forge-review-cta cta-reroll" sc-camel-on-click="{{ it.reroll }}">Reroll</button></sc-if>
    <sc-if value="{{ it.rerolled }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#8a5a16">已发起 Reroll</span></sc-if>
    <div style="font-size:12px;color:#9c948b;text-align:right">{{ it.waitLabel }}</div>
  </div>
</div>
