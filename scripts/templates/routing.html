<sc-if value="{{ isRouteError }}" hint-placeholder-val="{{ false }}">
  <section class="forge-page forge-route-error" aria-labelledby="forge-route-error-title">
    <h1 id="forge-route-error-title">页面暂不可用</h1>
    <p>{{ routeError }}</p>
    <p>本地演示中未持久保存的运行或数据单，刷新后无法通过链接恢复。已保存的草稿仅在当前浏览器和账号下可用。</p>
    <a href="/overview" data-forge-route target="_top">返回概览</a>
    <a href="/delivery" data-forge-route target="_top">查看交付</a>
  </section>
</sc-if>
<!-- forge-routing-ui:end -->
