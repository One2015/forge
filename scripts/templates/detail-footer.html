<!-- detail-footer:start -->
<div class="forge-sheet-actions forge-feedback forge-detail-footer" role="group" aria-label="当前版本操作">
  <sc-if value="{{ sheet.pick.reworkFormClosed }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ sheet.pick.approvedDetail }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="forge-detail-action forge-detail-secondary" disabled="{{ sheet.pick.cannotAppendRework }}" title="{{ sheet.pick.appendHint }}" sc-camel-on-click="{{ sheet.pick.appendRework }}">追加返工</button>
      <button type="button" class="forge-detail-action forge-detail-download" title="下载已通过版本" aria-label="下载已通过版本" sc-camel-on-click="{{ sheet.pick.download }}">[[icon:download-simple:16]]</button>
    </sc-if>
    <sc-if value="{{ sheet.pick.showHistoryAction }}" hint-placeholder-val="{{ false }}"><button type="button" class="forge-detail-action" sc-camel-on-click="{{ sheet.pick.openRun }}">查看完整记录 [[icon:arrow-right:16]]</button></sc-if>
    <sc-if value="{{ sheet.pick.needsReview }}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{ sheet.pick.hasReviewActionHint }}" hint-placeholder-val="{{ false }}"><div class="forge-detail-review-status" role="status"><span>{{ sheet.pick.reviewActionHint }}</span><sc-if value="{{ sheet.pick.showAppendRun }}" hint-placeholder-val="{{ false }}"><button type="button" class="forge-detail-status-link" sc-camel-on-click="{{ sheet.pick.openAppendRun }}">查看运行</button></sc-if></div></sc-if>
      <button type="button" class="forge-detail-action forge-detail-approve" disabled="{{ sheet.pick.cannotReviewCandidate }}" title="{{ sheet.pick.reviewActionHint }}" sc-camel-on-click="{{ sheet.pick.pass }}">通过审核</button>
      <button type="button" class="forge-detail-action forge-detail-primary" disabled="{{ sheet.pick.cannotReviewCandidate }}" title="{{ sheet.pick.reviewActionHint }}" sc-camel-on-click="{{ sheet.pick.rework }}">要求返工</button>
    </sc-if>
  </sc-if>
  <sc-if value="{{ sheet.pick.reworkFormOpen }}" hint-placeholder-val="{{ false }}">
    <button type="button" class="forge-detail-action" sc-camel-on-click="{{ sheet.pick.cancelRework }}">取消返工</button>
    <button type="button" class="forge-detail-action forge-detail-primary" disabled="{{ sheet.pick.cannotSubmitRework }}" sc-camel-on-click="{{ sheet.pick.submitRework }}">提交返工</button>
  </sc-if>
</div>
<sc-if value="{{ sheet.pick.reworkConfirm.motionPresent }}" hint-placeholder-val="{{ false }}">
  <div class="forge-motion-overlay forge-rework-confirm-overlay" data-motion-key="sheetReworkConfirm" data-motion-open="{{ sheet.pick.reworkConfirm.motionOpen }}" sc-camel-on-click="{{ sheet.pick.reworkConfirm.cancel }}">
    <section class="forge-motion-dialog forge-rework-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="forge-rework-confirm-title" aria-describedby="forge-rework-confirm-description" sc-camel-on-click="{{ sheet.pick.reworkConfirm.stop }}">
      <h2 id="forge-rework-confirm-title">确认要求返工？</h2>
      <p id="forge-rework-confirm-description">提交后，当前候选版本将被标记为“要求返工”，并创建下一轮修复任务。审核结论提交后不可撤销。</p>
      <dl>
        <sc-for list="{{ sheet.pick.reworkConfirm.fields }}" as="f" hint-placeholder-count="0">
          <dt>{{ f.k }}</dt><dd>{{ f.v }}</dd>
        </sc-for>
      </dl>
      <div class="forge-rework-confirm-actions">
        <button type="button" class="forge-rework-confirm-button" sc-camel-on-click="{{ sheet.pick.reworkConfirm.cancel }}">返回修改</button>
        <button type="button" class="forge-rework-confirm-button forge-rework-confirm-primary" disabled="{{ sheet.pick.reworkConfirm.cannotConfirm }}" sc-camel-on-click="{{ sheet.pick.reworkConfirm.confirm }}">确认要求返工</button>
      </div>
    </section>
  </div>
</sc-if>
<!-- detail-footer:end -->
