<sc-if value="{{ skillView.available }}" hint-placeholder-val="{{ false }}">
<section class="forge-review-skills" aria-label="Skill 评估会话">
  <div class="forge-delivery-section-heading"><h2>技能评估</h2><span>演示模式</span></div>
  <sc-if value="{{ skillView.available }}" hint-placeholder-val="{{ false }}">
    <p class="forge-delivery-help">{{ skillView.count }} 个可用 Skill · 输入 / 或点击选择</p>
    <div class="forge-review-skill-composer"><input id="{{ skillView.inputId }}" aria-label="Skill 调用命令" value="{{ skillView.text }}" sc-camel-on-change="{{ skillView.onText }}" sc-camel-on-key-down="{{ skillView.onKey }}" placeholder="/3d trajectory 检查模型轨迹" maxlength="1000" autocomplete="off" /><button type="button" class="forge-delivery-primary" disabled="{{ skillView.disabled }}" sc-camel-on-click="{{ skillView.invoke }}">调用</button></div>
    <div class="forge-review-skill-choices"><sc-for list="{{ skillView.skills }}" as="skill" hint-placeholder-count="0"><button type="button" aria-pressed="{{ skill.selected }}" sc-camel-on-click="{{ skill.pick }}"><strong>{{ skill.command }}</strong><span>{{ skill.source }}</span></button></sc-for></div>
    <sc-if value="{{ skillView.error }}" hint-placeholder-val="{{ false }}"><p class="forge-feedback-error" role="alert">{{ skillView.error }}</p></sc-if>
    <p class="forge-delivery-help">仅加载 Skill 和当前 Item / Run；未接入真实评估引擎。</p>
  </sc-if>
  <div class="forge-review-skill-history" aria-live="polite"><sc-for list="{{ skillView.history }}" as="entry" hint-placeholder-count="0"><article><div class="forge-delivery-section-heading"><strong>{{ entry.command }}</strong><time>{{ entry.at }}</time></div><p>已加载 Skill · 演示</p><p class="forge-delivery-help">{{ entry.context }}</p><p class="forge-delivery-help">附加要求：{{ entry.argsLabel }}</p><details><summary>查看本次加载的 Skill</summary><pre>{{ entry.content }}</pre></details><p class="forge-delivery-help">未生成真实评分，正式审核结论未改变。</p></article></sc-for></div>
</section>
</sc-if>
