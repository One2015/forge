<div class="pm-delivery-browser-toolbar">
  <div class="pm-delivery-category-row" data-forge-segmented="pill" role="group" aria-label="数据单分类">
    <sc-for list="{{ delivery.cats }}" as="f" hint-placeholder-count="5">
      <button data-motion-label="{{ f.label }}" type="button" data-motion-selected="{{ f.motionSelected }}" aria-pressed="{{ f.motionSelected }}" sc-camel-on-click="{{ f.pick }}" style="background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};box-shadow:{{ f.shadow }}">{{ f.label }}</button>
    </sc-for>
    <button type="button" aria-pressed="{{ delivery.unmet }}" sc-camel-on-click="{{ delivery.toggleUnmet }}" style="background:{{ delivery.unmetBg }};color:{{ delivery.unmetFg }};font-weight:{{ delivery.unmetWeight }}">未达标</button>
  </div>
  <div class="pm-delivery-browser-controls">
    <label class="pm-delivery-search" for="pm-delivery-search">
      [[icon:magnifying-glass:16]]
      <input id="pm-delivery-search" type="search" value="{{ delivery.query }}" placeholder="搜索数据单、客户或负责人" aria-label="搜索交付数据单" sc-camel-on-change="{{ delivery.onQuery }}" />
      <sc-if value="{{ delivery.hasQuery }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="清除交付搜索" sc-camel-on-click="{{ delivery.clearQuery }}">清除</button></sc-if>
    </label>
    <button type="button" class="forge-delivery-primary forge-delivery-create pm-delivery-create-inline" sc-camel-on-click="{{ delivery.create }}">[[icon:plus:16]]<span>创建数据单</span></button>
  </div>
</div>
