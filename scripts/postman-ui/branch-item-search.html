<div class="pm-branch-picker" data-picker="PICKER_TYPE">
  <button id="forge-branch-PICKER_TYPE" class="pm-branch-picker-trigger" type="button" aria-haspopup="listbox" aria-expanded="{{ branch.PICKER_PROP.open }}" aria-controls="forge-branch-PICKER_TYPE-results" disabled="{{ branch.PICKER_PROP.disabled }}" sc-camel-on-click="{{ branch.PICKER_PROP.toggle }}">
    <span data-empty="{{ branch.PICKER_PROP.empty }}">{{ branch.PICKER_PROP.valueLabel }}</span>
    [[icon:caret-down:16]]
  </button>
  <sc-if value="{{ branch.PICKER_PROP.open }}" hint-placeholder-val="{{ false }}">
    <div class="pm-branch-picker-popover">
      <div class="pm-branch-picker-search">[[icon:magnifying-glass:16]]<input id="forge-branch-PICKER_TYPE-search" type="search" role="combobox" autocomplete="off" aria-label="PICKER_SEARCH_LABEL" aria-autocomplete="list" aria-expanded="true" aria-controls="forge-branch-PICKER_TYPE-results" aria-activedescendant="{{ branch.PICKER_PROP.activeOption }}" placeholder="PICKER_PLACEHOLDER" value="{{ branch.PICKER_PROP.query }}" sc-camel-on-input="{{ branch.PICKER_PROP.searchInput }}" sc-camel-on-blur="{{ branch.PICKER_PROP.searchBlur }}" sc-camel-on-key-down="{{ branch.PICKER_PROP.searchKey }}" /></div>
      <div id="forge-branch-PICKER_TYPE-results" class="pm-branch-picker-results" role="listbox" aria-label="PICKER_LIST_LABEL">
        <sc-for list="{{ branch.PICKER_PROP.results }}" as="result" hint-placeholder-count="0"><button type="button" role="option" tabindex="-1" id="{{ result.id }}" aria-selected="{{ result.selected }}" data-active="{{ result.active }}" sc-camel-on-mouse-down="{{ result.keepFocus }}" sc-camel-on-click="{{ result.pick }}"><span class="pm-branch-picker-option-copy"><strong>{{ result.label }}</strong><small>{{ result.meta }}</small></span>[[icon:check:16]]</button></sc-for>
      </div>
      <p class="pm-branch-picker-meta" role="status">{{ branch.PICKER_PROP.hint }}</p>
    </div>
  </sc-if>
</div>
