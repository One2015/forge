document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z\"></path></svg><span>上传 Skill</span><input type=\"file\" accept=\".md,.markdown,.zip,text/markdown,application/zip\" multiple disabled=\"{{ profile.uploadDisabled }}\" aria-label=\"上传个人 Skill\" sc-camel-on-change=\"{{ profile.uploadSkills }}\" /></label></div>\n        <p class=\"forge-profile-skill-help\">支持 MD 或含 SKILL.md 的 ZIP；上传后可命名并关联数据单。个人最多 12 个。</p>\n        <sc-if value=\"{{ profile.notice }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-profile-skill-notice\" role=\"status\">{{ profile.notice }}</p></sc-if>\n        <sc-if value=\"{{ profile.hasDraft }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"forge-profile-skill-editor\" role=\"group\" aria-label=\"命名和关联 Skill\">\n            <sc-if value=\"{{ profile.draftLoading }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-profile-skill-help\" role=\"status\">正在读取 Skill…</p></sc-if>\n            <sc-if value=\"{{ profile.draftError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-profile-skill-error\" role=\"alert\">{{ profile.draftError }}</p></sc-if>\n            <sc-for list=\"{{ profile.draftSkills }}\" as=\"draft\" hint-placeholder-count=\"0\">\n              <div class=\"forge-profile-skill-draft\">\n                <div class=\"forge-profile-draft-file\"><strong>{{ draft.filename }}</strong><button type=\"button\" class=\"forge-profile-close\" aria-label=\"移除此 Skill 草稿\" disabled=\"{{ profile.draftLoading }}\" sc-camel-on-click=\"{{ draft.remove }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button></div>\n                <label class=\"forge-profile-skill-field\"><span>Skill 名称</span><input aria-label=\"{{ draft.nameLabel }}\" value=\"{{ draft.name }}\" sc-camel-on-change=\"{{ draft.onName }}\" maxlength=\"80\" disabled=\"{{ profile.draftLoading }}\" required /></label>\n                <label class=\"forge-profile-skill-field\"><span>调用名</span><div class=\"forge-profile-command\"><span>/</span><input aria-label=\"{{ draft.commandLabel }}\" value=\"{{ draft.command }}\" sc-camel-on-change=\"{{ draft.onCommand }}\" maxlength=\"60\" disabled=\"{{ profile.draftLoading }}\" required /></div></label>\n              </div>\n            </sc-for>\n            <label class=\"forge-profile-skill-field\"><span>关联到数据单 <small>选填</small></span><select aria-label=\"关联到交付数据单\" value=\"{{ profile.targetSheet }}\" sc-camel-on-change=\"{{ profile.onTargetSheet }}\" disabled=\"{{ profile.draftLoading }}\"><option value=\"\">暂不关联，仅保存个人 Skill</option><sc-for list=\"{{ profile.targetSheets }}\" as=\"sheet\" hint-placeholder-count=\"0\"><option value=\"{{ sheet.key }}\" label=\"{{ sheet.label }}\" aria-label=\"{{ sheet.label }}\">{{ sheet.label }}</option></sc-for></select></label>\n            <sc-if value=\"{{ profile.draftIssue }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-profile-skill-error\" role=\"status\">{{ profile.draftIssue }}</p></sc-if>\n            <div class=\"forge-profile-editor-actions\"><button type=\"button\" sc-camel-on-click=\"{{ profile.cancelSkills }}\">取消</button><button type=\"button\" class=\"forge-profile-primary\" disabled=\"{{ profile.draftSaveDisabled }}\" sc-camel-on-click=\"{{ profile.saveSkills }}\">{{ profile.draftSaveLabel }}</button></div>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ profile.noSkills }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"forge-profile-empty\"><h3>还没有 Skill</h3><p>点击「上传 Skill」添加并命名，无需先关联任务。</p></div>\n        </sc-if>\n        <ul class=\"forge-profile-list\">\n          <sc-for list=\"{{ profile.skills }}\" as=\"skill\" hint-placeholder-count=\"0\">\n            <li class=\"forge-profile-skill\">\n              <h3>{{ skill.displayName }}</h3>\n              <p class=\"forge-profile-skill-command\">{{ skill.commandLabel }}</p>\n              <p class=\"forge-profile-skill-description\">{{ skill.description }}</p>\n              <div class=\"forge-profile-skill-source\">{{ skill.sheetName }}</div>\n              <div class=\"forge-profile-skill-footer\"><span>{{ skill.fileLabel }}</span><button type=\"button\" sc-camel-on-click=\"{{ skill.open }}\" aria-label=\"{{ skill.actionLabel }}\">{{ skill.action }} <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></button></div>\n            </li>\n          </sc-for>\n        </ul>\n      </section>\n    </sc-if>\n  </div>\n  <footer class=\"forge-profile-footer\">\n    <p>本地演示 · 刷新后清空</p>\n  </footer>\n</section>\n<!-- forge-profile:end -->\n\n</div>\n<!-- forge-sidebar-utilities:end -->\n</aside>\n<button type=\"button\" class=\"forge-sidebar-backdrop\" sc-camel-on-click=\"{{ sidebar.close }}\" aria-label=\"关闭展开导航\" tabindex=\"-1\"></button>\n<!-- forge-sidebar:end -->\n\n<main class=\"forge-main\">\n<sc-if value=\"{{ showSubNav }}\" hint-placeholder-val=\"{{ true }}\">\n  <div class=\"forge-production-tabs\" aria-label=\"生产二级导航\">\n    <div style=\"display:flex;align-items:center;gap:4px\">\n      <sc-for list=\"{{ subNav }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ s.pick }}\" style=\"padding:5px 11px;border-radius:8px;font-size:14px;cursor:pointer;color:{{ s.fg }};font-weight:{{ s.weight }};border-bottom:2px solid {{ s.underline }};border-radius:0;white-space:nowrap\">{{ s.label }}</div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isPipelines }}\" hint-placeholder-val=\"{{ true }}\">\n\n    <sc-if value=\"{{ pipeCopy.open }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ pipeCopy.cancel }}\" style=\"position:fixed;inset:0;background:rgba(34,31,28,.34);z-index:82;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div sc-camel-on-click=\"{{ pipeCopy.stop }}\" style=\"width:min(600px,100%);background:#fff;border:1px solid var(--forge-control-border);border-radius:14px;box-shadow:0 24px 60px rgba(34,31,28,.24);padding:26px clamp(20px,3vw,30px)\">\n          <div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em\">填写新 Pipeline 信息</div>\n          <div style=\"margin-top:8px;font-size:14px;color:var(--forge-muted);line-height:1.7;text-wrap:pretty\">以来源 Pipeline 为模板，沿用流程节点和关联数据集。确认信息后才会创建，并继续进入流程编辑。</div>\n\n          <div style=\"margin-top:18px;border:1px solid #ece7df;background:var(--forge-subtle);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:82px minmax(0,1fr);gap:7px 12px;align-items:baseline\">\n            <div style=\"font-size:12px;color:var(--forge-muted)\">来源 Pipeline</div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--forge-text);overflow-wrap:anywhere\">{{ pipeCopy.source }} {{ pipeCopy.sourceVersion }}</div>\n            <div style=\"font-size:12px;color:var(--forge-muted)\">新版本</div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--forge-text)\">v1</div>\n            <div style=\"font-size:12px;color:var(--forge-muted)\">创建者</div>\n            <div style=\"font-size:13px;color:var(--forge-text)\">{{ pipeCopy.owner }}</div>\n          </div>\n\n          <label style=\"display:block;margin-top:18px\">\n            <div style=\"font-size:13px;font-weight:600;color:var(--forge-text);margin-bottom:7px\">新 Pipeline 名称 <span style=\"color:var(--forge-accent)\">必填</span></div>\n            <input sc-camel-on-change=\"{{ pipeCopy.onName }}\" value=\"{{ pipeCopy.name }}\" placeholder=\"输入新 Pipeline 名称\" style=\"width:100%;height:40px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--forge-text)\">\n            <div style=\"margin-top:6px;font-size:12px;color:{{ pipeCopy.nameHintFg }};line-height:1.5\">{{ pipeCopy.nameHint }}</div>\n          </label>\n\n          <label style=\"display:block;margin-top:15px\">\n            <div style=\"font-size:13px;font-weight:600;color:var(--forge-text);margin-bottom:7px\">说明 <span style=\"font-weight:400;color:var(--forge-muted)\">可选</span></div>\n            <textarea sc-camel-on-change=\"{{ pipeCopy.onDesc }}\" value=\"{{ pipeCopy.desc }}\" placeholder=\"说明这个副本的用途或计划修改\" style=\"width:100%;min-height:82px;resize:vertical;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--forge-text);line-height:1.65\"></textarea>\n          </label>\n\n          <div style=\"margin-top:22px;display:flex;justify-content:flex-end;gap:9px\">\n            <button sc-camel-on-click=\"{{ pipeCopy.cancel }}\" style=\"height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 18px;font-size:14px;color:var(--forge-muted);cursor:pointer\">取消</button>\n            <sc-if value=\"{{ pipeCopy.canSave }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ pipeCopy.save }}\" style=\"height:38px;border:none;background:var(--forge-accent);color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--forge-accent-hover)\">创建并继续编辑</button>\n            </sc-if>\n            <sc-if value=\"{{ pipeCopy.cannotSave }}\" hint-placeholder-val=\"{{ true }}\">\n              <button style=\"height:38px;border:none;background:#e2b3a6;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:not-allowed\">创建并继续编辑</button>\n            </sc-if>\n          </div>\n        </div>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{ newPipe.open }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ newPipe.close }}\" style=\"position:fixed;inset:0;background:rgba(34,31,28,.34);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div sc-camel-on-click=\"{{ newPipe.stop }}\" style=\"width:min(560px,100%);background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(34,31,28,.24);padding:28px clamp(20px,3vw,32px)\">\n          <div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em\">上传 Pipeline</div>\n          <div style=\"margin-top:8px;font-size:14px;color:var(--forge-muted);line-height:1.7;text-wrap:pretty\">上传 YAML 文件；名称不存在时创建 v1，已存在时追加新版本。</div>\n\n          <div sc-camel-on-click=\"{{ newPipe.pick }}\" style=\"margin-top:20px;border:1px dashed #d3cabd;background:#faf8f5;border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer\" style-hover=\"border-color:var(--forge-accent)\">\n            <div style=\"display:inline-flex;align-items:center;height:38px;padding:0 18px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;font-size:14px;color:var(--forge-text)\">选择 YAML 文件</div>\n            <div style=\"margin-top:12px;font-size:13px;color:var(--forge-muted)\">{{ newPipe.hint }}</div>\n          </div>\n\n          <sc-if value=\"{{ newPipe.hasFile }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;border:1px solid #ece7df;background:var(--forge-subtle);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:66px minmax(0,1fr);gap:6px 12px;align-items:baseline\">\n              <sc-for list=\"{{ newPipe.parsed }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:12px;color:var(--forge-muted);white-space:nowrap\">{{ f.k }}</div>\n                <div style=\"font-size:13px;color:var(--forge-text);overflow-wrap:anywhere\">{{ f.v }}</div>\n              </sc-for>\n            </div>\n          </sc-if>\n\n          <div style=\"margin-top:22px;display:flex;justify-content:flex-end;gap:9px\">\n            <button sc-camel-on-click=\"{{ newPipe.close }}\" style=\"height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 18px;font-size:14px;color:var(--forge-muted);cursor:pointer\">取消</button>\n            <sc-if value=\"{{ newPipe.canCreate }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ newPipe.create }}\" style=\"height:38px;border:none;background:var(--forge-accent);color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--forge-accent-hover)\">确认创建</button>\n            </sc-if>\n            <sc-if value=\"{{ newPipe.cannotCreate }}\" hint-placeholder-val=\"{{ true }}\">\n              <button style=\"height:38px;border:none;background:#e2b3a6;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:not-allowed\">确认创建</button>\n            </sc-if>\n          </div>\n        </div>\n      </div>\n    </sc-if>\n    <div class=\"forge-page\" style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <sc-if value=\"{{ rerollBanner }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:18px;border:1px solid #eabaa8;background:#fdf5f2;border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap\">\n          <div style=\"width:26px;height:26px;flex:none;border-radius:50%;background:#fff;border:1px solid #eabaa8;color:var(--forge-accent);display:flex;align-items:center;justify-content:center\">\n            <svg class=\"forge-icon\" data-phosphor=\"arrow-clockwise\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A95.44,95.44,0,0,1,128,224h-1.32A96,96,0,1,1,195.75,60L224,85.8V56a8,8,0,1,1,16,0Z\"></path></svg>\n          </div>\n          <div style=\"flex:1;min-width:220px\">\n            <div style=\"font-size:14px;font-weight:600;color:var(--forge-accent-hover)\">Reroll · {{ rerollName }}</div>\n            <div style=\"margin-top:5px;font-size:13px;color:var(--forge-muted);line-height:1.65;text-wrap:pretty\">{{ rerollHintText }}</div>\n          </div>\n          <div sc-camel-on-click=\"{{ clearReroll }}\" style=\"flex:none;font-size:13px;color:var(--forge-muted);cursor:pointer\" style-hover=\"color:var(--forge-text)\">取消 reroll</div>\n        </div>\n      </sc-if>\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">Pipeline</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:var(--forge-muted)\">{{ pipeSubtitle }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <button sc-camel-on-click=\"{{ openNewPipe }}\" style=\"height:38px;border:none;background:var(--forge-accent);color:#fff;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:var(--forge-accent-hover)\"><svg class=\"forge-icon\" data-phosphor=\"plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"></path></svg> 新建 Pipeline</button>\n      </div>\n\n      <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap\">\n        <div style=\"position:relative;flex:1;min-width:210px;max-width:340px\">\n          <div style=\"position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none\">\n            <svg class=\"forge-icon\" data-phosphor=\"magnifying-glass\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--forge-muted)\"><path d=\"M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z\"></path></svg>\n          </div>\n          <input sc-camel-on-change=\"{{ onPipeQuery }}\" value=\"{{ pipeQuery }}\" placeholder=\"搜索 Pipeline 名称…\" style=\"width:100%;height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 12px 0 34px;font-size:14px;color:var(--forge-text)\">\n        </div>\n        <div style=\"display:flex;gap:2px;background:var(--forge-border);border-radius:10px;padding:3px\">\n          <sc-for list=\"{{ pipeFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};white-space:nowrap;box-shadow:{{ f.shadow }}\">{{ f.label }}</div>\n          </sc-for>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div style=\"font-size:13px;color:var(--forge-muted)\">{{ pipeCount }}</div>\n      </div>\n\n      <div style=\"background:#fff;border:1px solid var(--forge-border);border-radius:14px;overflow:hidden\">\n        <div>\n          <div>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1.7fr) 62px 50px clamp(78px,9vw,104px) 62px clamp(92px,10vw,110px) clamp(74px,8vw,88px) 28px;gap:clamp(8px,1vw,12px);padding:10px 18px;background:#faf8f5;border-bottom:1px solid var(--forge-border);font-size:12px;color:var(--forge-muted);white-space:nowrap\">\n              <div>名称</div>\n              <div>当前版本</div>\n              <div>节点</div>\n              <div>最近运行</div>\n              <div>运行数</div>\n              <div>成功率</div>\n              <div>均价 / 条</div>\n              <div></div>\n            </div>\n\n            <sc-for list=\"{{ pipelines }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div>\n                <div sc-camel-on-click=\"{{ p.toggle }}\" style=\"display:grid;grid-template-columns:minmax(0,1.7fr) 62px 50px clamp(78px,9vw,104px) 62px clamp(92px,10vw,110px) clamp(74px,8vw,88px) 28px;gap:clamp(8px,1vw,12px);align-items:center;padding:12px 18px;border-bottom:1px solid #f4f0ea;cursor:pointer;background:{{ p.bg }}\" style-hover=\"background:var(--forge-subtle)\">\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n                      <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}</div>\n                      <sc-if value=\"{{ p.stale }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:12px;color:#8a5a16;border:1px solid #e0c48c;border-radius:6px;padding:1px 8px;white-space:nowrap\">废弃</div>\n                      </sc-if>\n                    </div>\n                    <div style=\"margin-top:5px;font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.owner }} · {{ p.versionCount }}</div>\n                  </div>\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600\">{{ p.version }}</div>\n                  <div style=\"font-size:13px;color:var(--forge-text)\">{{ p.nodes }}</div>\n                  <div style=\"font-size:13px;color:{{ p.lastFg }}\">{{ p.last }}</div>\n                  <div style=\"font-size:13px;color:var(--forge-text)\">{{ p.runs }}</div>\n                  <div style=\"display:flex;align-items:center;gap:7px\">\n                    <div style=\"flex:1;height:5px;border-radius:3px;background:var(--forge-border);overflow:hidden\">\n                      <div style=\"width:{{ p.rateW }};height:100%;background:{{ p.rateColor }}\"></div>\n                    </div>\n                    <div style=\"font-size:13px;font-weight:600;color:{{ p.rateColor }};white-space:nowrap\">{{ p.rate }}</div>\n                  </div>\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--forge-text);white-space:nowrap\">{{ p.unitCost }}</div>\n                  <div style=\"font-size:12px;color:var(--forge-muted);text-align:right\"><svg class=\"forge-icon\" data-phosphor=\"caret-down\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"transform:rotate({{ p.chevRotation }})\"><path d=\"M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z\"></path></svg></div>\n                </div>\n\n                <sc-if value=\"{{ p.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-bottom:1px solid var(--forge-border);background:var(--forge-subtle);padding:16px 18px\">\n\n                    <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap\">\n                      <div style=\"flex:1;min-width:100px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\">\n                        <div style=\"font-size:12px;color:var(--forge-muted)\">累计成本</div>\n                        <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600\">{{ p.cost }}</div>\n                        <div style=\"font-size:12px;color:var(--forge-muted)\">· {{ p.runs }}</div>\n                      </div>\n                      <button sc-camel-on-click=\"{{ p.copy }}\" style=\"height:34px;border:1px solid var(--forge-control-border);background:#fff;border-radius:8px;padding:0 13px;font-size:13px;color:var(--forge-text);cursor:pointer;white-space:nowrap;flex:none\" style-hover=\"border-color:#c1b8ab\">{{ p.copyLabel }}</button>\n                      <button sc-camel-on-click=\"{{ p.run }}\" style=\"height:34px;border:none;background:var(--forge-accent);color:#fff;border-radius:8px;padding:0 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:var(--forge-accent-hover)\">新建运行</button>\n                    </div>\n\n                    <div>\n                      <div>\n                        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n                          <div style=\"font-size:12px;color:var(--forge-muted)\">流程 · {{ p.nodes }}节点</div>\n                          <div sc-camel-on-click=\"{{ p.edit }}\" title=\"在完整页面中查看和编辑流程\" style=\"width:24px;height:24px;flex:none;border-radius:6px;border:1px solid var(--forge-control-border);background:#fff;color:var(--forge-muted);display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"border-color:var(--forge-accent);color:var(--forge-accent)\">\n                            <svg class=\"forge-icon\" data-phosphor=\"arrows-out-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,48V96a8,8,0,0,1-16,0V67.31l-50.34,50.35a8,8,0,0,1-11.32-11.32L188.69,56H160a8,8,0,0,1,0-16h48A8,8,0,0,1,216,48ZM106.34,138.34,56,188.69V160a8,8,0,0,0-16,0v48a8,8,0,0,0,8,8H96a8,8,0,0,0,0-16H67.31l50.35-50.34a8,8,0,0,0-11.32-11.32Z\"></path></svg>\n                          </div>\n                        </div>\n                        <div style=\"border:1px solid #ece7df;border-radius:10px;background:var(--forge-subtle);padding:13px 14px;overflow-x:auto\">\n                          <div style=\"display:flex;align-items:stretch;gap:0;min-width:0\">\n                            <sc-for list=\"{{ p.dag }}\" as=\"d\" hint-placeholder-count=\"5\">\n                              <div style=\"display:flex;align-items:center;flex:none\">\n                                <div style=\"display:flex;flex-direction:column;gap:5px;border:1px solid {{ d.border }};background:{{ d.bg }};border-radius:8px;padding:8px 11px\">\n                                  <div style=\"display:flex;align-items:center;gap:6px\">\n                                    <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-text);white-space:nowrap;letter-spacing:-0.01em\">{{ d.name }}</div>\n                                  </div>\n                                  <div style=\"display:flex;align-items:center;gap:5px\">\n                                    <div style=\"width:5px;height:5px;border-radius:50%;background:{{ d.accent }};flex:none\"></div>\n                                    <div style=\"font-size:12px;color:{{ d.kindFg }};letter-spacing:.06em;white-space:nowrap\">{{ d.kind }}</div>\n                                  </div>\n                                </div>\n                                <sc-if value=\"{{ d.hasArrow }}\" hint-placeholder-val=\"{{ true }}\">\n                                  <div style=\"width:16px;height:1.5px;background:var(--forge-control-border);flex:none\"></div>\n                                </sc-if>\n                              </div>\n                            </sc-for>\n                          </div>\n                        </div>\n\n                        <div style=\"margin-top:14px\">\n                          <div style=\"font-size:12px;color:var(--forge-muted);margin-bottom:8px\">版本历史</div>\n                          <div style=\"border:1px solid #ece7df;border-radius:10px;background:#fff;overflow:hidden\">\n                            <sc-for list=\"{{ p.versions }}\" as=\"v\" hint-placeholder-count=\"3\">\n                              <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr) 92px;gap:12px;align-items:baseline;padding:9px 13px;border-bottom:1px solid #f4f0ea\">\n                                <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;color:{{ v.fg }}\">{{ v.tag }}</div>\n                                <div style=\"font-size:13px;color:var(--forge-text);line-height:1.6;overflow-wrap:anywhere\">{{ v.change }}</div>\n                                <div style=\"font-size:12px;color:var(--forge-muted);text-align:right;white-space:nowrap\">{{ v.when }}</div>\n                              </div>\n                            </sc-for>\n                          </div>\n                        </div>\n                      </div>\n\n                    </div>\n                  </div>\n                </sc-if>\n              </div>\n            </sc-for>\n            <sc-if value=\"{{ pipeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:34px 18px;text-align:center\">\n                <div style=\"font-size:14px;color:var(--forge-muted)\">没有匹配的 Pipeline</div>\n                <div sc-camel-on-click=\"{{ clearPipeQuery }}\" style=\"margin-top:9px;font-size:13px;color:var(--forge-accent);cursor:pointer\">清除搜索与筛选</div>\n              </div>\n            </sc-if>\n          </div>\n        </div>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isDelivery }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"forge-page\" style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">交付</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:var(--forge-muted)\">{{ delivery.subtitle }}</div>\n        </div>\n        <button type=\"button\" class=\"forge-delivery-primary forge-delivery-create\" sc-camel-on-click=\"{{ delivery.create }}\"><svg class=\"forge-icon\" data-phosphor=\"plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"></path></svg><span>创建数据单</span></button>\n      </div>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:2px;background:var(--forge-border);border-radius:10px;padding:3px\">\n          <sc-for list=\"{{ delivery.cats }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};white-space:nowrap;box-shadow:{{ f.shadow }}\">{{ f.label }}</div>\n          </sc-for>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div style=\"font-size:13px;color:var(--forge-muted);white-space:nowrap\">{{ delivery.count }}</div>\n        <div style=\"position:relative\">\n          <div sc-camel-on-click=\"{{ delivery.toggleSort }}\" style=\"display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;font-size:13px;color:var(--forge-text);cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#c1b8ab\">\n            {{ delivery.sortLabel }}\n            <svg class=\"forge-icon\" data-phosphor=\"caret-down\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--forge-muted)\"><path d=\"M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z\"></path></svg>\n          </div>\n          <sc-if value=\"{{ delivery.sortOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:calc(100% + 6px);right:0;min-width:140px;background:#fff;border:1px solid var(--forge-control-border);border-radius:10px;padding:5px;box-shadow:0 8px 22px rgba(34,31,28,.12);z-index:30\">\n              <sc-for list=\"{{ delivery.sorts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:8px;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};white-space:nowrap\" style-hover=\"background:#f7f4ef\">\n                  <div style=\"width:12px;flex:none;color:var(--forge-accent)\"><sc-if value=\"{{ o.mark }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"forge-icon\" data-phosphor=\"check\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"></path></svg></sc-if></div>{{ o.label }}\n                </div>\n              </sc-for>\n            </div>\n          </sc-if>\n        </div>\n      </div>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <sc-for list=\"{{ delivery.customers }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap\">\n              <sc-if value=\"{{ c.hasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"forge-delivery-customer-logo\" src=\"{{ c.logo }}\" alt=\"{{ c.logoAlt }}\" /></sc-if>\n              <div style=\"font-size:15px;font-weight:600\">{{ c.name }}</div>\n              <div style=\"font-size:13px;color:var(--forge-muted)\">{{ c.meta }}</div>\n            </div>\n\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n              <sc-for list=\"{{ c.sheets }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ d.open }}\" style=\"background:#fff;border:1px solid var(--forge-border);border-radius:12px;padding:16px 18px;cursor:pointer\" style-hover=\"border-color:#c1b8ab\">\n                  <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}</div>\n                      <div style=\"margin-top:5px;font-size:12px;color:var(--forge-muted)\">{{ d.created }}</div>\n                    </div>\n                    <div style=\"font-size:12px;border-radius:6px;padding:3px 10px;border:1px solid {{ d.badgeBorder }};color:{{ d.badgeFg }};white-space:nowrap;flex:none\">{{ d.badge }}</div>\n                  </div>\n\n                  <div style=\"margin-top:14px;display:flex;height:8px;border-radius:4px;background:var(--forge-border);overflow:hidden\">\n                    <div style=\"width:{{ d.segPass }};background:#5f9a63\"></div>\n                    <div style=\"width:{{ d.segReview }};background:#c8912f\"></div>\n                    <div style=\"width:{{ d.segFail }};background:#a5321f\"></div>\n                  </div>\n\n                  <div style=\"margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px\">\n                    <sc-for list=\"{{ d.funnel }}\" as=\"f\" hint-placeholder-count=\"4\">\n                      <div style=\"min-width:0\">\n                        <div style=\"display:flex;align-items:center;gap:5px\">\n                          <div style=\"width:6px;height:6px;border-radius:2px;background:{{ f.color }};flex:none\"></div>\n                          <div style=\"font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ f.k }}</div>\n                        </div>\n                        <div style=\"margin-top:4px;font-size:15px;font-weight:600;color:{{ f.fg }};line-height:1\">{{ f.v }}</div>\n                      </div>\n                    </sc-for>\n                  </div>\n\n                  <div style=\"margin-top:13px;padding-top:11px;border-top:1px solid var(--forge-border);display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                    <div style=\"flex:1;min-width:120px;font-size:12px;color:var(--forge-muted)\">{{ d.hint }}</div>\n                    <div style=\"font-size:13px;color:var(--forge-accent);white-space:nowrap\">查看子项 <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></div>\n                  </div>\n                </div>\n              </sc-for>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isSheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"forge-page\" style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div sc-camel-on-click=\"{{ goDelivery }}\" style=\"display:inline-block;font-size:13px;color:var(--forge-muted);margin-bottom:16px;cursor:pointer\" style-hover=\"color:var(--forge-text)\"><svg class=\"forge-icon\" data-phosphor=\"arrow-left\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z\"></path></svg> 返回交付</div>\n\n      <div style=\"display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px\">\n        <div style=\"min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <sc-if value=\"{{ sheet.extras.hasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"forge-delivery-sheet-logo\" src=\"{{ sheet.extras.logo }}\" alt=\"{{ sheet.extras.logoAlt }}\" /></sc-if>\n            <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">{{ sheet.name }}</h1>\n            <div style=\"font-size:12px;color:var(--forge-accent);border:1px solid #eabaa8;background:#fdf5f2;border-radius:999px;padding:3px 10px\">{{ sheet.customer }}</div>\n          </div>\n          <div style=\"margin-top:8px;font-size:14px;color:var(--forge-muted)\">{{ sheet.desc }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ sheet.edit }}\" style=\"height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 15px;font-size:14px;color:var(--forge-text);cursor:pointer\" style-hover=\"border-color:#c1b8ab\">编辑数据单</button>\n          <button style=\"height:38px;border:none;background:var(--forge-accent);color:#fff;border-radius:10px;padding:0 17px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--forge-accent-hover)\">{{ sheet.exportLabel }}</button>\n        </div>\n      </div>\n\n<!-- delivery-sheet-extras:start -->\n<sc-if value=\"{{ sheet.extras.visible }}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"forge-delivery-sheet-extras\" aria-label=\"交付清单与审核技能\">\n    <div class=\"forge-delivery-section-heading\"><h2>List 清单 <span class=\"forge-delivery-heading-count\">{{ sheet.extras.count }}</span></h2><div class=\"forge-delivery-extra-actions\"><sc-if value=\"{{ sheet.extras.hasArchive }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"forge-delivery-text-button\" sc-camel-on-click=\"{{ sheet.extras.downloadArchive }}\"><svg class=\"forge-icon\" data-phosphor=\"paperclip\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M209.66,122.34a8,8,0,0,1,0,11.32l-82.05,82a56,56,0,0,1-79.2-79.21L147.67,35.73a40,40,0,1,1,56.61,56.55L105,193A24,24,0,1,1,71,159L154.3,74.38A8,8,0,1,1,165.7,85.6L82.39,170.31a8,8,0,1,0,11.27,11.36L192.93,81A24,24,0,1,0,159,47L59.76,147.68a40,40,0,1,0,56.53,56.62l82.06-82A8,8,0,0,1,209.66,122.34Z\"></path></svg>{{ sheet.extras.archiveName }}</button></sc-if><sc-if value=\"{{ sheet.extras.hasTags }}\" hint-placeholder-val=\"{{ false }}\"><select aria-label=\"按 Tag 筛选清单\" value=\"{{ sheet.extras.filter }}\" sc-camel-on-change=\"{{ sheet.extras.onFilter }}\"><option value=\"\">全部 Tag</option><sc-for list=\"{{ sheet.extras.tags }}\" as=\"tag\" hint-placeholder-count=\"0\"><option value=\"{{ tag.id }}\" label=\"{{ tag.name }}\">{{ tag.name }}</option></sc-for></select></sc-if></div></div>\n    <sc-if value=\"{{ sheet.extras.hasEntries }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"forge-delivery-saved-list\"><sc-for list=\"{{ sheet.extras.entries }}\" as=\"entry\" hint-placeholder-count=\"0\"><div class=\"forge-delivery-saved-entry\"><strong title=\"{{ entry.source }}\">{{ entry.name }}</strong><span class=\"forge-delivery-help\">{{ entry.status }}</span><sc-if value=\"{{ entry.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"forge-delivery-tag\" style=\"background:{{ entry.tagColor }};color:{{ entry.tagFg }}\">{{ entry.tagName }}</span></sc-if></div></sc-for></div><p class=\"forge-delivery-help\">显示 {{ sheet.extras.shownCount }} / {{ sheet.extras.count }} 项 · 未关联条目不会计入交付完成数</p></sc-if>\n    <sc-if value=\"{{ sheet.extras.emptyEntries }}\" hint-placeholder-val=\"{{ true }}\"><p class=\"forge-delivery-help\">还没有清单条目，可通过顶部「编辑数据单」上传 ZIP 或粘贴文本。</p></sc-if>\n    <sc-if value=\"{{ sheet.extras.hasSkills }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"forge-delivery-bound-skills\"><strong>审核 Skill <span>{{ sheet.extras.skillCount }}</span></strong><div><sc-for list=\"{{ sheet.extras.skills }}\" as=\"skill\" hint-placeholder-count=\"0\"><span class=\"forge-delivery-skill-token\" title=\"{{ skill.description }}\">{{ skill.command }}</span></sc-for></div><p class=\"forge-delivery-help\">在已关联 Item 的审核会话中调用 · 演示模式</p></div></sc-if>\n  </section>\n</sc-if>\n<!-- delivery-sheet-extras:end -->\n      <div style=\"background:#fff;border:1px solid var(--forge-border);border-radius:12px;padding:16px 18px;margin-bottom:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px\">\n          <div style=\"font-size:14px;font-weight:600\">履约进度</div>\n          <div style=\"flex:1\"></div>\n          <div style=\"font-size:13px;color:var(--forge-muted)\">{{ sheet.progressHint }}</div>\n        </div>\n        <div style=\"display:flex;height:10px;border-radius:6px;background:var(--forge-border);overflow:hidden\">\n          <div style=\"width:{{ sheet.segPass }};background:#5f9a63\"></div>\n          <div style=\"width:{{ sheet.segReview }};background:#c8912f\"></div>\n          <div style=\"width:{{ sheet.segFail }};background:#a5321f\"></div>\n        </div>\n        <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px\">\n          <sc-for list=\"{{ sheet.funnel }}\" as s=\"forge-icon\" data-phosphor=\"magnifying-glass\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--forge-muted)\"><path d=\"M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z\"></path></svg></div>\n              <input sc-camel-on-change=\"{{ sheet.onQuery }}\" value=\"{{ sheet.query }}\" placeholder=\"搜索子项、Item ID、Run ID 或状态\" style=\"width:100%;height:36px;border:1px solid var(--forge-control-border);background:#fff;border-radius:9px;padding:0 34px;font-size:13px;color:var(--forge-text)\">\n              <sc-if value=\"{{ sheet.hasQuery }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ sheet.clearQuery }}\" style=\"position:absolute;right:7px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--forge-muted);cursor:pointer\" style-hover=\"background:#f2efe9\" aria-label=\"清除搜索\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></div></sc-if>\n            </div>\n            <div style=\"flex:1\"></div>\n            <div style=\"font-size:13px;color:var(--forge-muted);white-space:nowrap\">{{ sheet.count }}</div>\n          </div>\n\n          <sc-if value=\"{{ sheet.showTip }}\" hint-placeholder-val=\"{{ true }}\">\n            <div role=\"status\" style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff8e8;border-bottom:1px solid #f0e0b9\">\n              <div style=\"width:22px;height:22px;flex:none;border-radius:6px;background:#fff;color:#8a5a16;border:1px solid #e0c48c;display:flex;align-items:center;justify-content:center\">\n                <svg class=\"forge-icon\" data-phosphor=\"cursor\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M168,132.69,214.08,115l.33-.13A16,16,0,0,0,213,85.07L52.92,32.8A15.95,15.95,0,0,0,32.8,52.92L85.07,213a15.82,15.82,0,0,0,14.41,11l.78,0a15.84,15.84,0,0,0,14.61-9.59l.13-.33L132.69,168,184,219.31a16,16,0,0,0,22.63,0l12.68-12.68a16,16,0,0,0,0-22.63ZM195.31,208,144,156.69a16,16,0,0,0-26,4.93c0,.11-.09.22-.13.32l-17.65,46L48,48l159.85,52.2-45.95,17.64-.32.13a16,16,0,0,0-4.93,26h0L208,195.31Z\"></path></svg>\n              </div>\n              <div style=\"flex:1;min-width:0;font-size:12px;color:var(--forge-muted);line-height:1.65;text-wrap:pretty\">点击任一子项打开大窗口查看产物、版本关系与审核记录；使用 <span role=\"img\" aria-label=\"上方向键\"><svg class=\"forge-icon\" data-phosphor=\"arrow-up\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,117.66a8,8,0,0,1-11.32,0L136,59.31V216a8,8,0,0,1-16,0V59.31L61.66,117.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0l72,72A8,8,0,0,1,205.66,117.66Z\"></path></svg></span> <span role=\"img\" aria-label=\"下方向键\"><svg class=\"forge-icon\" data-phosphor=\"arrow-down\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,149.66l-72,72a8,8,0,0,1-11.32,0l-72-72a8,8,0,0,1,11.32-11.32L120,196.69V40a8,8,0,0,1,16,0V196.69l58.34-58.35a8,8,0,0,1,11.32,11.32Z\"></path></svg></span> 切换，Esc 关闭。</div>\n              <button sc-camel-on-click=\"{{ sheet.hideTip }}\" style=\"flex:none;height:28px;padding:0 10px;border:1px solid #e0c48c;background:#fff;border-radius:7px;font-size:12px;color:#8a5a16;cursor:pointer;white-space:nowrap\" style-hover=\"background:#fffdf8;border-color:#c8912f\">知道了</button>\n            </div>\n          </sc-if>\n\n          <div style=\"display:grid;grid-template-columns:52px minmax(0,1.5fr) minmax(0,1.1fr) clamp(92px,11vw,116px);gap:clamp(9px,1.2vw,14px);padding:10px 16px;background:#faf8f5;border-bottom:1px solid var(--forge-border);font-size:12px;color:var(--forge-muted);white-space:nowrap\">\n            <div>预览</div>\n            <div>子项</div>\n            <div>目录</div>\n            <div>状态</div>\n          </div>\n\n          <sc-for list=\"{{ sheet.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div sc-camel-on-click=\"{{ r.select }}\" style=\"display:grid;grid-template-columns:52px minmax(0,1.5fr) minmax(0,1.1fr) clamp(92px,11vw,116px);gap:clamp(9px,1.2vw,14px);align-items:center;padding:11px 16px;border-bottom:1px solid #f4f0ea;cursor:pointer;background:{{ r.bg }};border-left:3px solid {{ r.mark }}\" style-hover=\"background:var(--forge-subtle)\">\n              <div style=\"height:38px;border-radius:10px;border:1px solid var(--forge-border);background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px)\"></div>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}</div>\n                <div style=\"margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.id }}</div>\n              </div>\n              <div style=\"font-size:13px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.path }}</div>\n              <div>\n                <div style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;color:{{ r.fg }};border:1px solid {{ r.border }};border-radius:6px;padding:2px 10px;white-space:nowrap\">\n                  <div style=\"width:5px;height:5px;border-radius:50%;background:{{ r.dot }}\"></div>{{ r.state }}\n                </div>\n              </div>\n            </div>\n          </sc-for>\n          <sc-if value=\"{{ sheet.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:52px 20px;text-align:center\">\n              <div style=\"font-size:14px;font-weight:600;color:var(--forge-text)\">没有符合该状态的子项</div>\n              <div style=\"margin-top:7px;font-size:13px;color:var(--forge-muted);line-height:1.7\">{{ sheet.emptyHint }}</div>\n              <div sc-camel-on-click=\"{{ sheet.clearFilter }}\" style=\"margin-top:14px;display:inline-block;font-size:13px;color:var(--forge-accent);cursor:pointer\">{{ sheet.emptyCta }}</div>\n            </div>\n          </sc-if>\n        </div>\n        </div>\n\n        <sc-if value=\"{{ sheet.hasPick }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"forge-sheet-overlay\" sc-camel-on-click=\"{{ sheet.closePick }}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ sheet.pick.name }} Item 详情\" style=\"position:fixed;inset:0;z-index:90;background:rgba(34,31,28,.46);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:18px\">\n          <div class=\"forge-sheet-dialog\" sc-camel-on-click=\"{{ sheet.stopPick }}\" style=\"position:relative;width:min(1500px,calc(100vw - 36px));height:min(920px,calc(100vh - 36px));min-width:0;background:#fff;border:1px solid var(--forge-border);border-radius:16px;overflow:hidden;box-shadow:0 26px 72px rgba(34,31,28,.26)\">\n            <div class=\"forge-sheet-close\" sc-camel-on-click=\"{{ sheet.closePick }}\" aria-label=\"关闭 Item 详情\" style=\"position:absolute;top:15px;right:15px;z-index:6;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid var(--forge-control-border);color:var(--forge-muted);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"color:var(--forge-text)\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></div>\n\n            <sc-if value=\"{{ sheet.hasPick }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"forge-sheet-grid\">\n\n                <div class=\"forge-sheet-preview\" style=\"grid-column:1;grid-row:1 / 3;min-width:0;min-height:0;position:relative;border-right:1px solid var(--forge-border);background-color:#2b2b28;background-image:radial-gradient(circle at 50% 42%,rgba(90,90,80,.44),rgba(31,31,29,.2) 34%,rgba(24,24,23,.68) 78%),repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 8px,rgba(255,255,255,0) 8px 16px);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden\">\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#d7d3cc;background:rgba(28,28,26,.78);border:1px solid rgba(255,255,255,.14);border-radius:7px;padding:7px 12px;pointer-events:none\">{{ sheet.pick.previewCaption }}</div>\n                  \n                  <div style=\"position:absolute;bottom:14px;left:16px;display:flex;align-items:center;gap:7px\">\n                    <div sc-camel-on-click=\"{{ sheet.prev }}\" style=\"width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.92);border:1px solid var(--forge-control-border);color:var(--forge-muted);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer\" aria-label=\"上一项\"><svg class=\"forge-icon\" data-phosphor=\"arrow-up\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,117.66a8,8,0,0,1-11.32,0L136,59.31V216a8,8,0,0,1-16,0V59.31L61.6
