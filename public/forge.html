ardBorder }};border-left:4px solid {{ n.accent }};border-radius:12px;background:#fff;box-shadow:{{ n.shadow }};padding:clamp(11px,1.3vw,14px) clamp(12px,1.4vw,15px);cursor:pointer\">\n                  <div style=\"display:flex;align-items:center;gap:clamp(7px,1vw,10px)\">\n                    <div sc-camel-on-click=\"{{ n.toggle }}\" style=\"width:24px;height:24px;flex:none;border-radius:6px;border:1.5px solid {{ n.boxBorder }};background:{{ n.boxBg }};color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer\"><sc-if value=\"{{ n.check }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"forge-icon\" data-phosphor=\"check\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"></path></svg></sc-if></div>\n                    <div style=\"width:9px;height:9px;flex:none;border-radius:2px;background:{{ n.accent }};transform:rotate(45deg)\"></div>\n                    <div style=\"flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(12.5px,1.1vw,14px);font-weight:600;color:var(--forge-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.name }}</div>\n                    <div style=\"flex:none;font-size:12px;color:{{ n.kindFg }};background:{{ n.kindBg }};border-radius:6px;padding:1px 8px;letter-spacing:.06em;white-space:nowrap\">{{ n.kind }}</div>\n                  </div>\n                  <div style=\"margin-top:12px;height:6px;border-radius:3px;background:var(--forge-border);overflow:hidden\">\n                    <div style=\"width:{{ n.progW }};height:100%;background:{{ n.accent }}\"></div>\n                  </div>\n                  <div style=\"margin-top:8px;display:flex;align-items:baseline;gap:8px\">\n                    <div style=\"flex:1;min-width:0;font-size:12px; 50%;background:{{ s.dotBg }};border:1.5px solid {{ s.dotBorder }};color:{{ s.dotFg }};font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none\"><sc-if value=\"{{ s.markDone }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"forge-icon\" data-phosphor=\"check\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"></path></svg></sc-if><sc-if value=\"{{ s.markPending }}\" hint-placeholder-val=\"{{ false }}\">{{ s.mark }}</sc-if></div>\n                  <div style=\"flex:1;height:2px;background:{{ s.lineR }}\"></div>\n                </div>\n                <div sc-camel-on-click=\"{{ s.click }}\" style=\"margin-top:9px;padding:0 8px;text-align:center;cursor:{{ s.cursor }};min-width:0\">\n                  <div style=\"font-size:13px;color:{{ s.labelFg }};font-weight:{{ s.labelWeight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.label }}</div>\n                  <div style=\"margin-top:4px;font-size:12px;color:{{ s.valueFg }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.value }}</div>\n                  <sc-if value=\"{{ s.hasAction }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:4px;font-size:12px;color:var(--forge-accent)\">{{ s.action }} <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></div>\n                  </sc-if>\n                </div>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n      </sc-if>\n\n      <div order-radius:10px;padding:0 17px;font-size:13px;font-weight:600;cursor:not-allowed\">{{ importCta }}</button>\n            </sc-if>\n          </div>\n        </div>\n      </sc-if>\n\n      <div style=\"display:flex;align-items:flex-start;gap:14px\">\n\n        <div style=\"flex:1 1 0;min-width:0;background:#fff;border:1px solid var(--forge-border);border-radius:14px;overflow:hidden;position:sticky;top:calc(var(--forge-topbar-height) + 62px);height:max(660px,calc(100vh - var(--forge-topbar-height) - 82px));display:flex;flex-direction:column\">\n          <div style=\"flex:none;display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--forge-border);flex-wrap:wrap\">\n            <div style=\"position:relative;flex:1;min-width:190px\">\n              <div style=\"position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none\">\n                <svg class=\"forge-icon\" data-phosphor=\"magnifying-glass\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"color:var(--forge-muted)\"><path d=\"M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z\"></path></svg>\n              </div>\n              <input sc-camel-on-change=\"{{ onDsQuery }}\" value=\"{{ dsQuery }}\" placeholder=\"搜索数据集，或直接搜 SD / PA / style_tag…\" style=\"width:100%;height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 12px 0 34px;font-size:14px;color:var(--forge-text)\">\n            </div>\n            <div style=\"font-size:13px;color:var(--forge-muted);white-space:nowrap\">{{ dsCount }}</div>\n          </div>\n\n          <div style=\"flex:1;min-height:0;overflow-y:auto\">\n          <sc-for list=\"{{ dsGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div>\n              <div style=\"padding:9px 16px;backg dius:10px;background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px);display:flex;align-items:center;justify-content:center;min-height:min(70vh,620px)\">\n          <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-muted);background:rgba(255,255,255,.92);border:1px solid var(--forge-border);border-radius:8px;padding:8px 13px\">{{ zoomNote }}</div>\n        </div>\n      </div>\n    </div>\n  </sc-if>\n\n<!-- branch-dialog:start -->\n<dialog class=\"forge-branch-dialog forge-feedback\" aria-labelledby=\"forge-branch-title\" aria-describedby=\"forge-branch-subtitle\" sc-camel-on-cancel=\"{{ branch.cancel }}\" sc-camel-on-click=\"{{ branch.backdrop }}\">\n  <sc-if value=\"{{ branch.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <header class=\"forge-branch-header\">\n      <div><h2 id=\"forge-branch-title\">{{ branch.title }}</h2><p id=\"forge-branch-subtitle\">{{ branch.subtitle }}</p></div>\n      <button type=\"button\" class=\"forge-branch-close\" aria-label=\"关闭创建分支\" sc-camel-on-click=\"{{ branch.cancel }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button>\n    </header>\n    <div class=\"forge-branch-scroll\">\n      <section class=\"forge-branch-source\" aria-label=\"来源版本\">\n        <div class=\"forge-branch-preview\">\n          <sc-if value=\"{{ branch.hasPreview }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ branch.previewImage }}\" alt=\"来源版本产物预览\" /></sc-if>\n          <sc-if value=\"{{ branch.noPreview }}\" hint-placeholder-val=\"{{ true }}\"><svg class=\"forge-icon\" data-phosphor=\"image\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg><span>暂无版本预览</span></sc-if>\n        </div>\n        <div class=\"forge-branch-source-copy\"><span>来源版本</span><strong>{{ branch.sourceLabel }}</strong><p>该来源版本保持不变</p><p class=\"forge-branch-submitted\">{{ branch.submitted }}</p></div>\n      </section>\n      <div class=\"forge-feedback-field\">\n        <label for=\"forge-branch-name\">分支名称</label>\n        <input id=\"forge-branch-name\" value=\"{{ branch.name }}\" sc-camel-on-change=\"{{ branch.onName }}\" maxlength=\"100\" aria-describedby=\"forge-branch-name-help\" aria-invalid=\"{{ branch.duplicate }}\" autofocus />\n        <p id=\"forge-branch-name-help\">用于区分本次独立尝试，可稍后修改</p>\n        <sc-if value=\"{{ branch.duplicate }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ branch.nameError }}</p></sc-if>\n      </div>\n      <div class=\"forge-feedback-field\">\n        <label for=\"forge-branch-note\">本次迭代说明 <span class=\"forge-feedback-required\">*</span></label>\n        <textarea id=\"forge-branch-note\" value=\"{{ branch.note }}\" sc-camel-on-change=\"{{ branch.onNote }}\" placeholder=\"例如：保留主体结构，优化屋顶材质和台阶细节。\" required aria-required=\"true\" maxlength=\"5000\"></textarea>\n      </div>\n      <div class=\"forge-feedback-upload-row\">\n        <label class=\"forge-feedback-upload\" data-disabled=\"{{ branch.full }}\"><svg class=\"forge-icon\" data-phosphor=\"paperclip\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M209.66,122.34a8,8,0,0,1,0,11.32l-82.05,82a56,56,0,0,1-79.2-79.21L147.67,35.73a40,40,0,1,1,56.61,56.55L105,193A24,24,0,1,1,71,159L154.3,74.38A8,8,0,1,1,165.7,85.6L82.39,170.31a8,8,0,1,0,11.27,11.36L192.93,81A24,24,0,1,0,159,47L59.76,147.68a40,40,0,1,0,56.53,56.62l82.06-82A8,8,0,0,1,209.66,122.34Z\"></path></svg><span>上传图片</span><input type=\"file\" accept=\"image/png,image/jpeg,image/webp,image/gif\" multiple disabled=\"{{ branch.full }}\" aria-label=\"上传分支参考图片\" sc-camel-on-change=\"{{ branch.upload }}\" /></label>\n        <span class=\"forge-feedback-paste\"><svg class=\"forge-icon\" data-phosphor=\"clipboard\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,32H163.74a47.92,47.92,0,0,0-71.48,0H56A16,16,0,0,0,40,48V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm-72,0a32,32,0,0,1,32,32H96A32,32,0,0,1,128,32Zm72,184H56V48H82.75A47.93,47.93,0,0,0,80,64v8a8,8,0,0,0,8,8h80a8,8,0,0,0,8-8V64a47.93,47.93,0,0,0-2.75-16H200Z\"></path></svg> Ctrl/⌘ + V 粘贴图片</span><span class=\"forge-feedback-count\">{{ branch.count }}</span>\n      </div>\n      <p class=\"forge-feedback-limit\">PNG、JPG、WebP、GIF · 单张不超过 10 MB</p>\n      <div class=\"forge-feedback-attachments\" aria-live=\"polite\">\n        <sc-for list=\"{{ branch.images }}\" as=\"img\" hint-placeholder-count=\"0\">\n          <div class=\"forge-feedback-attachment\">\n            <sc-if value=\"{{ img.ready }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ img.url }}\" alt=\"{{ img.name }}\" /></sc-if>\n            <sc-if value=\"{{ img.loading }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"forge-feedback-image-loading\"><svg class=\"forge-icon\" data-phosphor=\"image\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg></span></sc-if>\n            <div><strong title=\"{{ img.name }}\">{{ img.name }}</strong><span>{{ img.sizeLabel }}</span></div>\n            <button type=\"button\" sc-camel-on-click=\"{{ img.remove }}\" aria-label=\"{{ img.removeLabel }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button>\n          </div>\n        </sc-for>\n      </div>\n      <sc-if value=\"{{ branch.hasError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ branch.error }}</p></sc-if>\n      <section class=\"forge-branch-config\">\n        <div class=\"forge-branch-config-heading\"><strong>{{ branch.configHeading }}</strong><button type=\"button\" sc-camel-on-click=\"{{ branch.toggleConfig }}\" aria-expanded=\"{{ branch.configOpen }}\" aria-controls=\"forge-branch-configuration\">{{ branch.configLabel }}<span style=\"display:flex;transform:rotate({{ branch.configRotation }})\"><svg class=\"forge-icon\" data-phosphor=\"caret-down\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z\"></path></svg></span></button></div>\n        <p>{{ branch.configuration }}</p>\n        <sc-if value=\"{{ branch.configOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div id=\"forge-branch-configuration\" class=\"forge-branch-config-fields\">\n            <label for=\"forge-branch-pipeline\">Pipeline</label>\n            <select id=\"forge-branch-pipeline\" value=\"{{ branch.pipe }}\" sc-camel-on-change=\"{{ branch.onPipe }}\"><option value=\"\">选择 Pipeline</option><sc-for list=\"{{ branch.pipelines }}\" as=\"opt\" hint-placeholder-count=\"1\"><option value=\"{{ opt.value }}\">{{ opt.label }}</option></sc-for></select>\n            <label for=\"forge-branch-dataset\">数据集</label>\n            <select id=\"forge-branch-dataset\" value=\"{{ branch.ds }}\" sc-camel-on-change=\"{{ branch.onDs }}\" disabled=\"{{ branch.dsDisabled }}\"><option value=\"\">选择关联数据集</option><sc-for list=\"{{ branch.datasets }}\" as=\"opt\" hint-placeholder-count=\"1\"><option value=\"{{ opt.value }}\">{{ opt.label }}</option></sc-for></select>\n            <label for=\"forge-branch-item\">Item</label>\n            <select id=\"forge-branch-item\" value=\"{{ branch.item }}\" sc-camel-on-change=\"{{ branch.onItem }}\" disabled=\"{{ branch.itemDisabled }}\"><option value=\"\">选择 Item</option><sc-for list=\"{{ branch.items }}\" as=\"opt\" hint-placeholder-count=\"1\"><option value=\"{{ opt.value }}\">{{ opt.label }}</option></sc-for></select>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ branch.invalidConfig }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"status\">{{ branch.configError }}</p></sc-if>\n      </section>\n      <div class=\"forge-branch-notice\"><svg class=\"forge-icon\" data-phosphor=\"git-branch\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M232,64a32,32,0,1,0-40,31v17a8,8,0,0,1-8,8H96a23.84,23.84,0,0,0-8,1.38V95a32,32,0,1,0-16,0v66a32,32,0,1,0,16,0V144a8,8,0,0,1,8-8h88a24,24,0,0,0,24-24V95A32.06,32.06,0,0,0,232,64ZM64,64A16,16,0,1,1,80,80,16,16,0,0,1,64,64ZM96,192a16,16,0,1,1-16-16A16,16,0,0,1,96,192ZM200,80a16,16,0,1,1,16-16A16,16,0,0,1,200,80Z\"></path></svg><p>独立分支不会改变当前主线，也不计入主线 20 轮。通过后可再采纳为主线候选。</p></div>\n    </div>\n    <footer class=\"forge-branch-footer\"><button type=\"button\" class=\"forge-feedback-secondary\" sc-camel-on-click=\"{{ branch.cancel }}\">取消</button><button type=\"button\" class=\"forge-feedback-primary\" disabled=\"{{ branch.disabled }}\" sc-camel-on-click=\"{{ branch.create }}\">创建分支并运行 <kbd>⌘ / Ctrl + Enter</kbd></button></footer>\n  </sc-if>\n</dialog>\n<!-- branch-dialog:end -->\n\n<!-- delivery-editor:start -->\n<dialog class=\"forge-delivery-editor forge-feedback\" aria-labelledby=\"forge-delivery-title\" sc-camel-on-cancel=\"{{ deliveryEditor.cancel }}\" sc-camel-on-click=\"{{ deliveryEditor.backdrop }}\">\n  <sc-if value=\"{{ deliveryEditor.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <header class=\"forge-delivery-editor-header\"><div><h2 id=\"forge-delivery-title\">{{ deliveryEditor.title }}</h2><p>配置交付目标、客户清单与审核技能</p></div><button type=\"button\" class=\"forge-delivery-icon-button\" sc-camel-on-click=\"{{ deliveryEditor.cancel }}\" aria-label=\"关闭数据单编辑\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button></header>\n    <nav class=\"forge-delivery-editor-tabs\" aria-label=\"数据单配置步骤\"><sc-for list=\"{{ deliveryEditor.tabs }}\" as=\"tab\" hint-placeholder-count=\"3\"><button type=\"button\" aria-pressed=\"{{ tab.selected }}\" sc-camel-on-click=\"{{ tab.pick }}\">{{ tab.label }}</button></sc-for></nav>\n    <div class=\"forge-delivery-editor-scroll\">\n      <sc-if value=\"{{ deliveryEditor.basic }}\" hint-placeholder-val=\"{{ true }}\">\n        <section aria-label=\"数据单基础信息\">\n          <div class=\"forge-delivery-field\"><label for=\"forge-delivery-name\">数据单名称 <span>*</span></label><input id=\"forge-delivery-name\" value=\"{{ deliveryEditor.name }}\" sc-camel-on-change=\"{{ deliveryEditor.onName }}\" placeholder=\"例如：中国传统建筑 · 首批交付\" maxlength=\"100\" required autofocus /></div>\n          <div class=\"forge-delivery-field-grid\"><div class=\"forge-delivery-field\"><label for=\"forge-delivery-customer\">客户 / 供应商 <span>*</span></label><input id=\"forge-delivery-customer\" value=\"{{ deliveryEditor.customer }}\" sc-camel-on-change=\"{{ deliveryEditor.onCustomer }}\" placeholder=\"填写客户名称\" maxlength=\"80\" required /></div><div class=\"forge-delivery-field\"><label for=\"forge-delivery-target\">目标数量 <span>*</span></label><input id=\"forge-delivery-target\" type=\"number\" min=\"1\" max=\"100000\" step=\"1\" inputmode=\"numeric\" value=\"{{ deliveryEditor.target }}\" sc-camel-on-change=\"{{ deliveryEditor.onTarget }}\" placeholder=\"例如：200\" required /></div></div>\n          <div class=\"forge-delivery-field\"><label>客户品牌 Logo</label>\n            <div class=\"forge-delivery-logo-upload\">\n              <div class=\"forge-delivery-logo-preview\"><sc-if value=\"{{ deliveryEditor.hasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ deliveryEditor.logoUrl }}\" alt=\"客户品牌 Logo 预览\" /></sc-if><sc-if value=\"{{ deliveryEditor.noLogo }}\" hint-placeholder-val=\"{{ true }}\"><svg class=\"forge-icon\" data-phosphor=\"image\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg></sc-if></div>\n              <div class=\"forge-delivery-logo-controls\">\n                <div class=\"forge-delivery-logo-actions\"><label class=\"forge-delivery-file-button\"><svg class=\"forge-icon\" data-phosphor=\"upload-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z\"></path></svg><span>上传 Logo</span><input type=\"file\" accept=\"image/png,image/jpeg,image/webp\" aria-label=\"上传客户品牌 Logo\" sc-camel-on-change=\"{{ deliveryEditor.uploadLogo }}\" /></label><sc-if value=\"{{ deliveryEditor.hasLogo }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"forge-delivery-text-button\" sc-camel-on-click=\"{{ deliveryEditor.removeLogo }}\">移除</button></sc-if></div>\n                <p class=\"forge-delivery-help\">PNG、JPG、WebP · 最大 2 MB</p>\n              </div>\n            </div>\n            <sc-if value=\"{{ deliveryEditor.logoLoading }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-delivery-help\" role=\"status\">正在读取 Logo…</p></sc-if><sc-if value=\"{{ deliveryEditor.logoError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ deliveryEditor.logoError }}</p></sc-if>\n          </div>\n          <div class=\"forge-delivery-field\"><label for=\"forge-delivery-desc\">说明</label><textarea id=\"forge-delivery-desc\" value=\"{{ deliveryEditor.desc }}\" sc-camel-on-change=\"{{ deliveryEditor.onDesc }}\" placeholder=\"交付范围、验收要求或其他补充信息\" maxlength=\"3000\"></textarea></div>\n          <p class=\"forge-delivery-help\">继续配置 List、Tag 和审核 Skill，也可以创建后再补充。</p>\n        </section>\n      </sc-if>\n      <sc-if value=\"{{ deliveryEditor.list }}\" hint-placeholder-val=\"{{ false }}\">\n        <section aria-label=\"List 清单与 Tag\">\n          <div class=\"forge-delivery-section-heading\"><h3>List 清单</h3><label class=\"forge-delivery-file-button\" data-disabled=\"{{ deliveryEditor.listLoading }}\"><svg class=\"forge-icon\" data-phosphor=\"upload-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z\"></path></svg><span>上传 ZIP</span><input type=\"file\" accept=\".zip,application/zip\" aria-label=\"上传 List ZIP\" disabled=\"{{ deliveryEditor.listLoading }}\" sc-camel-on-change=\"{{ deliveryEditor.uploadList }}\" /></label></div>\n          <p class=\"forge-delivery-help\">上传 ZIP（最大 20 MB），或粘贴文本，每行一个名称或 Item ID。ZIP 按文件目录预览，不会运行其中的文件。</p>\n          <sc-if value=\"{{ deliveryEditor.hasArchive }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"forge-delivery-file-line\"><svg class=\"forge-icon\" data-phosphor=\"paperclip\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M209.66,122.34a8,8,0,0,1,0,11.32l-82.05,82a56,56,0,0,1-79.2-79.21L147.67,35.73a40,40,0,1,1,56.61,56.55L105,193A24,24,0,1,1,71,159L154.3,74.38A8,8,0,1,1,165.7,85.6L82.39,170.31a8,8,0,1,0,11.27,11.36L192.93,81A24,24,0,1,0,159,47L59.76,147.68a40,40,0,1,0,56.53,56.62l82.06-82A8,8,0,0,1,209.66,122.34Z\"></path></svg><span>{{ deliveryEditor.archiveName }}</span><button type=\"button\" class=\"forge-delivery-icon-button\" aria-label=\"移除 List ZIP 附件\" sc-camel-on-click=\"{{ deliveryEditor.removeArchive }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button></div></sc-if>\n          <label class=\"forge-delivery-visually-hidden\" for=\"forge-delivery-list\">List 文本清单</label><textarea id=\"forge-delivery-list\" class=\"forge-delivery-list-input\" value=\"{{ deliveryEditor.listText }}\" sc-camel-on-change=\"{{ deliveryEditor.onList }}\" placeholder=\"布达拉宫&#10;天坛&#10;或粘贴 Item ID\" maxlength=\"150000\" disabled=\"{{ deliveryEditor.listLoading }}\"></textarea>\n          <sc-if value=\"{{ deliveryEditor.listLoading }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-delivery-help\" role=\"status\">正在读取 ZIP 文件目录…</p></sc-if><sc-if value=\"{{ deliveryEditor.listError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ deliveryEditor.listError }}</p></sc-if>\n          <div class=\"forge-delivery-tag-editor\"><h3>Tag</h3><div class=\"forge-delivery-tag-add\"><input aria-label=\"Tag 名称\" value=\"{{ deliveryEditor.tagName }}\" sc-camel-on-change=\"{{ deliveryEditor.onTagName }}\" placeholder=\"例如：重点验收\" maxlength=\"30\" /><button type=\"button\" class=\"forge-delivery-secondary\" disabled=\"{{ deliveryEditor.tagDisabled }}\" sc-camel-on-click=\"{{ deliveryEditor.addTag }}\">添加 Tag</button></div><div class=\"forge-delivery-color-palette\" role=\"group\" aria-label=\"Tag 颜色盘\"><sc-for list=\"{{ deliveryEditor.palette }}\" as=\"color\" hint-placeholder-count=\"8\"><button type=\"button\" aria-label=\"{{ color.label }}\" aria-pressed=\"{{ color.selected }}\" title=\"{{ color.color }}\" style=\"--tag-color:{{ color.color }}\" sc-camel-on-click=\"{{ color.pick }}\"></button></sc-for><label class=\"forge-delivery-custom-color\"><input type=\"color\" value=\"{{ deliveryEditor.tagColor }}\" sc-camel-on-change=\"{{ deliveryEditor.onTagColor }}\" aria-label=\"自定义 Tag 颜色\" /><span>{{ deliveryEditor.tagColor }}</span></label></div><p class=\"forge-delivery-help\">{{ deliveryEditor.tagHint }}</p><div class=\"forge-delivery-tag-chips\"><sc-for list=\"{{ deliveryEditor.tags }}\" as=\"tag\" hint-placeholder-count=\"0\"><span class=\"forge-delivery-tag\" style=\"background:{{ tag.color }};color:{{ tag.fg }}\">{{ tag.name }}<button type=\"button\" aria-label=\"{{ tag.removeLabel }}\" sc-camel-on-click=\"{{ tag.remove }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button></span></sc-for></div></div>\n          <sc-if value=\"{{ deliveryEditor.hasEntries }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"forge-delivery-section-heading\"><h3>条目预览</h3><span>{{ deliveryEditor.entrySummary }}</span></div><div class=\"forge-delivery-entry-preview\"><sc-for list=\"{{ deliveryEditor.entries }}\" as=\"entry\" hint-placeholder-count=\"0\"><div class=\"forge-delivery-entry\"><div><strong title=\"{{ entry.source }}\">{{ entry.name }}</strong><span>{{ entry.status }}</span></div><select aria-label=\"{{ entry.tagLabel }}\" value=\"{{ entry.tagId }}\" sc-camel-on-change=\"{{ entry.onTag }}\"><option value=\"\">无 Tag</option><sc-for list=\"{{ entry.tags }}\" as=\"tag\" hint-placeholder-count=\"0\"><option value=\"{{ tag.id }}\" label=\"{{ tag.name }}\">{{ tag.name }}</option></sc-for></select></div></sc-for></div><p class=\"forge-delivery-help\">仅精确匹配到的名称 / ID 会关联 Item；其余条目保留为待关联清单。</p></sc-if>\n        </section>\n      </sc-if>\n      <sc-if value=\"{{ deliveryEditor.skillTab }}\" hint-placeholder-val=\"{{ false }}\">\n        <section aria-label=\"绑定审核 Skill\">\n          <div class=\"forge-delivery-section-heading\"><h3>审核 Skill</h3><span>{{ deliveryEditor.skillCount }} / 12</span></div><p class=\"forge-delivery-help\">上传一个或多个 Skill，审核员可在相关 Item / Run 的审核会话里通过 <code>/调用名</code> 加载。</p>\n          <label class=\"forge-delivery-skill-upload\" data-disabled=\"{{ deliveryEditor.skillsFull }}\"><svg class=\"forge-icon\" data-phosphor=\"upload-simple\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0ZM93.66,77.66,120,51.31V144a8,8,0,0,0,16,0V51.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,77.66Z\"></path></svg><strong>选择 Skill 文件</strong><span>.md 或包含 SKILL.md 的 ZIP · 支持多选</span><input type=\"file\" accept=\".md,.markdown,.zip,text/markdown,application/zip\" multiple disabled=\"{{ deliveryEditor.skillsFull }}\" aria-label=\"上传审核 Skill\" sc-camel-on-change=\"{{ deliveryEditor.uploadSkills }}\" /></label>\n          <p class=\"forge-delivery-help\">单个文档最大 512 KB，ZIP 最大 20 MB。只读取 Skill 文档，不执行压缩包内的脚本。</p>\n          <sc-if value=\"{{ deliveryEditor.skillLoading }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-delivery-help\" role=\"status\">正在读取 Skill…</p></sc-if><sc-if value=\"{{ deliveryEditor.skillError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ deliveryEditor.skillError }}</p></sc-if>\n          <div class=\"forge-delivery-skill-list\"><sc-for list=\"{{ deliveryEditor.skills }}\" as=\"skill\" hint-placeholder-count=\"0\"><article class=\"forge-delivery-skill\"><div class=\"forge-delivery-section-heading\"><strong>{{ skill.name }}</strong><button type=\"button\" class=\"forge-delivery-icon-button\" aria-label=\"{{ skill.removeLabel }}\" sc-camel-on-click=\"{{ skill.remove }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L1
