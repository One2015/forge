      <div sc-camel-on-click=\"{{ life.jumpBranch }}\" title=\"点击定位到最近一条分支\" style=\"display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#6a4bb8;cursor:pointer;white-space:nowrap\" style-hover=\"color:#54399c\">\n                <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"4\" cy=\"3\" r=\"1.8\"></circle><circle cx=\"4\" cy=\"13\" r=\"1.8\"></circle><circle cx=\"12\" cy=\"6.5\" r=\"1.8\"></circle><path d=\"M4 4.8v6.4\"></path><path d=\"M4 8.4h4.6a3.4 3.4 0 0 0 3.4-1.9\"></path></svg>{{ life.branchLabel }}\n              </div>\n            </sc-if>\n          </div>\n        </div>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 22px;border:1px solid #e8e2d9;background:#fff;border-radius:10px;padding:12px 16px\">\n          <sc-for list=\"{{ life.stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:baseline;gap:8px;white-space:nowrap\">\n              <div style=\"font-size:12px;color:#9c948b\">{{ s.k }}</div>\n              <div style=\"font-size:14px;font-weight:600;color:{{ s.fg }}\">{{ s.v }}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:14px;padding:22px clamp(16px,2.4vw,26px)\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n          <div style=\"font-size:15px;font-weight:600\">完整记录</div>\n          <div style=\"flex:1\"></div>\n          <div sc-camel-on-click=\"{{ life.toggleAll }}\" style=\"font-size:13px;color:#b1543a;cursor:pointer\">{{ life.toggleAllLabel }}</div>\n        </div>\n\n        <sc-for list=\"{{ life.nodes }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <div style=\"position:relative;border-left:1px solid #e2dcd2;padding:0 0 18px 26px\">\n            <div style=\"position:absolute;left:-6px;top:3px;width:11px;height:11px;border-radius:50%;background:{{ n.dot }};box-shadow:0 0 0 3px #fff\"></div>\n\n            <div sc-camel-on-click=\"{{ n.toggle }}\" style=\"display:grid;grid-template-columns:56px minmax(0,auto) auto minmax(0,1fr) auto;align-items:center;gap:10px;cursor:pointer\">\n              <div style=\"font-size:11px;color:#9c948b;letter-spacing:.06em;white-space:nowrap\">{{ n.kind }}</div>\n              <div style=\"font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.title }}</div>\n              <div style=\"font-size:12px;border-radius:6px;padding:2px 10px;border:1px solid {{ n.badgeBorder }};color:{{ n.badgeFg }};white-space:nowrap\">{{ n.badge }}</div>\n              <div style=\"font-size:13px;color:#8b847c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.summary }}</div>\n              <div style=\"font-size:13px;color:#b1543a;white-space:nowrap\">{{ n.toggleLabel }}</div>\n            </div>\n\n            <div style=\"display:flex;align-items:stretch;gap:clamp(12px,1.6vw,20px);flex-wrap:wrap\">\n\n            <sc-if value=\"{{ n.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"flex:{{ n.bodyFlex }};min-width:280px;margin-top:13px;border:1px solid #e8e2d9;border-radius:10px;background:#fcfbf9;padding:15px 17px;display:flex;align-items:flex-start;gap:clamp(14px,2vw,22px);flex-wrap:wrap;align-self:flex-start\">\n                <sc-if value=\"{{ n.hasPreview }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex:1 1 330px;min-width:270px;max-width:430px\">\n                    <div sc-camel-on-click=\"{{ n.zoom }}\" title=\"点击放大查看\" style=\"position:relative;height:214px;border-radius:10px;border:1px solid #e8e2d9;background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px);display:flex;align-items:center;justify-content:center;cursor:zoom-in\" data-comment-anchor=\"fd8e3c8f5f-div\">\n                      <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#8b847c;background:rgba(255,255,255,.9);border:1px solid #e8e2d9;border-radius:6px;padding:6px 11px\">{{ n.previewCaption }}</div>\n                      <div style=\"position:absolute;bottom:9px;right:9px;height:24px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid #e2dcd2;color:#6b645d;font-size:12px;display:flex;align-items:center;gap:5px\">\n                        <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12.5 3.5h4v4\"></path><path d=\"M7.5 16.5h-4v-4\"></path><path d=\"M16.5 3.5l-5.4 5.4\"></path><path d=\"M3.5 16.5l5.4-5.4\"></path></svg>放大\n                      </div>\n                    </div>\n                    <div style=\"margin-top:8px;display:flex;align-items:center;gap:9px\">\n                      <div style=\"flex:1;min-width:0;font-size:12px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.previewNote }}</div>\n                      <a href=\"{{ n.previewUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;font-size:13px;color:#b1543a;white-space:nowrap;text-decoration:none\" style-hover=\"color:#8f4029\" data-comment-anchor=\"4e8afca14a-a\">新标签打开 ↗</a>\n                    </div>\n                  </div>\n                </sc-if>\n                <div style=\"flex:1 1 300px;min-width:260px\">\n                  <div style=\"font-size:12px;color:#9c948b;margin-bottom:6px\">{{ n.bodyLabel }}</div>\n                  <div style=\"font-size:14px;color:#3a352f;line-height:1.75;text-wrap:pretty\">{{ n.body }}</div>\n                  <div style=\"margin-top:14px;padding-top:13px;border-top:1px solid #f0ece5;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px 16px\">\n                    <sc-for list=\"{{ n.meta }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <div style=\"min-width:0\">\n                        <div style=\"font-size:12px;color:#9c948b\">{{ m.k }}</div>\n                        <div style=\"margin-top:3px;font-size:13px;color:#3a352f;overflow-wrap:anywhere\">{{ m.v }}</div>\n                      </div>\n                    </sc-for>\n                  </div>\n\n                  <sc-if value=\"{{ n.canReroll }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:14px;border:1px solid #eabaa8;background:#fdf5f2;border-radius:10px;padding:12px 13px\">\n                      <div style=\"font-size:13px;font-weight:600;color:#8f4029\">{{ n.rerollTitle }}</div>\n                      <div style=\"margin-top:5px;font-size:12px;color:#6b645d;line-height:1.6;text-wrap:pretty\">{{ n.rerollWhy }}</div>\n                      <div style=\"margin-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                        <button sc-camel-on-click=\"{{ n.reroll }}\" style=\"height:32px;border:none;background:#b1543a;color:#fff;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px\" style-hover=\"background:#95452f\">\n                          <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16.5 6.5A7 7 0 1 0 17 11\"></path><path d=\"M17 3.2v3.6h-3.6\"></path></svg>Reroll\n                        </button>\n                        <div sc-camel-on-click=\"{{ n.openRun }}\" style=\"font-size:12px;color:#6b645d;cursor:pointer;white-space:nowrap\" style-hover=\"color:#221f1c\">查看运行详情</div>\n                      </div>\n                    </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ n.canFork }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:14px\">\n                      <sc-if value=\"{{ n.forkClosed }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div sc-camel-on-click=\"{{ n.openFork }}\" title=\"以这一节点的产物为起点新开一条分支，不影响原有轮次\" style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;color:#3a352f;cursor:pointer\" style-hover=\"border-color:#b1543a;color:#b1543a\">\n                          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"4\" cy=\"3\" r=\"1.8\"></circle><circle cx=\"4\" cy=\"13\" r=\"1.8\"></circle><circle cx=\"12\" cy=\"6.5\" r=\"1.8\"></circle><path d=\"M4 4.8v6.4\"></path><path d=\"M4 8.4h4.6a3.4 3.4 0 0 0 3.4-1.9\"></path></svg>\n                          从这里分支修复\n                        </div>\n                      </sc-if>\n                      <sc-if value=\"{{ n.forkOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"border:1px solid #e2dcd2;border-radius:10px;background:#fff;padding:13px\">\n                          <div style=\"font-size:13px;font-weight:600;margin-bottom:3px\">{{ n.forkTitle }}</div>\n                          <div style=\"font-size:13px;color:#8b847c;margin-bottom:10px\">评论会锚定在这一轮的产物与上下文上，创建独立分支并继续优化；主线记录保持不变。</div>\n                          <div style=\"font-size:12px;color:#6b645d;margin-bottom:5px\">分支评论 <span style=\"color:#b1543a\">必填</span></div>\n                          <textarea sc-camel-on-change=\"{{ n.onForkText }}\" value=\"{{ n.forkText }}\" placeholder=\"补充要继续优化的问题、需要保留的部分和验收标准。\" style=\"width:100%;min-height:88px;resize:vertical;border:1px solid #e2dcd2;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;background:#fff;color:#221f1c\"></textarea>\n                          <div style=\"display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap\">\n                            <div style=\"flex:1;min-width:120px;font-size:12px;color:#9c948b\">{{ n.forkHint }}</div>\n                            <button sc-camel-on-click=\"{{ n.cancelFork }}\" style=\"height:34px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;padding:0 14px;font-size:13px;color:#6b645d;cursor:pointer\">取消</button>\n                            <sc-if value=\"{{ n.canSubmitFork }}\" hint-placeholder-val=\"{{ false }}\">\n                              <button sc-camel-on-click=\"{{ n.submitFork }}\" style=\"height:34px;border:none;background:#b1543a;color:#fff;border-radius:8px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer\">评论并继续优化</button>\n                            </sc-if>\n                            <sc-if value=\"{{ n.cannotSubmitFork }}\" hint-placeholder-val=\"{{ true }}\">\n                              <button style=\"height:34px;border:1px solid #e8e2d9;background:#f4f1ec;color:#b3aca3;border-radius:8px;padding:0 16px;font-size:13px;font-weight:600;cursor:not-allowed\">评论并继续优化</button>\n                            </sc-if>\n                          </div>\n                        </div>\n                      </sc-if>\n                    </div>\n                  </sc-if>\n                </div>\n              </div>\n            </sc-if>\n\n            <sc-if value=\"{{ n.hasForks }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:relative;flex:{{ n.forkFlex }};min-width:270px;margin-top:13px;padding-left:34px;align-self:flex-start\">\n                <div style=\"position:absolute;left:16px;top:0;bottom:14px;width:1.5px;background:#e3d8ef\"></div>\n                <div style=\"position:absolute;left:13px;bottom:8px;width:7px;height:7px;border-radius:50%;background:#e3d8ef\"></div>\n                <div style=\"position:absolute;left:3px;top:14px;width:27px;height:27px;border-radius:50%;background:#f7f4fd;border:1px solid #e3d8ef;display:flex;align-items:center;justify-content:center\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#6a4bb8\" stroke-width=\"1.7\" stroke-linecap=\"round\"><circle cx=\"4\" cy=\"3\" r=\"1.8\"></circle><circle cx=\"4\" cy=\"13\" r=\"1.8\"></circle><circle cx=\"12\" cy=\"6.5\" r=\"1.8\"></circle><path d=\"M4 4.8v6.4\"></path><path d=\"M4 8.4h4.6a3.4 3.4 0 0 0 3.4-1.9\"></path></svg>\n                </div>\n                <div style=\"min-height:27px;display:flex;align-items:center;margin-bottom:9px\">\n                  <div style=\"font-size:12px;color:#6a4bb8;letter-spacing:.04em\">{{ n.forkGroupLabel }}</div>\n                </div>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ n.forks }}\" as=\"k\" hint-placeholder-count=\"1\">\n                  <div data-branch-card=\"{{ k.cardKey }}\" style=\"border:1px solid #e3d8ef;border-left:2px solid #b7a4ec;border-radius:10px;background:#f7f4fd;min-width:0\">\n\n                    <div sc-camel-on-click=\"{{ k.toggle }}\" style=\"display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;flex-wrap:wrap\" style-hover=\"background:#f7f4fd\">\n                      <div style=\"font-size:13px;font-weight:600;color:#3a352f;white-space:nowrap\">{{ k.name }}</div>\n                      <div style=\"display:inline-flex;align-items:center;gap:5px;font-size:11px;color:{{ k.stateFg }};border:1px solid {{ k.stateBorder }};border-radius:6px;padding:1px 8px;white-space:nowrap\">\n                        <div style=\"width:4px;height:4px;border-radius:50%;background:{{ k.stateDot }}\"></div>{{ k.stateLabel }}\n                      </div>\n                      <div style=\"flex:1;min-width:0;font-size:12px;color:#8b847c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ k.summaryLine }}</div>\n                      <div style=\"flex:none;font-size:12px;color:#6a4bb8;white-space:nowrap\">{{ k.toggleLabel }}</div>\n                    </div>\n\n                    <sc-if value=\"{{ k.open }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"border-top:1px solid #f7f4fd;padding:12px 13px\">\n\n                        <div style=\"font-size:13px;color:#3a352f;line-height:1.6\">{{ k.originLabel }}</div>\n\n                        <div style=\"margin-top:10px;height:132px;border-radius:10px;border:1px solid #e8e2d9;background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px);display:flex;align-items:center;justify-content:center\">\n                          <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#8b847c;background:rgba(255,255,255,.9);border:1px solid #e8e2d9;border-radius:6px;padding:4px 9px\">{{ k.previewCaption }}</div>\n                        </div>\n\n                        <div style=\"margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                          <sc-for list=\"{{ k.chain }}\" as=\"c\" hint-placeholder-count=\"3\">\n                            <div style=\"display:flex;align-items:center;gap:6px\">\n                              <div style=\"display:flex;align-items:center;gap:5px;font-size:11px;color:{{ c.fg }};border:1px solid {{ c.border }};border-radius:6px;padding:1px 8px;white-space:nowrap\">\n                                <div style=\"width:4px;height:4px;border-radius:50%;background:{{ c.dot }}\"></div>{{ c.label }}\n                              </div>\n                              <sc-if value=\"{{ c.hasArrow }}\" hint-placeholder-val=\"{{ true }}\">\n                                <div style=\"font-size:11px;color:#d3cabd\">→</div>\n                              </sc-if>\n                            </div>\n                          </sc-for>\n                        </div>\n\n                        <div style=\"margin-top:11px;font-size:12px;color:#3a352f;line-height:1.6;text-wrap:pretty\">{{ or:#9c948b\">{{ k.subHint }}</div>\n                            <div style=\"display:flex;align-items:center;gap:8px;margin-top:9px;justify-content:flex-end;flex-wrap:wrap\">\n                              <button sc-camel-on-click=\"{{ k.cancelSub }}\" style=\"height:32px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;padding:0 12px;font-size:12px;color:#6b645d;cursor:pointer\">取消</button>\n                              <sc-if value=\"{{ k.canSubmitSub }}\" hint-placeholder-val=\"{{ false }}\">\n                                <button sc-camel-on-click=\"{{ k.submitSub }}\" style=\"height:32px;border:none;background:#6a4bb8;color:#fff;border-radius:8px;padding:0 14px;font-size:12px;font-weight:600;cursor:pointer\">提交继续修复</button>\n                              </sc-if>\n                              <sc-if value=\"{{ k.cannotSubmitSub }}\" hint-placeholder-val=\"{{ true }}\">\n                                <button disabled style=\"height:32px;border:1px solid #e8e2d9;background:#f4f1ec;color:#b3aca3;border-radius:8px;padding:0 14px;font-size:12px;font-weight:600;cursor:not-allowed\">提交继续修复</button>\n                              </sc-if>\n                            </div>\n                          </div>\n                        </sc-if>\n\n                        <sc-if value=\"{{ k.hasKids }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"position:relative;margin-top:12px;padding-left:20px\">\n                            <div style=\"position:absolute;left:6px;top:2px;bottom:8px;width:1px;background:#e3d8ef\"></div>\n                            <div style=\"font-size:11px;color:#6a4bb8;margin-bottom:7px\">{{ k.kidsLabel }}</div>\n                            <div style=\"display:flex;flex-direction:column;gap:7px\">\n                              <sc-for list=\"{{ k.kids }}\" as=\"g\" hint-placeholder-count=\"1\">\n                                <div data-branch-card=\"{{ g.cardKey }}\" style=\"border:1px solid #e3 sc-if>\n\n  <sc-if value=\"{{ stopAsk.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ stopAsk.cancel }}\" style=\"position:fixed;inset:0;z-index:96;background:rgba(34,31,28,.28);display:flex;align-items:center;justify-content:center;padding:20px\">\n      <div sc-camel-on-click=\"{{ stopAsk.stop }}\" style=\"width:min(520px,calc(100vw - 32px));background:#fff;border:1px solid #e2dcd2;border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(34,31,28,.22)\">\n        <div style=\"font-size:19px;font-weight:600;color:#221f1c\">停止这次运行？</div>\n        <div style=\"margin-top:8px;font-size:13px;color:#6b645d;line-height:1.7\">停止后本轮不会继续执行，已经产生的成本不会退回。</div>\n        <div style=\"margin-top:16px;border:1px solid #ece7df;border-radius:10px;overflow:hidden;background:#fcfbf9\">\n          <sc-for list=\"{{ stopAsk.fields }}\" as=\"f\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:9px 12px;border-bottom:1px solid #f0ece5\"><div style=\"font-size:12px;color:#9c948b\">{{ f.k }}</div><div style=\"font-size:13px;color:#3a352f;overflow-wrap:anywhere\">{{ f.v }}</div></div></sc-for>\n        </div>\n        <div style=\"margin-top:18px;display:flex;justify-content:flex-end;gap:9px\"><button sc-camel-on-click=\"{{ stopAsk.cancel }}\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 18px;font-size:13px;color:#6b645d;cursor:pointer\">继续运行</button><button sc-camel-on-click=\"{{ stopAsk.confirm }}\" style=\"height:38px;border:none;background:#a5321f;color:#fff;border-radius:10px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer\">确认停止</button></div>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ cancelAsk.open }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ cancelAsk.cancel }}\" style=\"position:fixed;inset:0;z-index:96;background:rgba(34,31,28,.28);display:flex;align-items:center;justify-content:center;padding:20px\">\n      <div sc-camel-on-click=\"{{ cancelAsk.stop }}\" style=\"width:min(500px,calc(100vw - 32px));background:#fff;border:1px solid #e2dcd2;border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(34,31,28,.22)\">\n        <div style=\"font-size:19px;font-weight:600;color:#221f1c\">取消这个排队任务？</div>\n        <div style=\"margin-top:8px;font-size:13px;color:#6b645d;line-height:1.7\">该任务尚未开始，不会产生运行成本。</div>\n        <div style=\"margin-top:15px;border:1px solid #ece7df;border-radius:10px;background:#fcfbf9;padding:12px 14px;font-size:13px;color:#3a352f;line-height:1.7\"><div>{{ cancelAsk.itemName }}</div><div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#8b847c\">{{ cancelAsk.itemId }}</div><div style=\"margin-top:4px;font-size:12px;color:#9c948b\">Run {{ cancelAsk.runId }}</div></div>\n        <div style=\"margin-top:18px;display:flex;justify-content:flex-end;gap:9px\"><button sc-camel-on-click=\"{{ cancelAsk.cancel }}\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 18px;font-size:13px;color:#6b645d;cursor:pointer\">继续排队</button><button sc-camel-on-click=\"{{ cancelAsk.confirm }}\" style=\"height:38px;border:none;background:#6b645d;color:#fff;border-radius:10px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer\">确认取消</button></div>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isPipeEdit }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;height:calc(100vh - 56px)\">\n\n      <div style=\"flex:none;display:flex;align-items:center;gap:clamp(7px,1vw,10px);padding:11px clamp(12px,2vw,24px);background:#fff;border-bottom:1px solid #e8e2d9;flex-wrap:wrap\">\n        <div sc-camel-on-click=\"{{ pe.back }}\" style=\"font-size:13px;color:#8b847c;cursor:pointer;white-space:nowrap\" style-hover=\"color:#221f1c\">← 返回</div>\n        <div style=\"display:flex;align-items:center;gap:8px;height:38px;pad r:#b1543a\">{{ o.mark }}</div>\n                  <div style=\"flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis\">{{ o.name }}</div>\n                  <div style=\"flex:none;font-size:12px;color:#9c948b\">{{ o.count }}</div>\n                </div>\n              </sc-for>\n            </div>\n          </sc-if>\n        </div>\n        <div style=\"display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;background:{{ pe.checkBg }};font-size:13px;color:{{ pe.checkFg }};white-space:nowrap;order:4\">\n          <div style=\"width:6px;height:6px;border-radius:50%;background:{{ pe.checkDot }}\"></div>{{ pe.checkLabel }}\n        </div>\n        <div style=\"flex:1;min-width:0;order:5\"></div>\n        <button sc-camel-on-click=\"{{ pe.save }}\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 14px;font-size:13px;color:#3a352f;cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#c1b8ab\">{{ pe.saveLabel }}</button>\n        <button sc-camel-on-click=\"{{ pe.exportYaml }}\" title=\"导出这条 Pipeline 的最新版本定义\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 14px;font-size:13px;color:#3a352f;cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#c1b8ab\">导出 YAML（{{ pe.version }}）</button>\n        <button sc-camel-on-click=\"{{ pe.askDelete }}\" style=\"height:38px;border:1px solid #eabaa8;background:#fff;border-radius:10px;padding:0 14px;font-size:13px;color:#a5321f;cursor:pointer;white-space:nowrap\" style-hover=\"background:#fdf5f2\">删除 Pipeline</button>\n        <sc-if value=\"{{ pe.canRun }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ pe.run }}\" style=\"height:38px;border:none;background:#b1543a;color:#fff;border-radius:10px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#95452f\" no-Regular,Menlo,monospace;font-size:clamp(12.5px,1.1vw,14px);font-weight:600;color:#221f1c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.name }}</div>\n                    <div style=\"flex:none;font-size:11px;color:{{ n.kindFg }};background:{{ n.kindBg }};border-radius:6px;padding:1px 8px;letter-spacing:.06em;white-space:nowrap\">{{ n.kind }}</div>\n                  </div>\n                  <div style=\"margin-top:12px;height:6px;border-radius:3px;background:#f0ece5;overflow:hidden\">\n                    <div style=\"width:{{ n.progW }};height:100%;background:{{ n.accent }}\"></div>\n                  </div>\n                  <div style=\"margin-top:8px;display:flex;align-items:baseline;gap:8px\">\n                    <div style=\"flex:1;min-width:0;font-size:12px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.note }}</div>\n                    <div style=\"flex:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#9c948b\">{{ n.count }}</div>\n                  </div>\n                </div>\n                <sc-if value=\"{{ n.hasEdge }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;flex:none\">\n                    <div style=\"width:7px;height:7px;border-radius:50%;background:#c1b8ab\"></div>\n                    <div style=\"width:clamp(18px,3vw,48px);height:2px;background:#c1b8ab\"></div>\n                    <div style=\"width:7px;height:7px;border-radius:50%;background:#c1b8ab\"></div>\n                  </div>\n                </sc-if>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n\n        <div style=\"position:sticky;left:16px;bottom:16px;float:left;display:flex;align-items:center;gap:1px;border:1px solid #e2dcd2;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(34,31,28,.08)\">\n          <div sc-camel-on-click=\"{{ pe.zoomOut }}\" title=\"缩小\" style=\"width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6b645d;cursor:pointer;border-right:1px solid #f0ece5\" style-hover=\"background:#f7f4ef\">−</div>\n          <div sc-camel-on-click=\"{{ pe.zoomFit }}\" title=\"恢复 100%\" style=\"min-width:52px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#6b645d;cursor:pointer;border-right:1px solid #f0ece5\" style-hover=\"background:#f7f4ef\">{{ pe.zoomLabel }}</div>\n          <div sc-camel-on-click=\"{{ pe.zoomIn }}\" title=\"放大\" style=\"width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6b645d;cursor:pointer\" style-hover=\"background:#f7f4ef\">＋</div>\n        </div>\n      </div>\n\n      <sc-if value=\"{{ pe.hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"flex:none;border-top:1px solid #e8e2d9;background:#fff;padding:13px clamp(14px,2vw,24px);display:flex;align-items:flex-start;gap:clamp(14px,2vw,26px);flex-wrap:wrap\">\n          <div style=\"flex:1 1 260px;min-width:220px\">\n            <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n              <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600\">{{ pe.sel.name }}</div>\n              <div style=\"font-size:11px;color:{{ pe.sel.kindFg }};background:{{ pe.sel.kindBg }};border-radius:6px;padding:1px 8px;letter-spacing:.06em\">{{ pe.sel.kind }}</div>\n              <div style=\"flex:1\"></div>\n              <div sc-camel-on-click=\"{{ pe.closeSel }}\" style=\"font-size:13px;color:#8b847c;cursor:pointer\" style-hover=\"color:#221f1c\">收起</div>\n            </div>\n            <div style=\"margin-top:8px;font-size:13px;color:#6b645d;line-height:1.65;text-wrap:pretty\">{{ pe.sel.desc }}</div>\n          </div>\n          <div style=\"flex:1 1 300px;min-width:240px;display:grid;grid-template-columns:repeat(auto-fit,minmax(12 r-radius:50%;background:{{ s.dotBg }};border:1.5px solid {{ s.dotBorder }};color:{{ s.dotFg }};font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none\">{{ s.mark }}</div>\n                  <div style=\"flex:1;height:2px;background:{{ s.lineR }}\"></div>\n                </div>\n                <div sc-camel-on-click=\"{{ s.click }}\" style=\"margin-top:9px;padding:0 8px;text-align:center;cursor:{{ s.cursor }};min-width:0\">\n                  <div style=\"font-size:13px;color:{{ s.labelFg }};font-weight:{{ s.labelWeight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.label }}</div>\n                  <div style=\"margin-top:4px;font-size:12px;color:{{ s.valueFg }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ s.value }}</div>\n                  <sc-if value=\"{{ s.hasAction }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:4px;font-size:12px;color:#b1543a\">{{ s.action }}</div>\n                  </sc-if>\n                </div>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n      </sc-if>\n\n      <sc-if value=\"{{ rerollCompact }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:14px;padding:20px 20px 18px;box-shadow:0 1px 2px rgba(34,31,28,.04)\">\n          <div style=\"display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n            <div style=\"flex:1;min-width:240px\">\n              <div style=\"font-size:17px;font-weight:600;color:#221f1c\">检查并运行</div>\n              <div style=\"margin-top:6px;font-size:13px;color:#6b645d\">系统已沿用原配置。确认无误后可直接 Reroll，需要调整时再展开选择器。</div>\n            </div>\n            <button sc-camel-on-click=\"{{ editReroll }}\" style=\"height:34px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;padding:0 13px;font-size:13px;color:#3a352f;cursor:pointer\" style-hover=\"border-color:#b1543a;color:#b1543a\">修改选择</button>\n          </div>\n          <div style=\"margin-top:16px;border:1px solid #ece7df;background:#fcfbf9;border-radius:10px;overflow:hidden\">\n            <sc-for list=\"{{ ds.rerollSummary }}\" as=\"s\" hint-placeholder-count=\"7\">\n              <div style=\"display:grid;grid-template-columns:130px minmax(0,1fr) 48px;gap:10px;padding:10px 13px;border-bottom:1px solid #f0ece5;align-items:center\">\n                <div style=\"font-size:12px;color:#9c948b\">{{ s.k }}</div>\n                <div style=\"font-size:13px;color:#3a352f;overflow-wrap:anywhere\">{{ s.v }}</div>\n                <button sc-camel-on-click=\"{{ editReroll }}\" style=\"border:0;background:transparent;color:#b1543a;font-size:12px;cursor:pointer;padding:0;text-align:right\">修改</button>\n              </div>\n            </sc-for>\n          </div>\n          <div style=\"margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <div style=\"flex:1;min-width:220px;font-size:12px;color:#8b847c\">确认后将创建新的运行；原 Run 与审核记录保持不变。</div>\n            <button sc-camel-on-click=\"{{ ds.submit }}\" style=\"height:40px;border:0;background:#b1543a;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#95452f\">确认 Reroll</button>\n          </div>\n        </div>\n      </sc-if>\n\n      <div style=\"display:{{ datasetPickerDisplay }};align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">数据集</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:#6b645d\">{{ dsSubtitle }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <button sc-camel-on-click=\"{{ openImport }}\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 15px;font-size:13px;color:#3a352f;cursor:pointer;display:flex;align-items:center;gap:7px\" style-hover=\"border-color:#b1543a;color:#b1543a\">\n          <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13V3.5\"></path><path d=\"M6.2 7.3L10 3.5l3.8 3.8\"></path><path d=\"M4 15.5h12\"></path></svg>导入数据集\n        </button>\n      </div>\n\n      <sc-if value=\"{{ importOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:16px;border:1px solid #e8e2d9;background:#fff;border-radius:12px;padding:16px 18px\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n            <div style=\"font-size:15px;font-weight:600\">导入数据集</div>\n            <div style=\"font-size:13px;color:#8b847c\">上传 Item 清单，或从已有数据集派生一份</div>\n            <div style=\"flex:1\"></div>\n            <div sc-camel-on-click=\"{{ closeImport }}\" style=\"font-size:13px;color:#8b847c;cursor:pointer\" style-hover=\"color:#221f1c\">取消</div>\n          </div>\n\n          <div style=\"margin-top:14px;display:flex;gap:2px;background:#f0ece5;border-radius:10px;padding:3px;width:fit-content\">\n            <sc-for list=\"{{ importTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ t.pick }}\" style=\"border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};font-weight:{{ t.weight }};white-space:nowrap;box-shadow:{{ t.shadow }}\">{{ t.label }}</div>\n            </sc-for>\n          </div>\n\n          <sc-if value=\"{{ importNeedsName }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px\">\n            <div style=\"min-width:0\">\n              <div style=\"font-size:12px;color:#9c948b;margin-bottom:6px\">数据集名称</div>\n              <input sc-camel-on-change=\"{{ onImportName }}\" value=\"{{ importName }}\" placeholder=\"例如 web3d x solid #e0c48c;background:#fdf8ef;border-radius:10px;padding:11px 13px;font-size:13px;color:#8a5a16;line-height:1.65;text-wrap:pretty\">{{ importBumpNote }}</div>\n              </sc-if>\n            </div>\n          </sc-if>\n\n          <sc-if value=\"{{ importFromFile }}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-click=\"{{ pickFile }}\" style=\"margin-top:12px;border:1px dashed #d3cabd;background:#fcfbf9;border-radius:10px;padding:20px;text-align:center;cursor:pointer\" style-hover=\"border-color:#b1543a\">\n              <div style=\"font-size:13px;color:#3a352f\">{{ importFileLabel }}</div>\n              <div style=\"margin-top:5px;font-size:12px;color:#9c948b\">支持 .md / .csv / .jsonl · 每行一条 Item，带 SD / PA / style_tag 时会自动解析</div>\n            </div>\n          </sc-if>\n\n          <sc-if value=\"{{ importFromDs }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px\">\n              <div style=\"font-size:12px;color:#9c948b;margin-bottom:6px\">从这个数据集派生</div>\n              <div style=\"border:1px solid #ece7df;border-radius:10px;background:#fcfbf9;overflow:hidden;max-height:180px;overflow-y:auto\">\n                <sc-for list=\"{{ importSources }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #f4f0ea;cursor:pointer;background:{{ o.bg }}\" style-hover=\"background:#fcfbf9\">\n                    <div style=\"width:15px;height:15px;flex:none;border-radius:50%;border:1.5px solid {{ o.dotBorder }};background:{{ o.dotBg }}\"></div>\n                    <div style=\"flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ o.name }}</div>\n                    <div style=\"flex:none;font-size:12px;color:#9c948b;white-space:nowrap\">{{ o.count }}</div>\n                  </div>\n                </sc-for>\n              </div>\n            </div>\n          </sc-if>\n\n          <div style=\"margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <div style=\"flex:1;min-width:150px;font-size:12px;color:#9c948b\">{{ importHint }}</div>\n            <sc-if value=\"{{ canImport }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ doImport }}\" style=\"height:38px;border:none;background:#b1543a;color:#fff;border-radius:10px;padding:0 17px;font-size:13px;font-weight:600;cursor:pointer\" style-hover=\"background:#95452f\">{{ importCta }}</button>\n            </sc-if>\n            <sc-if value=\"{{ cannotImport }}\" hint-placeholder-val=\"{{ true }}\">\n              <button style=\"height:38px;border:1px solid #e8e2d9;background:#f4f1ec;color:#b3aca3;border-radius:10px;padding:0 17px;font-size:13px;font-weight:600;cursor:not-allowed\">{{ importCta }}</button>\n            </sc-if>\n          </div>\n        </div>\n      </sc-if>\n\n      <div style=\"display:{{ datasetPickerDisplay }};align-items:flex-start;gap:14px\">\n\n        <div style=\"flex:1 1 0;min-width:0;background:#fff;border:1px solid #e8e2d9;border-radius:14px;overflow:hidden;position:sticky;top:118px;height:max(660px,calc(100vh - 138px));display:flex;flex-direction:column\">\n          <div style=\"flex:none;display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid #f0ece5;flex-wrap:wrap\">\n            <div style=\"position:relative;flex:1;min-width:190px\">\n              <div style=\"position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#9c948b\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"8.5\" cy=\"8.5\" r=\"5.5\"></circle><path d=\"M12.8 12.8L17 17\"></path></svg>\n              </div>\n              <input sc-camel-
