document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"711f8e4f-e38a-4347-a553-fba1cac43fef\"><\u002Fscript>\n\n</head>\n<body>\n<x-dc>\n<helmet>\n<style>\n:root{--forge-accent:#b1543a;--forge-accent-hover:#95452f;--forge-success:#4f7a52;--forge-danger:#a5321f;--forge-warning:#c8912f;--forge-branch:#6a4bb8;--forge-bg:#fbfaf8;--forge-panel:#fff;--forge-border:#e8e2d9;--forge-text:#221f1c;--forge-muted:#6b645d;--forge-radius-sm:8px;--forge-radius-md:12px}\n*{box-sizing:border-box}\nhtml{scrollbar-gutter:stable}\nbody{margin:0;min-height:100vh;background:#fbfaf8;color:#221f1c;font-family:\"Helvetica Neue\",Helvetica,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;-webkit-font-smoothing:antialiased}\na{color:#b1543a;text-decoration:none}\na:hover{color:#8f4029}\ninput,button,textarea{font-family:inherit}\ninput:focus{outline:none;border-color:var(--forge-accent)}\nbutton{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}\nbutton:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(177,84,58,.42);outline-offset:2px}\n</style>\n</helmet>\n\n<div style=\"min-height:100vh;background:#fbfaf8\">\n\n  <div style=\"display:flex;align-items:center;gap:clamp(14px,2vw,28px);padding:0 clamp(14px,2vw,28px);min-height:56px;background:#fff;border-bottom:1px solid #e8e2d9;position:sticky;top:0;z-index:40\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"width:24px;height:24px;border-radius:6px;background:#b1543a;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center\">F</div>\n      <div style=\"font-size:15px;font-weight:600;letter-spacing:-0.01em\">forge</div>\n    </div>\n    <div style=\"display:flex;align-items:center;gap:2px;font-size:14px;color:#6b645d;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ goOverview }}\" style=\"padding:6px 11px;border:0;border-radius:8px;cursor:pointer;background:{{ navOverBg }};color:{{ navOverFg }};font-size:14px;font-weight:{{ navOverWeight }}\">概览</button>\n      <button sc-camel-on-click=\"{{ goRuns }}\" style=\"padding:6px 11px;border:0;border-radius:8px;cursor:pointer;background:{{ navTaskBg }};color:{{ navTaskFg }};font-size:14px;font-weight:{{ navTaskWeight }}\">生产</button>\n      <button sc-camel-on-click=\"{{ goReview }}\" style=\"padding:6px 11px;border:0;border-radius:8px;cursor:pointer;background:{{ navReviewBg }};color:{{ navReviewFg }};font-size:14px;font-weight:{{ navReviewWeight }}\">审核</button>\n      <button sc-camel-on-click=\"{{ goDelivery }}\" style=\"padding:6px 11px;border:0;border-radius:8px;cursor:pointer;background:{{ navDelBg }};color:{{ navDelFg }};font-size:14px;font-weight:{{ navDelWeight }}\">交付</button>\n    </div>\n    <div style=\"flex:1\"></div>\n    <div style=\"display:flex;align-items:center;gap:16px;font-size:13px;color:#6b645d\">\n      <div>↻ 刷新</div>\n\n      <div style=\"position:relative\">\n        <div sc-camel-on-click=\"{{ dl.toggle }}\" title=\"{{ dl.tip }}\" style=\"width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ dl.iconFg }};background:{{ dl.iconBg }};position:relative\" style-hover=\"background:#f4f1ec\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4v10\"></path><path d=\"M7.6 9.6L12 14l4.4-4.4\"></path><path d=\"M4.5 17.5v1.2a1.3 1.3 0 0 0 1.3 1.3h12.4a1.3 1.3 0 0 0 1.3-1.3v-1.2\"></path></svg>\n        </div>\n\n        <sc-if value=\"{{ dl.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:calc(100% + 10px);right:0;width:min(430px,88vw);background:#fff;border:1px solid #e2dcd2;border-radius:12px;box-shadow:0 14px 40px rgba(34,31,28,.16);z-index:60;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #f0ece5\">\n              <div style=\"font-size:14px;font-weight:600;color:#221f1c\">下载</div>\n              <div style=\"font-size:12px;color:#9c948b\">{{ dl.summary }}</div>\n              <div style=\"flex:1\"></div>\n              <div sc-camel-on-click=\"{{ dl.clearDone }}\" style=\"font-size:12px;color:#b1543a;cursor:pointer;white-space:nowrap\">清除已完成</div>\n            </div>\n\n            <div style=\"max-height:min(430px,60vh);overflow-y:auto\">\n              <sc-for list=\"{{ dl.items }}\" as=\"d\" hint-placeholder-count=\"4\">\n                <div style=\"padding:12px 15px;border-bottom:1px solid #f4f0ea\">\n                  <div style=\"display:flex;align-items:flex-start;gap:11px\">\n                    <div style=\"width:26px;height:26px;flex:none;border-radius:8px;border:1px solid {{ d.iconBorder }};background:{{ d.iconBg }};color:{{ d.iconFg }};display:flex;align-items:center;justify-content:center\">\n                      <sc-if value=\"{{ d.isRunning }}\" hint-placeholder-val=\"{{ true }}\">\n                        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><path d=\"M12 5v6.6\"></path><path d=\"M8.4 8.6L12 12.2l3.6-3.6\"></path><path d=\"M5.5 17h13\"></path></svg>\n                      </sc-if>\n                      <sc-if value=\"{{ d.isPaused }}\" hint-placeholder-val=\"{{ false }}\">\n                        <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"7\" y=\"5\" width=\"3.6\" height=\"14\" rx=\"1\"></rect><rect x=\"13.4\" y=\"5\" width=\"3.6\" height=\"14\" rx=\"1\"></rect></svg>\n                      </sc-if>\n                      <sc-if value=\"{{ d.isDone }}\" hint-placeholder-val=\"{{ false }}\">\n                        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 10.6l3.6 3.6L15 6.6\"></path></svg>\n                      </sc-if>\n                      <sc-if value=\"{{ d.isFailed }}\" hint-placeholder-val=\"{{ false }}\">\n                        <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l8 8\"></path><path d=\"M14 6l-8 8\"></path></svg>\n                      </sc-if>\n                    </div>\n\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"display:flex;align-items:baseline;gap:9px\">\n                        <div style=\"font-size:13px;font-weight:600;color:#221f1c;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}</div>\n                        <div style=\"flex:1\"></div>\n                        <sc-if value=\"{{ d.notDone }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:12px;color:{{ d.stateFg }};white-space:nowrap\">{{ d.state }}</div></sc-if>\n                        <sc-if value=\"{{ d.isDone }}\" hint-placeholder-val=\"{{ false }}\">\n                          <button sc-camel-on-click=\"{{ d.download }}\" aria-label=\"{{ d.downloadAria }}\" style=\"height:28px;padding:0 10px;border:1px solid #a7cfae;background:#fff;border-radius:8px;font-size:12px;font-weight:600;color:#3f6b45;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap\" style-hover=\"background:#f2f7f2;border-color:#5f9a63\">\n                            <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 3v9\"></path><path d=\"M6.2 8.6L10 12.4l3.8-3.8\"></path><path d=\"M4 15.6h12\"></path></svg>{{ d.downloadLabel }}\n                          </button>\n                        </sc-if>\n                      </div>\n                      <div style=\"margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.meta }}</div>\n\n                      <sc-if value=\"{{ d.showBar }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"margin-top:8px;display:flex;align-items:center;gap:9px\">\n                          <div style=\"flex:1;height:5px;border-radius:3px;background:#f0ece5;overflow:hidden\">\n                            <div style=\"width:{{ d.pct }};height:100%;background:{{ d.barBg }}\"></div>\n                          </div>\n                          <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#8b847c;white-space:nowrap\">{{ d.pct }}</div>\n                        </div>\n                      </sc-if>\n\n                      <div style=\"margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                        <sc-if value=\"{{ d.canPause }}\" hint-placeholder-val=\"{{ true }}\">\n                          <div sc-camel-on-click=\"{{ d.pause }}\" style=\"height:27px;padding:0 11px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;font-size:12px;color:#3a352f;cursor:pointer;display:flex;align-items:center\" style-hover=\"border-color:#c1b8ab\">暂停</div>\n                        </sc-if>\n                        <sc-if value=\"{{ d.canResume }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div sc-camel-on-click=\"{{ d.resume }}\" style=\"height:27px;padding:0 11px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;font-size:12px;color:#3a352f;cursor:pointer;display:flex;align-items:center\" style-hover=\"border-color:#c1b8ab\">继续</div>\n                        </sc-if>\n                        <sc-if value=\"{{ d.canRetry }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div sc-camel-on-click=\"{{ d.retry }}\" style=\"height:27px;padding:0 11px;border:1px solid #eabaa8;background:#fff;border-radius:8px;font-size:12px;font-weight:600;color:#a5321f;cursor:pointer;display:flex;align-items:center\" style-hover=\"background:#fdf5f2\">重试</div>\n                        </sc-if>\n                        <div style=\"flex:1\"></div>\n                        <div sc-camel-on-click=\"{{ d.remove }}\" title=\"{{ d.removeHint }}\" style=\"font-size:12px;color:#9c948b;cursor:pointer;white-space:nowrap\" style-hover=\"color:#a5321f\">{{ d.removeLabel }}</div>\n                      </div>\n\n                      <sc-if value=\"{{ d.hasWhy }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"margin-top:7px;font-size:12px;color:#a5321f;line-height:1.6\">{{ d.why }}</div>\n                      </sc-if>\n                    </div>\n                  </div>\n                </div>\n              </sc-for>\n              <sc-if value=\"{{ dl.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:44px 20px;text-align:center;font-size:13px;color:#8b847c\">还没有下载任务</div>\n              </sc-if>\n            </div>\n          </div>\n        </sc-if>\n      </div>\n\n      <div style=\"position:relative\">\n        <div sc-camel-on-click=\"{{ notif.toggle }}\" title=\"{{ notif.tip }}\" style=\"width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:{{ notif.iconFg }};background:{{ notif.iconBg }}\" style-hover=\"background:#f4f1ec\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9a6 6 0 0 1 12 0c0 4 1.4 5.6 1.4 5.6H4.6S6 13 6 9Z\"></path><path d=\"M10 18.4a2.1 2.1 0 0 0 4 0\"></path></svg>\n          <sc-if value=\"{{ notif.hasUnread }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:absolute;top:-1px;right:-1px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#b1543a;color:#fff;font-size:11px;font-weight:600;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff;pointer-events:none\">{{ notif.unread }}</div>\n          </sc-if>\n        </div>\n\n        <sc-if value=\"{{ notif.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:calc(100% + 10px);right:0;width:min(420px,86vw);background:#fff;border:1px solid #e2dcd2;border-radius:12px;box-shadow:0 14px 40px rgba(34,31,28,.16);z-index:60;overflow:hidden\">\n\n            <div style=\"display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #f0ece5\">\n              <div style=\"font-size:14px;font-weight:600;color:#221f1c\">通知</div>\n              <div style=\"font-size:12px;color:#9c948b\">{{ notif.summary }}</div>\n              <div style=\"flex:1\"></div>\n              <div sc-camel-on-click=\"{{ notif.readAll }}\" style=\"font-size:12px;color:#b1543a;cursor:pointer;white-space:nowrap\">全部标为已读</div>\n            </div>\n\n            <div style=\"max-height:min(420px,58vh);overflow-y:auto\">\n              <sc-for list=\"{{ notif.items }}\" as=\"n\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ n.go }}\" style=\"display:grid;grid-template-columns:26px minmax(0,1fr);gap:11px;padding:12px 15px;border-bottom:1px solid #f4f0ea;cursor:pointer;background:{{ n.bg }}\" style-hover=\"background:#fcfbf9\">\n                  <div style=\"width:26px;height:26px;border-radius:8px;border:1px solid {{ n.iconBorder }};background:{{ n.iconBg }};color:{{ n.iconFg }};display:flex;align-items:center;justify-content:center;flex:none\">\n                    <sc-if value=\"{{ n.isDone }}\" hint-placeholder-val=\"{{ true }}\">\n                      <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 10.6l3.6 3.6L15 6.6\"></path></svg>\n                    </sc-if>\n                    <sc-if value=\"{{ n.isFail }}\" hint-placeholder-val=\"{{ false }}\">\n                      <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l8 8\"></path><path d=\"M14 6l-8 8\"></path></svg>\n                    </sc-if>\n                    <sc-if value=\"{{ n.isPass }}\" hint-placeholder-val=\"{{ false }}\">\n                      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 20 20\" fill=\"currentColor\"><circle cx=\"10\" cy=\"10\" r=\"8\"></circle><path d=\"M5.9 10.4l2.8 2.8 5.2-6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg>\n                    </sc-if>\n                  </div>\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\">\n                      <div style=\"font-size:13px;font-weight:{{ n.weight }};color:#221f1c;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.title }}</div>\n                      <div style=\"flex:1\"></div>\n                      <div style=\"font-size:12px;color:#9c948b;white-space:nowrap\">{{ n.when }}</div>\n                    </div>\n                    <div style=\"margin-top:5px;font-size:13px;color:#6b645d;line-height:1.6;text-wrap:pretty\">{{ n.body }}</div>\n                    <div style=\"margin-top:6px;font-size:12px;color:#b1543a\">{{ n.cta }}</div>\n                  </div>\n                </div>\n              </sc-for>\n              <sc-if value=\"{{ notif.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:40px 20px;text-align:center;font-size:13px;color:#8b847c\">本轮没有新的完成通知</div>\n              </sc-if>\n            </div>\n\n            <div style=\"display:flex;align-items:center;gap:11px;padding:12px 15px;background:#fcfbf9;border-top:1px solid #f0ece5\">\n              <div style=\"width:22px;height:22px;flex:none;border-radius:6px;background:#f2efe9;border:1px solid #ddd6cb;color:#6b645d;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center\">飞</div>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:13px;color:#3a352f\">同步到飞书</div>\n                <div style=\"margin-top:3px;font-size:12px;color:#9c948b;line-height:1.5\">{{ notif.feishuNote }}</div>\n              </div>\n              <div sc-camel-on-click=\"{{ notif.toggleFeishu }}\" style=\"width:38px;height:22px;flex:none;border-radius:10px;background:{{ notif.feishuBg }};position:relative;cursor:pointer;transition:background .15s\">\n                <div style=\"position:absolute;top:2px;left:{{ notif.knobLeft }};width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(34,31,28,.24);transition:left .15s\"></div>\n              </div>\n            </div>\n          </div>\n        </sc-if>\n      </div>\n\n      <div>一万</div>\n    </div>\n  </div>\n\n  <sc-if value=\"{{ showSubNav }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;align-items:center;gap:22px;padding:0 clamp(14px,2vw,28px);min-height:44px;background:#fff;border-bottom:1px solid #e8e2d9;position:sticky;top:56px;z-index:39;flex-wrap:wrap\">\n    <div style=\"display:flex;align-items:center;gap:4px\">\n      <sc-for list=\"{{ subNav }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ s.pick }}\" style=\"padding:5px 11px;border-radius:8px;font-size:14px;cursor:pointer;color:{{ s.fg }};font-weight:{{ s.weight }};border-bottom:2px solid {{ s.underline }};border-radius:0;white-space:nowrap\">{{ s.label }}</div>\n      </sc-for>\n    </div>\n  </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isPipelines }}\" hint-placeholder-val=\"{{ true }}\">\n\n    <sc-if value=\"{{ pipeCopy.open }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ pipeCopy.cancel }}\" style=\"position:fixed;inset:0;background:rgba(34,31,28,.34);z-index:82;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div sc-camel-on-click=\"{{ pipeCopy.stop }}\" style=\"width:min(600px,100%);background:#fff;border:1px solid #e2dcd2;border-radius:14px;box-shadow:0 24px 60px rgba(34,31,28,.24);padding:26px clamp(20px,3vw,30px)\">\n          <div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em\">填写新 Pipeline 信息</div>\n          <div style=\"margin-top:8px;font-size:14px;color:#6b645d;line-height:1.7;text-wrap:pretty\">以来源 Pipeline 为模板，沿用流程节点和关联数据集。确认信息后才会创建，并继续进入流程编辑。</div>\n\n          <div style=\"margin-top:18px;border:1px solid #ece7df;background:#fcfbf9;border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:82px minmax(0,1fr);gap:7px 12px;align-items:baseline\">\n            <div style=\"font-size:12px;color:#9c948b\">来源 Pipeline</div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#3a352f;overflow-wrap:anywhere\">{{ pipeCopy.source }} {{ pipeCopy.sourceVersion }}</div>\n            <div style=\"font-size:12px;color:#9c948b\">新版本</div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#3a352f\">v1</div>\n            <div style=\"font-size:12px;color:#9c948b\">创建者</div>\n            <div style=\"font-size:13px;color:#3a352f\">{{ pipeCopy.owner }}</div>\n          </div>\n\n          <label style=\"display:block;margin-top:18px\">\n            <div style=\"font-size:13px;font-weight:600;color:#3a352f;margin-bottom:7px\">新 Pipeline 名称 <span style=\"color:#b1543a\">必填</span></div>\n            <input sc-camel-on-change=\"{{ pipeCopy.onName }}\" value=\"{{ pipeCopy.name }}\" placeholder=\"输入新 Pipeline 名称\" style=\"width:100%;height:40px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#221f1c\">\n            <div style=\"margin-top:6px;font-size:12px;color:{{ pipeCopy.nameHintFg }};line-height:1.5\">{{ pipeCopy.nameHint }}</div>\n          </label>\n\n          <label style=\"display:block;margin-top:15px\">\n            <div style=\"font-size:13px;font-weight:600;color:#3a352f;margin-bottom:7px\">说明 <span style=\"font-weight:400;color:#9c948b\">可选</span></div>\n            <textarea sc-camel-on-change=\"{{ pipeCopy.onDesc }}\" value=\"{{ pipeCopy.desc }}\" placeholder=\"说明这个副本的用途或计划修改\" style=\"width:100%;min-height:82px;resize:vertical;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;color:#221f1c;line-height:1.65\"></textarea>\n          </label>\n\n          <div style=\"margin-top:22px;display:flex;justify-content:flex-end;gap:9px\">\n            <button sc-camel-on-click=\"{{ pipeCopy.cancel }}\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 18px;font-size:14px;color:#6b645d;cursor:pointer\">取消</button>\n            <sc-if value=\"{{ pipeCopy.canSave }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ pipeCopy.save }}\" style=\"height:38px;border:none;background:#b1543a;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#95452f\">创建并继续编辑</button>\n            </sc-if>\n            <sc-if value=\"{{ pipeCopy.cannotSave }}\" hint-placeholder-val=\"{{ true }}\">\n              <button style=\"height:38px;border:none;background:#e2b3a6;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:not-allowed\">创建并继续编辑</button>\n            </sc-if>\n          </div>\n        </div>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{ newPipe.open }}\" hint-placeholder-val=\"{{ false }}\">\n      <div sc-camel-on-click=\"{{ newPipe.close }}\" style=\"position:fixed;inset:0;background:rgba(34,31,28,.34);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px\">\n        <div sc-camel-on-click=\"{{ newPipe.stop }}\" style=\"width:min(560px,100%);background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(34,31,28,.24);padding:28px clamp(20px,3vw,32px)\">\n          <div style=\"font-size:20px;font-weight:600;letter-spacing:-0.01em\">上传 Pipeline</div>\n          <div style=\"margin-top:8px;font-size:14px;color:#6b645d;line-height:1.7;text-wrap:pretty\">上传 YAML 文件；名称不存在时创建 v1，已存在时追加新版本。</div>\n\n          <div sc-camel-on-click=\"{{ newPipe.pick }}\" style=\"margin-top:20px;border:1px dashed #d3cabd;background:#faf8f5;border-radius:12px;padding:28px 20px;text-align:center;cursor:pointer\" style-hover=\"border-color:#b1543a\">\n            <div style=\"display:inline-flex;align-items:center;height:38px;padding:0 18px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;font-size:14px;color:#3a352f\">选择 YAML 文件</div>\n            <div style=\"margin-top:12px;font-size:13px;color:#9c948b\">{{ newPipe.hint }}</div>\n          </div>\n\n          <sc-if value=\"{{ newPipe.hasFile }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;border:1px solid #ece7df;background:#fcfbf9;border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:66px minmax(0,1fr);gap:6px 12px;align-items:baseline\">\n              <sc-for list=\"{{ newPipe.parsed }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <div style=\"font-size:12px;color:#9c948b;white-space:nowrap\">{{ f.k }}</div>\n                <div style=\"font-size:13px;color:#3a352f;overflow-wrap:anywhere\">{{ f.v }}</div>\n              </sc-for>\n            </div>\n          </sc-if>\n\n          <div style=\"margin-top:22px;display:flex;justify-content:flex-end;gap:9px\">\n            <button sc-camel-on-click=\"{{ newPipe.close }}\" style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 18px;font-size:14px;color:#6b645d;cursor:pointer\">取消</button>\n            <sc-if value=\"{{ newPipe.canCreate }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ newPipe.create }}\" style=\"height:38px;border:none;background:#b1543a;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#95452f\">确认创建</button>\n            </sc-if>\n            <sc-if value=\"{{ newPipe.cannotCreate }}\" hint-placeholder-val=\"{{ true }}\">\n              <button style=\"height:38px;border:none;background:#e2b3a6;color:#fff;border-radius:10px;padding:0 20px;font-size:14px;font-weight:600;cursor:not-allowed\">确认创建</button>\n            </sc-if>\n          </div>\n        </div>\n      </div>\n    </sc-if>\n    <div style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <sc-if value=\"{{ rerollBanner }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-bottom:18px;border:1px solid #eabaa8;background:#fdf5f2;border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap\">\n          <div style=\"width:26px;height:26px;flex:none;border-radius:50%;background:#fff;border:1px solid #eabaa8;color:#b1543a;display:flex;align-items:center;justify-content:center\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16.5 6.5A7 7 0 1 0 17 11\"></path><path d=\"M17 3.2v3.6h-3.6\"></path></svg>\n          </div>\n          <div style=\"flex:1;min-width:220px\">\n            <div style=\"font-size:14px;font-weight:600;color:#8f4029\">Reroll · {{ rerollName }}</div>\n            <div style=\"margin-top:5px;font-size:13px;color:#6b645d;line-height:1.65;text-wrap:pretty\">{{ rerollHintText }}</div>\n          </div>\n          <div sc-camel-on-click=\"{{ clearReroll }}\" style=\"flex:none;font-size:13px;color:#8b847c;cursor:pointer\" style-hover=\"color:#221f1c\">取消 reroll</div>\n        </div>\n      </sc-if>\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">Pipeline</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:#6b645d\">{{ pipeSubtitle }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <button sc-camel-on-click=\"{{ openNewPipe }}\" style=\"height:38px;border:none;background:#b1543a;color:#fff;border-radius:10px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#95452f\">＋ 新建 Pipeline</button>\n      </div>\n\n      <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap\">\n        <div style=\"position:relative;flex:1;min-width:210px;max-width:340px\">\n          <div style=\"position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#9c948b\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"8.5\" cy=\"8.5\" r=\"5.5\"></circle><path d=\"M12.8 12.8L17 17\"></path></svg>\n          </div>\n          <input sc-camel-on-change=\"{{ onPipeQuery }}\" value=\"{{ pipeQuery }}\" placeholder=\"搜索 Pipeline 名称…\" style=\"width:100%;height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 12px 0 34px;font-size:14px;color:#221f1c\">\n        </div>\n        <div style=\"display:flex;gap:2px;background:#f0ece5;border-radius:10px;padding:3px\">\n          <sc-for list=\"{{ pipeFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};white-space:nowrap;box-shadow:{{ f.shadow }}\">{{ f.label }}</div>\n          </sc-for>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div style=\"font-size:13px;color:#8b847c\">{{ pipeCount }}</div>\n      </div>\n\n      <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:14px;overflow:hidden\">\n        <div>\n          <div>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1.7fr) 62px 50px clamp(78px,9vw,104px) 62px clamp(92px,10vw,110px) clamp(74px,8vw,88px) 28px;gap:clamp(8px,1vw,12px);padding:10px 18px;background:#faf8f5;border-bottom:1px solid #f0ece5;font-size:12px;color:#8b847c;white-space:nowrap\">\n              <div>名称</div>\n              <div>当前版本</div>\n              <div>节点</div>\n              <div>最近运行</div>\n              <div>运行数</div>\n              <div>成功率</div>\n              <div>均价 / 条</div>\n              <div></div>\n            </div>\n\n            <sc-for list=\"{{ pipelines }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <div>\n                <div sc-camel-on-click=\"{{ p.toggle }}\" style=\"display:grid;grid-template-columns:minmax(0,1.7fr) 62px 50px clamp(78px,9vw,104px) 62px clamp(92px,10vw,110px) clamp(74px,8vw,88px) 28px;gap:clamp(8px,1vw,12px);align-items:center;padding:12px 18px;border-bottom:1px solid #f4f0ea;cursor:pointer;background:{{ p.bg }}\" style-hover=\"background:#fcfbf9\">\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n                      <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}</div>\n                      <sc-if value=\"{{ p.stale }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:11px;color:#8a5a16;border:1px solid #e0c48c;border-radius:6px;padding:1px 8px;white-space:nowrap\">废弃</div>\n                      </sc-if>\n                    </div>\n                    <div style=\"margin-top:5px;font-size:12px;color:#8b847c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.owner }} · {{ p.versionCount }}</div>\n                  </div>\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600\">{{ p.version }}</div>\n                  <div style=\"font-size:13px;color:#3a352f\">{{ p.nodes }}</div>\n                  <div style=\"font-size:13px;color:{{ p.lastFg }}\">{{ p.last }}</div>\n                  <div style=\"font-size:13px;color:#3a352f\">{{ p.runs }}</div>\n                  <div style=\"display:flex;align-items:center;gap:7px\">\n                    <div style=\"flex:1;height:5px;border-radius:3px;background:#f0ece5;overflow:hidden\">\n                      <div style=\"width:{{ p.rateW }};height:100%;background:{{ p.rateColor }}\"></div>\n                    </div>\n                    <div style=\"font-size:13px;font-weight:600;color:{{ p.rateColor }};white-space:nowrap\">{{ p.rate }}</div>\n                  </div>\n                  <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#3a352f;white-space:nowrap\">{{ p.unitCost }}</div>\n                  <div style=\"font-size:12px;color:#9c948b;text-align:right\">{{ p.chev }}</div>\n                </div>\n\n                <sc-if value=\"{{ p.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-bottom:1px solid #f0ece5;background:#fcfbf9;padding:16px 18px\">\n\n                    <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap\">\n                      <div style=\"flex:1;min-width:100px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\">\n                        <div style=\"font-size:12px;color:#9c948b\">累计成本</div>\n                        <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600\">{{ p.cost }}</div>\n                        <div style=\"font-size:12px;color:#9c948b\">· {{ p.runs }}</div>\n                      </div>\n                      <button sc-camel-on-click=\"{{ p.copy }}\" style=\"height:34px;border:1px solid #ddd6cb;background:#fff;border-radius:8px;padding:0 13px;font-size:13px;color:#3a352f;cursor:pointer;white-space:nowrap;flex:none\" style-hover=\"border-color:#c1b8ab\">{{ p.copyLabel }}</button>\n                      <button sc-camel-on-click=\"{{ p.run }}\" style=\"height:34px;border:none;background:#b1543a;color:#fff;border-radius:8px;padding:0 15px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#95452f\">新建运行</button>\n                    </div>\n\n                    <div>\n                      <div>\n                        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\">\n                          <div style=\"font-size:12px;color:#9c948b\">流程 · {{ p.nodes }}节点</div>\n                          <div sc-camel-on-click=\"{{ p.edit }}\" title=\"在完整页面中查看和编辑流程\" style=\"width:24px;height:24px;flex:none;border-radius:6px;border:1px solid #ddd6cb;background:#fff;color:#6b645d;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"border-color:#b1543a;color:#b1543a\">\n                            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12.5 3.5h4v4\"></path><path d=\"M7.5 16.5h-4v-4\"></path><path d=\"M16.5 3.5l-5.6 5.6\"></path><path d=\"M3.5 16.5l5.6-5.6\"></path></svg>\n                          </div>\n                        </div>\n                        <div style=\"border:1px solid #ece7df;border-radius:10px;background:#fcfbf9;padding:13px 14px;overflow-x:auto\">\n                          <div style=\"display:flex;align-items:stretch;gap:0;min-width:0\">\n                            <sc-for list=\"{{ p.dag }}\" as=\"d\" hint-placeholder-count=\"5\">\n                              <div style=\"display:flex;align-items:center;flex:none\">\n                                <div style=\"display:flex;flex-direction:column;gap:5px;border:1px solid {{ d.border }};background:{{ d.bg }};border-radius:8px;padding:8px 11px\">\n                                  <div style=\"display:flex;align-items:center;gap:6px\">\n                                    <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#221f1c;white-space:nowrap;letter-spacing:-0.01em\">{{ d.name }}</div>\n                                  </div>\n                                  <div style=\"display:flex;align-items:center;gap:5px\">\n                                    <div style=\"width:5px;height:5px;border-radius:50%;background:{{ d.accent }};flex:none\"></div>\n                                    <div style=\"font-size:11px;color:{{ d.kindFg }};letter-spacing:.06em;white-space:nowrap\">{{ d.kind }}</div>\n                                  </div>\n                                </div>\n                                <sc-if value=\"{{ d.hasArrow }}\" hint-placeholder-val=\"{{ true }}\">\n                                  <div style=\"width:16px;height:1.5px;background:#e2dcd2;flex:none\"></div>\n                                </sc-if>\n                              </div>\n                            </sc-for>\n                          </div>\n                        </div>\n\n                        <div style=\"margin-top:14px\">\n                          <div style=\"font-size:12px;color:#9c948b;margin-bottom:8px\">版本历史</div>\n                          <div style=\"border:1px solid #ece7df;border-radius:10px;background:#fff;overflow:hidden\">\n                            <sc-for list=\"{{ p.versions }}\" as=\"v\" hint-placeholder-count=\"3\">\n                              <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr) 92px;gap:12px;align-items:baseline;padding:9px 13px;border-bottom:1px solid #f4f0ea\">\n                                <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;color:{{ v.fg }}\">{{ v.tag }}</div>\n                                <div style=\"font-size:13px;color:#3a352f;line-height:1.6;overflow-wrap:anywhere\">{{ v.change }}</div>\n                                <div style=\"font-size:12px;color:#9c948b;text-align:right;white-space:nowrap\">{{ v.when }}</div>\n                              </div>\n                            </sc-for>\n                          </div>\n                        </div>\n                      </div>\n\n                    </div>\n                  </div>\n                </sc-if>\n              </div>\n            </sc-for>\n            <sc-if value=\"{{ pipeEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:34px 18px;text-align:center\">\n                <div style=\"font-size:14px;color:#6b645d\">没有匹配的 Pipeline</div>\n                <div sc-camel-on-click=\"{{ clearPipeQuery }}\" style=\"margin-top:9px;font-size:13px;color:#b1543a;cursor:pointer\">清除搜索与筛选</div>\n              </div>\n            </sc-if>\n          </div>\n        </div>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isDelivery }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">交付</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:#6b645d\">{{ delivery.subtitle }}</div>\n        </div>\n      </div>\n\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:2px;background:#f0ece5;border-radius:10px;padding:3px\">\n          <sc-for list=\"{{ delivery.cats }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};white-space:nowrap;box-shadow:{{ f.shadow }}\">{{ f.label }}</div>\n          </sc-for>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div style=\"font-size:13px;color:#8b847c;white-space:nowrap\">{{ delivery.count }}</div>\n        <div style=\"position:relative\">\n          <div sc-camel-on-click=\"{{ delivery.toggleSort }}\" style=\"display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;font-size:13px;color:#3a352f;cursor:pointer;white-space:nowrap\" style-hover=\"border-color:#c1b8ab\">\n            {{ delivery.sortLabel }}\n            <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#9c948b\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 4.6L6 7.6l3-3\"></path></svg>\n          </div>\n          <sc-if value=\"{{ delivery.sortOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:calc(100% + 6px);right:0;min-width:140px;background:#fff;border:1px solid #e2dcd2;border-radius:10px;padding:5px;box-shadow:0 8px 22px rgba(34,31,28,.12);z-index:30\">\n              <sc-for list=\"{{ delivery.sorts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:8px;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};white-space:nowrap\" style-hover=\"background:#f7f4ef\">\n                  <div style=\"width:12px;flex:none;color:#b1543a\">{{ o.mark }}</div>{{ o.label }}\n                </div>\n              </sc-for>\n            </div>\n          </sc-if>\n        </div>\n      </div>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <sc-for list=\"{{ delivery.customers }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap\">\n              <div style=\"font-size:15px;font-weight:600\">{{ c.name }}</div>\n              <div style=\"font-size:13px;color:#8b847c\">{{ c.meta }}</div>\n            </div>\n\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n              <sc-for list=\"{{ c.sheets }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <div sc-camel-on-click=\"{{ d.open }}\" style=\"background:#fff;border:1px solid #e8e2d9;border-radius:12px;padding:16px 18px;cursor:pointer\" style-hover=\"border-color:#c1b8ab\">\n                  <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}</div>\n                      <div style=\"margin-top:5px;font-size:12px;color:#9c948b\">{{ d.created }}</div>\n                    </div>\n                    <div style=\"font-size:12px;border-radius:6px;padding:3px 10px;border:1px solid {{ d.badgeBorder }};color:{{ d.badgeFg }};white-space:nowrap;flex:none\">{{ d.badge }}</div>\n                  </div>\n\n                  <div style=\"margin-top:14px;display:flex;height:8px;border-radius:4px;background:#f0ece5;overflow:hidden\">\n                    <div style=\"width:{{ d.segPass }};background:#5f9a63\"></div>\n                    <div style=\"width:{{ d.segReview }};background:#c8912f\"></div>\n                    <div style=\"width:{{ d.segFail }};background:#a5321f\"></div>\n                  </div>\n\n                  <div style=\"margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px\">\n                    <sc-for list=\"{{ d.funnel }}\" as=\"f\" hint-placeholder-count=\"4\">\n                      <div style=\"min-width:0\">\n                        <div style=\"display:flex;align-items:center;gap:5px\">\n                          <div style=\"width:6px;height:6px;border-radius:2px;background:{{ f.color }};flex:none\"></div>\n                          <div style=\"font-size:11px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ f.k }}</div>\n                        </div>\n                        <div style=\"margin-top:4px;font-size:15px;font-weight:600;color:{{ f.fg }};line-height:1\">{{ f.v }}</div>\n                      </div>\n                    </sc-for>\n                  </div>\n\n                  <div style=\"margin-top:13px;padding-top:11px;border-top:1px solid #f0ece5;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                    <div style=\"flex:1;min-width:120px;font-size:12px;color:#8b847c\">{{ d.hint }}</div>\n                    <div style=\"font-size:13px;color:#b1543a;white-space:nowrap\">查看子项 →</div>\n                  </div>\n                </div>\n              </sc-for>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isSheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div sc-camel-on-click=\"{{ goDelivery }}\" style=\"display:inline-block;font-size:13px;color:#8b847c;margin-bottom:16px;cursor:pointer\" style-hover=\"color:#221f1c\">← 返回交付</div>\n\n      <div style=\"display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px\">\n        <div style=\"min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">{{ sheet.name }}</h1>\n            <div style=\"font-size:12px;color:#b1543a;border:1px solid #eabaa8;background:#fdf5f2;border-radius:999px;padding:3px 10px\">{{ sheet.customer }}</div>\n          </div>\n          <div style=\"margin-top:8px;font-size:14px;color:#6b645d\">{{ sheet.desc }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n          <button style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 15px;font-size:14px;color:#3a352f;cursor:pointer\" style-hover=\"border-color:#c1b8ab\">编辑数据单</button>\n          <button style=\"height:38px;border:none;background:#b1543a;color:#fff;border-radius:10px;padding:0 17px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:#95452f\">{{ sheet.exportLabel }}</button>\n        </div>\n      </div>\n\n      <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:12px;padding:16px 18px;margin-bottom:14px\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px\">\n          <div style=\"font-size:14px;font-weight:600\">履约进度</div>\n          <div style=\"flex:1\"></div>\n          <div style=\"font-size:13px;color:#8b847c\">{{ sheet.progressHint }}</div>\n        </div>\n        <div style=\"display:flex;height:10px;border-radius:6px;background:#f0ece5;overflow:hidden\">\n          <div style=\"width:{{ sheet.segPass }};background:#5f9a63\"></div>\n          <div style=\"width:{{ sheet.segReview }};background:#c8912f\"></div>\n          <div style=\"width:{{ sheet.segFail }};background:#a5321f\"></div>\n        </div>\n        <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px\">\n          <sc-for list=\"{{ sheet.funnel }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:6px\">\n                <div style=\"width:7px;height:7px;border-radius:2px;background:{{ f.color }};flex:none\"></div>\n                <div style=\"font-size:12px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ f.k }}</div>\n              </div>\n              <div style=\"margin-top:6px;display:flex;align-items:baseline;gap:4px\">\n                <div style=\"font-size:17px;font-weight:600;color:{{ f.fg }};line-height:1\">{{ f.v }}</div>\n                <div style=\"font-size:12px;color:#9c948b\">条</div>\n              </div>\n              <div style=\"margin-top:5px;font-size:11px;color:#9c948b;line-height:1.5\">{{ f.note }}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div style=\"display:block\">\n\n        <div style=\"flex:1 1 0;min-width:0\">\n        <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:14px;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid #f0ece5;flex-wrap:wrap\">\n            <div style=\"display:flex;gap:2px;background:#f0ece5;border-radius:10px;padding:3px\">\n              <sc-for list=\"{{ sheet.filters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};white-space:nowrap;box-shadow:{{ f.shadow }}\">{{ f.label }}</div>\n              </sc-for>\n            </div>\n            <div style=\"position:relative;flex:1;min-width:210px;max-width:340px\">\n              <div style=\"position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;pointer-events:none\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#9c948b\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"8.5\" cy=\"8.5\" r=\"5.5\"></circle><path d=\"M12.8 12.8L17 17\"></path></svg></div>\n              <input sc-camel-on-change=\"{{ sheet.onQuery }}\" value=\"{{ sheet.query }}\" placeholder=\"搜索子项、Item ID、Run ID 或状态\" style=\"width:100%;height:36px;border:1px solid #ddd6cb;background:#fff;border-radius:9px;padding:0 34px;font-size:13px;color:#221f1c\">\n              <sc-if value=\"{{ sheet.hasQuery }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ sheet.clearQuery }}\" style=\"position:absolute;right:7px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8b847c;cursor:pointer\" style-hover=\"background:#f2efe9\">×</div></sc-if>\n            </div>\n            <div style=\"flex:1\"></div>\n            <div style=\"font-size:13px;color:#8b847c;white-space:nowrap\">{{ sheet.count }}</div>\n          </div>\n\n          <sc-if value=\"{{ sheet.showTip }}\" hint-placeholder-val=\"{{ true }}\">\n            <div role=\"status\" style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff8e8;border-bottom:1px solid #f0e0b9\">\n              <div style=\"width:22px;height:22px;flex:none;border-radius:6px;background:#fff;color:#8a5a16;border:1px solid #e0c48c;display:flex;align-items:center;justify-content:center\">\n                <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 4.5l4.2 11 1.9-4.4 4.4-1.9z\"></path></svg>\n              </div>\n              <div style=\"flex:1;min-width:0;font-size:12px;color:#6b645d;line-height:1.65;text-wrap:pretty\">点击任一子项打开大窗口查看产物、版本关系与审核记录；使用 ↑ ↓ 切换，Esc 关闭。</div>\n              <button sc-camel-on-click=\"{{ sheet.hideTip }}\" style=\"flex:none;height:28px;padding:0 10px;border:1px solid #e0c48c;background:#fff;border-radius:7px;font-size:12px;color:#8a5a16;cursor:pointer;white-space:nowrap\" style-hover=\"background:#fffdf8;border-color:#c8912f\">知道了</button>\n            </div>\n          </sc-if>\n\n          <div style=\"display:grid;grid-template-columns:52px minmax(0,1.5fr) minmax(0,1.1fr) clamp(92px,11vw,116px);gap:clamp(9px,1.2vw,14px);padding:10px 16px;background:#faf8f5;border-bottom:1px solid #f0ece5;font-size:12px;color:#8b847c;white-space:nowrap\">\n            <div>预览</div>\n            <div>子项</div>\n            <div>目录</div>\n            <div>状态</div>\n          </div>\n\n          <sc-for list=\"{{ sheet.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div sc-camel-on-click=\"{{ r.select }}\" style=\"display:grid;grid-template-columns:52px minmax(0,1.5fr) minmax(0,1.1fr) clamp(92px,11vw,116px);gap:clamp(9px,1.2vw,14px);align-items:center;padding:11px 16px;border-bottom:1px solid #f4f0ea;cursor:pointer;background:{{ r.bg }};border-left:3px solid {{ r.mark }}\" style-hover=\"background:#fcfbf9\">\n              <div style=\"height:38px;border-radius:10px;border:1px solid #e8e2d9;background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px)\"></div>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.name }}</div>\n                <div style=\"margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.id }}</div>\n              </div>\n              <div style=\"font-size:13px;color:#6b645d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.path }}</div>\n              <div>\n                <div style=\"display:inli n        </div>\n        </sc-if>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"margin-bottom:20px\">\n        <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">概览</h1>\n        <div style=\"margin-top:7px;font-size:14px;color:#6b645d\">{{ over.subtitle }}</div>\n      </div>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:20px\">\n        <sc-for list=\"{{ over.stats }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ s.go }}\" style=\"border:1px solid #e8e2d9;background:#fff;border-radius:10px;padding:14px 16px;cursor:{{ s.cursor }}\" style-hover=\"border-color:#c1b8ab\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <div style=\"width:7px;height:7px;border-radius:2px;background:{{ s.accent }};flex:none\"></div>\n              <div style=\"font-size:12px;color:#9c948b;white-space:nowrap\">{{ s.k }}</div>\n            </div>\n            <div style=\"margin-top:8px;display:flex;align-items:baseline;gap:4px\">\n              <div style=\"font-size:25px;font-weight:600;letter-spacing:-0.02em;color:{{ s.fg }};line-height:1\">{{ s.v }}</div>\n              <div style=\"font-size:12px;color:#9c948b\">{{ s.unit }}</div>\n            </div>\n            <div style=\"margin-top:7px;font-size:12px;color:#8b847c\">{{ s.note }}</div>\n          </div>\n        </sc-for>\n      </div>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ over.groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n          <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:14px;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #f0ece5\">\n              <div style=\"font-size:15px;font-weight:600\">{{ g.title }}</div>\n              <div style=\"font-size:12px;color:#9c948b\">{{ g.count }}</div>\n              <div style=\"flex:1\"></div>\n              <div sc-camel-on-click=\"{{ g.go }}\" style=\"font-size:13px;color:#b1543a;cursor:pointer;white-space:nowrap\">{{ g.linkLabel }}</div>\n            </div>\n            <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ r.go }}\" style=\"display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid #f4f0ea;cursor:pointer\" style-hover=\"background:#fcfbf9\">\n                <div style=\"width:6px;height:6px;border-radius:50%;background:{{ r.dot }};flex:none\"></div>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13px;color:#221f1c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.title }}</div>\n                  <div style=\"margin-top:4px;font-size:12px;color:#9c948b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.sub }}</div>\n                </div>\n                <div style=\"font-size:12px;color:{{ r.fg }};white-space:nowrap\">{{ r.right }}</div>\n              </div>\n            </sc-for>\n            <sc-if value=\"{{ g.empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:22px 16px;font-size:13px;color:#9c948b;text-align:center\">{{ g.emptyLabel }}</div>\n            </sc-if>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isResources }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">资源</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:#6b645d\">{{ res.subtitle }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <button style=\"height:38px;border:1px solid #ddd6cb;background:#fff;border-radius:10px;padding:0 15px;font-size:13px;color:#3a352f;cursor:pointer\" style-hover=\"border-color:#c1b8ab\">＋ 新建资源包</button>\n      </div>\n\n      <div style=\"background:#fff;border:1px solid #e8e2d9;border-radius:14px;padding:56px 24px;text-align:center\">\n        <div style=\"width:44px;height:44px;margin:0 auto 14px;border-radius:12px;border:1px solid #e8e2d9;background:#faf8f5;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#c1b8ab\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7.5h16\"></path><path d=\"M4 12h16\"></path><path d=\"M4 16.5h10\"></path></svg>\n        </div>\n        <div style=\"font-size:15px;font-weight:600;color:#3a352f\">还没有资源</div>\n        <div style=\"margin-top:7px;font-size:13px;color:#8b847c;line-height:1.7;max-width:360px;margin-left:auto;margin-right:auto;text-wrap:pretty\">这一页用于管理 webdev 的引用关系。字段确定后再填内容。</div>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isItemLife }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1000px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 70px\">\n\n      <sc-if value=\"{{ life.isBranch }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ life.backToTrunk }}\" style=\"display:inline-block;font-size:13px;color:#8b847c;margin-bottom:16px;cursor:pointer\" style-hover=\"color:#221f1c\">{{ life.trunkLink }}</div>\n      </sc-if>\n      <sc-if value=\"{{ life.notBranch }}\" hint-placeholder-val=\"{{ true }}\">\n        <div sc-camel-on-click=\"{{ life.back }}\" style=\"display:inline-block;font-size:13px;color:#8b847c;margin-bottom:16px;cursor:pointer\" style-hover=\"color:#2
