>\n\n                <div class=\"forge-sheet-scroll\" style=\"grid-column:2;grid-row:1;min-width:0;min-height:0;overflow-y:auto\">\n<!-- sheet-feedback:start -->\n<sc-if value=\"{{ sheet.pick.reworkFormOpen }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"forge-sheet-feedback\"><section class=\"review-workbench-rework-form forge-feedback\">\n          <h2 class=\"forge-feedback-title\">{{ sheet.pick.reworkTitle }}</h2>\n          <p class=\"forge-feedback-context\">{{ sheet.pick.name }} · {{ sheet.pick.artifactVersion }}<br>{{ sheet.pick.round }}</p>\n          <div class=\"forge-feedback-field\">\n            <label for=\"forge-sheet-rework-note\">返工说明 <span class=\"forge-feedback-required\">*</span></label>\n            <textarea id=\"forge-sheet-rework-note\" aria-label=\"返工说明\" aria-required=\"true\" required maxlength=\"5000\" sc-camel-on-change=\"{{ sheet.pick.onReworkText }}\" value=\"{{ sheet.pick.reworkText }}\" placeholder=\"说明这一轮要改什么：保留什么、改什么、验收标准。\" aria-describedby=\"forge-sheet-rework-hint\"></textarea>\n          </div>\n          <div class=\"forge-feedback-upload-row\">\n            <label class=\"forge-feedback-upload\" data-disabled=\"{{ sheet.pick.feedback.full }}\"><svg class=\"forge-icon\" data-phosphor=\"paperclip\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M209.66,122.34a8,8,0,0,1,0,11.32l-82.05,82a56,56,0,0,1-79.2-79.21L147.67,35.73a40,40,0,1,1,56.61,56.55L105,193A24,24,0,1,1,71,159L154.3,74.38A8,8,0,1,1,165.7,85.6L82.39,170.31a8,8,0,1,0,11.27,11.36L192.93,81A24,24,0,1,0,159,47L59.76,147.68a40,40,0,1,0,56.53,56.62l82.06-82A8,8,0,0,1,209.66,122.34Z\"></path></svg><span>上传图片</span><input type=\"file\" accept=\"image/png,image/jpeg,image/webp,image/gif\" multiple disabled=\"{{ sheet.pick.feedback.full }}\" aria-label=\"上传返工参考图片\" sc-camel-on-change=\"{{ sheet.pick.feedback.upload }}\" /></label>\n            <span class=\"forge-feedback-paste\"><svg class=\"forge-icon\" data-phosphor=\"clipboard\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,32H163.74a47.92,47.92,0,0,0-71.48,0H56A16,16,0,0,0,40,48V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm-72,0a32,32,0,0,1,32,32H96A32,32,0,0,1,128,32Zm72,184H56V48H82.75A47.93,47.93,0,0,0,80,64v8a8,8,0,0,0,8,8h80a8,8,0,0,0,8-8V64a47.93,47.93,0,0,0-2.75-16H200Z\"></path></svg> Ctrl/⌘ + V 粘贴图片</span>\n            <span class=\"forge-feedback-count\">{{ sheet.pick.feedback.count }}</span>\n          </div>\n          <p class=\"forge-feedback-limit\">PNG、JPG、WebP、GIF · 单张不超过 10 MB</p>\n          <div class=\"forge-feedback-attachments\" aria-live=\"polite\">\n            <sc-for list=\"{{ sheet.pick.feedback.images }}\" as=\"img\" hint-placeholder-count=\"0\">\n              <div class=\"forge-feedback-attachment\">\n                <sc-if value=\"{{ img.ready }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ img.url }}\" alt=\"{{ img.name }}\" /></sc-if>\n                <sc-if value=\"{{ img.loading }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"forge-feedback-image-loading\"><svg class=\"forge-icon\" data-phosphor=\"image\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg></span></sc-if>\n                <div><strong title=\"{{ img.name }}\">{{ img.name }}</strong><span>{{ img.sizeLabel }}</span></div>\n                <button type=\"button\" sc-camel-on-click=\"{{ img.remove }}\" aria-label=\"{{ img.removeLabel }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button>\n              </div>\n            </sc-for>\n          </div>\n          <sc-if value=\"{{ sheet.pick.feedback.hasError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ sheet.pick.feedback.error }}</p></sc-if>\n          <div class=\"forge-feedback-submit-context\" id=\"forge-sheet-rework-hint\"><strong>提交后创建本轮修复任务</strong><span>{{ sheet.pick.noteHint }}</span></div>\n        </section></div></sc-if>\n<!-- sheet-feedback:end -->\n<div style=\"display:{{ sheet.pick.detailDisplay }}\">\n                <div class=\"forge-sheet-meta\" style=\"padding:18px 20px 16px;border-bottom:1px solid var(--forge-border)\">\n                  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap\">\n                    <div class=\"forge-sheet-meta-title\" style=\"font-size:17px;font-weight:600;letter-spacing:-0.01em\">{{ sheet.pick.name }}</div>\n                    <sc-if value=\"{{ sheet.pick.showState }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px;color:{{ sheet.pick.fg }};border:1px solid {{ sheet.pick.border }};border-radius:6px;padding:2px 10px\">{{ sheet.pick.state }}</div>\n                    </sc-if>\n                  </div>\n                  <sc-if value=\"{{ sheet.pick.hasLinkHistory }}\" hint-placeholder-val=\"{{ false }}\"><details class=\"forge-task-link-history\"><summary>关联记录</summary><sc-for list=\"{{ sheet.pick.linkHistory }}\" as=\"version\" hint-placeholder-count=\"0\"><div class=\"forge-task-link-history-entry\"><strong>{{ version.label }}</strong><span>{{ version.name }} · {{ version.sourceVersion }}</span><span>Item · {{ version.id }}</span><span>Run · {{ version.run }}</span></div></sc-for></details></sc-if>\n                  <div class=\"forge-sheet-field-grid\" style=\"display:grid;grid-template-columns:62px minmax(0,1fr);gap:7px 12px;align-items:baseline\">\n                    <sc-for list=\"{{ sheet.pick.fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n                      <div style=\"font-size:12px;color:var(--forge-muted);white-space:nowrap\">{{ f.k }}</div>\n                      <sc-if value=\"{{ f.link }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div class=\"forge-item-id-row\"><button type=\"button\" class=\"forge-item-id-link\" sc-camel-on-click=\"{{ f.go }}\" title=\"{{ f.v }}\"><span>{{ f.v }}</span><svg class=\"forge-icon\" data-phosphor=\"arrow-up-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z\"></path></svg></button><button type=\"button\" class=\"forge-task-link-edit\" title=\"更换关联任务\" aria-label=\"更换关联任务\" sc-camel-on-click=\"{{ sheet.pick.link.open }}\"><svg class=\"forge-icon\" data-phosphor=\"pencil-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z\"></path></svg></button></div>\n                      </sc-if>\n                      <sc-if value=\"{{ f.plain }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"font-size:13px;color:var(--forge-text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ f.v }}</div>\n                      </sc-if>\n                    </sc-for>\n                  </div>\n\n                  <!-- case-labels:start -->\n<div class=\"forge-case-section\">\n  <span class=\"forge-case-label\">样本标注</span>\n  <div class=\"forge-case-options\" role=\"group\" aria-label=\"样本标注\">\n    <sc-for list=\"{{ sheet.pick.sampleTabs }}\" as=\"s\" hint-placeholder-count=\"2\">\n      <button type=\"button\" class=\"forge-case-button\" data-case=\"{{ s.kind }}\" aria-pressed=\"{{ s.selected }}\" sc-camel-on-click=\"{{ s.pick }}\">\n        <span class=\"forge-case-icon\"><sc-if value=\"{{ s.good }}\" hint-placeholder-val=\"{{ true }}\"><svg class=\"forge-icon\" data-phosphor=\"check\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"></path></svg></sc-if><sc-if value=\"{{ s.bad }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></sc-if></span>\n        <span>{{ s.label }}</span>\n      </button>\n    </sc-for>\n  </div>\n  <p class=\"forge-case-help\">与审核结论相互独立 · 通过后仍可修改</p>\n</div>\n<!-- case-labels:end -->\n\n                  <sc-if value=\"{{ sheet.pick.hasBranches }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:13px;padding-top:12px;border-top:1px solid var(--forge-border)\">\n                    <div style=\"font-size:12px;color:var(--forge-muted);letter-spacing:.04em;margin-bottom:8px\">分支关系</div>\n                    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:2px\">\n                      <div style=\"font-size:13px;font-weight:600;color:var(--forge-text)\">{{ sheet.pick.name }}</div>\n                      <div style=\"font-size:12px;color:#3f6b45;border:1px solid #a7cfae;border-radius:6px;padding:1px 7px;white-space:nowrap\">主版本</div>\n                    </div>\n                    <sc-for list=\"{{ sheet.pick.branches }}\" as=\"b\" hint-placeholder-count=\"1\">\n                      <div style=\"position:relative;margin-left:4px;padding:6px 0 6px 18px;border-left:1px solid var(--forge-control-border)\">\n                        <div style=\"position:absolute;left:0;top:17px;width:12px;height:1px;background:var(--forge-control-border)\"></div>\n                        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                          <div style=\"font-size:13px;color:var(--forge-text)\">{{ b.name }}</div>\n                          <div style=\"font-size:12px;color:#8a5a16;border:1px solid #e0c48c;border-radius:6px;padding:1px 7px;white-space:nowrap\">{{ b.state }}</div>\n                        </div>\n                        <div style=\"margin-top:3px;font-size:12px;color:var(--forge-muted);line-height:1.5\">{{ b.meta }}</div>\n                        <div style=\"margin-top:4px;font-size:12px;color:var(--forge-text);line-height:1.6;overflow-wrap:anywhere\">{{ b.note }}</div>\n                      </div>\n                    </sc-for>\n                    <div style=\"margin-top:8px;font-size:12px;color:var(--forge-muted)\">分支与主版本共享同一个交付位 · 不额外计入目标数</div>\n                  </div>\n                  </sc-if>\n\n                  <sc-if value=\"{{ sheet.pick.hasVersionNodes }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:13px;padding-top:12px;border-top:1px solid var(--forge-border)\">\n                    <div style=\"font-size:12px;color:var(--forge-muted);letter-spacing:.04em;margin-bottom:8px\">版本关系</div>\n                    <div style=\"padding-left:5px\">\n                      <sc-for list=\"{{ sheet.pick.versionNodes }}\" as=\"v\" hint-placeholder-count=\"3\">\n                        <div style=\"position:relative;border-left:1px solid {{ v.line }};padding:0 0 8px 17px\">\n                          <div style=\"position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:{{ v.dot }};box-shadow:0 0 0 3px #fff\"></div>\n                          <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap\">\n                            <div style=\"font-size:13px;font-weight:600;color:var(--forge-text)\">{{ v.label }}</div>\n                            <div style=\"font-size:12px;color:{{ v.fg }};border:1px solid {{ v.border }};border-radius:6px;padding:1px 7px\">{{ v.badge }}</div>\n                          </div>\n                          <div style=\"margin-top:2px;font-size:12px;color:var(--forge-muted);line-height:1.45\">{{ v.meta }}</div>\n                        </div>\n                      </sc-for>\n                    </div>\n                  </div>\n                  </sc-if>\n                </div>\n\n                <!-- sheet-skill-session:start -->\n<sc-if value=\"{{ sheet.pick.skills.available }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"forge-review-skills\" aria-label=\"Skill 评估会话\">\n  <div class=\"forge-delivery-section-heading\"><h2>技能评估</h2><span>演示模式</span></div>\n  <sc-if value=\"{{ sheet.pick.skills.available }}\" hint-placeholder-val=\"{{ false }}\">\n    <p class=\"forge-delivery-help\">{{ sheet.pick.skills.count }} 个可用 Skill · 输入 / 或点击选择</p>\n    <div class=\"forge-review-skill-composer\"><input id=\"{{ sheet.pick.skills.inputId }}\" aria-label=\"Skill 调用命令\" value=\"{{ sheet.pick.skills.text }}\" sc-camel-on-change=\"{{ sheet.pick.skills.onText }}\" sc-camel-on-key-down=\"{{ sheet.pick.skills.onKey }}\" placeholder=\"/3d trajectory 检查模型轨迹\" maxlength=\"1000\" autocomplete=\"off\" /><button type=\"button\" class=\"forge-delivery-primary\" disabled=\"{{ sheet.pick.skills.disabled }}\" sc-camel-on-click=\"{{ sheet.pick.skills.invoke }}\">调用</button></div>\n    <div class=\"forge-review-skill-choices\"><sc-for list=\"{{ sheet.pick.skills.skills }}\" as=\"skill\" hint-placeholder-count=\"0\"><button type=\"button\" aria-pressed=\"{{ skill.selected }}\" sc-camel-on-click=\"{{ skill.pick }}\"><strong>{{ skill.command }}</strong><span>{{ skill.source }}</span></button></sc-for></div>\n    <sc-if value=\"{{ sheet.pick.skills.error }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ sheet.pick.skills.error }}</p></sc-if>\n    <p class=\"forge-delivery-help\">仅加载 Skill 和当前 Item / Run；未接入真实评估引擎。</p>\n  </sc-if>\n  <div class=\"forge-review-skill-history\" aria-live=\"polite\"><sc-for list=\"{{ sheet.pick.skills.history }}\" as=\"entry\" hint-placeholder-count=\"0\"><article><div class=\"forge-delivery-section-heading\"><strong>{{ entry.command }}</strong><time>{{ entry.at }}</time></div><p>已加载 Skill · 演示</p><p class=\"forge-delivery-help\">{{ entry.context }}</p><p class=\"forge-delivery-help\">附加要求：{{ entry.argsLabel }}</p><details><summary>查看本次加载的 Skill</summary><pre>{{ entry.content }}</pre></details><p class=\"forge-delivery-help\">未生成真实评分，正式审核结论未改变。</p></article></sc-for></div>\n</section>\n</sc-if>\n<!-- sheet-skill-session:end -->\n<div class=\"forge-sheet-history-heading\" style=\"position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:11px 20px 9px;background:#fff;border-bottom:1px solid var(--forge-border)\">\n                  <div style=\"font-size:12px;color:var(--forge-muted);letter-spacing:.04em;white-space:nowrap;flex:none\">审核记录</div>\n                  <div style=\"flex:1;min-width:8px\"></div>\n                  <div style=\"font-size:12px;color:var(--forge-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ sheet.pick.roundSummary }}</div>\n                </div>\n\n                <div class=\"forge-sheet-history\" style=\"padding:8px 20px 12px\">\n                  <sc-for list=\"{{ sheet.pick.rounds }}\" as=\"q\" hint-placeholder-count=\"2\">\n                    <div style=\"position:relative;border-left:1px solid {{ q.line }};padding:0 0 15px 20px\">\n                      <div style=\"position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:{{ q.dot }};box-shadow:0 0 0 3px #fff\"></div>\n                      <div style=\"display:flex;align-items:flex-start;gap:11px\">\n                        <div style=\"flex:1;min-width:0\">\n                          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                            <div style=\"font-size:13px;font-weight:600\">{{ q.title }}</div>\n                            <sc-if value=\"{{ q.showBadge }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;border-radius:6px;padding:1px 8px;border:1px solid {{ q.border }};color:{{ q.fg }};white-space:nowrap\">{{ q.badge }}</div></sc-if>\n                          </div>\n                          <div style=\"margin-top:5px;font-size:12px;color:var(--forge-muted);line-height:1.65\">{{ q.who }}</div>\n                          <button type=\"button\" sc-camel-on-click=\"{{ q.branch }}\" title=\"以这一轮的产物为起点，创建一条独立迭代的分支\" style=\"margin-top:7px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid var(--forge-border);background:#fff;border-radius:8px;font-size:12px;color:var(--forge-muted);cursor:pointer;white-space:nowrap\" style-hover=\"border-color:var(--forge-accent);color:var(--forge-accent)\"><svg class=\"forge-icon\" data-phosphor=\"git-branch\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M232,64a32,32,0,1,0-40,31v17a8,8,0,0,1-8,8H96a23.84,23.84,0,0,0-8,1.38V95a32,32,0,1,0-16,0v66a3 -appended-rounds:end -->\n                  \n                </div>\n\n                </div>\n\n                </div>\n                <!-- detail-footer:start -->\n<div class=\"forge-sheet-actions forge-feedback forge-detail-footer\" role=\"group\" aria-label=\"当前版本操作\">\n  <sc-if value=\"{{ sheet.pick.reworkFormClosed }}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-if value=\"{{ sheet.pick.approvedDetail }}\" hint-placeholder-val=\"{{ false }}\">\n      <button type=\"button\" class=\"forge-detail-action forge-detail-secondary\" disabled=\"{{ sheet.pick.cannotAppendRework }}\" title=\"{{ sheet.pick.appendHint }}\" sc-camel-on-click=\"{{ sheet.pick.appendRework }}\">追加返工</button>\n      <button type=\"button\" class=\"forge-detail-action forge-detail-download\" title=\"下载已通过版本\" aria-label=\"下载已通过版本\" sc-camel-on-click=\"{{ sheet.pick.download }}\"><svg class=\"forge-icon\" data-phosphor=\"download-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z\"></path></svg></button>\n    </sc-if>\n    <sc-if value=\"{{ sheet.pick.showHistoryAction }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"forge-detail-action\" sc-camel-on-click=\"{{ sheet.pick.openRun }}\">查看完整记录 <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></button></sc-if>\n    <sc-if value=\"{{ sheet.pick.needsReview }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\ \">确认通过这个 Item？</div>\n                      <div style=\"margin-top:8px;font-size:13px;color:var(--forge-muted);line-height:1.7\">通过后，该候选版本将成为当前可交付版本，并进入「{{ sheet.name }}」。审核结论提交后不可撤销。</div>\n                      <div style=\"margin-top:18px;border:1px solid #ece7df;background:var(--forge-subtle);border-radius:10px;padding:14px 15px;display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px 12px\">\n                        <sc-for list=\"{{ sheet.pick.passFields }}\" as=\"f\" hint-placeholder-count=\"5\">\n                          <div style=\"font-size:12px;color:var(--forge-muted)\">{{ f.k }}</div><div style=\"font-size:13px;color:var(--forge-text);overflow-wrap:anywhere\">{{ f.v }}</div>\n                        </sc-for>\n                      </div>\n                      <div style=\"margin-top:20px;display:flex;justify-content:flex-end;gap:9px\">\n                        <button sc-camel-on-click=\"{{ sheet.pick.cancelPass }}\" style=\"height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 18px;font-size:13px;color:var(--forge-muted);cursor:pointer\">返回检查</button>\n                        <button sc-camel-on-click=\"{{ sheet.pick.confirmPass }}\" style=\"height:38px;border:none;background:#4f7a52;color:#fff;border-radius:10px;padding:0 20px;font-size:13px;font-weight:600;cursor:pointer\">确认通过</button>\n                      </div>\n                    </div>\n                  </div>\n                </sc-if>\n\n\n              </div>\n            </sc-if>\n          </div>\n        </div>\n        </sc-if>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"forge-page\" style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"margin-bottom:20px\">\n        <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">概览</h1>\n        <div style=\"margin-top:7px;font-size:14px;color:var(--forge-muted)\">{{ over.subtitle }}</div>\n      </div>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:20px\">\n        <sc-for list=\"{{ over.stats }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ s.go }}\" style=\"border:1px solid var(--forge-border);background:#fff;border-radius:10px;padding:14px 16px;cursor:{{ s.cursor }}\" style-hover=\"border-color:#c1b8ab\">\n            <div style=\"display:flex;align-items:center;gap:7px\">\n              <div style=\"width:7px;height:7px;border-radius:2px;background:{{ s.accent }};flex:none\"></div>\n              <div style=\"font-size:12px;color:var(--forge-muted);white-space:nowrap\">{{ s.k }}</div>\n            </div>\n            <div style=\"margin-top:8px;display:flex;align-items:baseline;gap:4px\">\n              <div style=\"font-size:25px;font-weight:600;letter-spacing:-0.02em;color:{{ s.fg }};line-height:1\">{{ s.v }}</div>\n              <div style=\"font-size:12px;color:var(--forge-muted)\">{{ s.unit }}</div>\n            </div>\n            <div style=\"margin-top:7px;font-size:12px;color:var(--forge-muted)\">{{ s.note }}</div>\n          </div>\n        </sc-for>\n      </div>\n\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ over.groups }}\" as=\"g\" hint-placeholder-count=\"1\">\n          <div style=\"background:#fff;border:1px solid var(--forge-border);border-radius:14px;overflow:hidden\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--forge-border)\">\n              <div style=\"font-size:15px;font-weight:600\">{{ g.title }}</div>\n              <div style=\"font-size:12px;color:var(--forge-muted)\">{{ g.count }}</div>\n              <div style=\"flex:1\"></div>\n              <div sc-camel-on-click=\"{{ g.go }}\" style=\"font-size:13px;color:var(--forge-accent);cursor:pointer;white-space:nowrap\">{{ g.linkLabel }}</div>\n            </div>\n            <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ r.go }}\" style=\"display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid #f4f0ea;cursor:pointer\" style-hover=\"background:var(--forge-subtle)\">\n                <div style=\"width:6px;height:6px;border-radius:50%;background:{{ r.dot }};flex:none\"></div>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13px;color:var(--forge-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.title }}</div>\n                  <div style=\"margin-top:4px;font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.sub }}</div>\n                </div>\n                <div style=\"font-size:12px;color:{{ r.fg }};white-space:nowrap\">{{ r.right }}</div>\n              </div>\n            </sc-for>\n            <sc-if value=\"{{ g.empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:22px 16px;font-size:13px;color:var(--forge-muted);text-align:center\">{{ g.emptyLabel }}</div>\n            </sc-if>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isResources }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"forge-page\" style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">资源</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:var(--forge-muted)\">{{ res.subtitle }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <button style=\"height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 15px;font-size:13px;color:var(--forge-text);cursor:pointer\" style-hover=\"border-color:#c1b8ab\"><svg class=\"forge-icon\" data-phosphor=\"plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"></path></svg> 新建资源包</button>\n      </div>\n\n      <div style=\"background:#fff;border:1px solid var(--forge-border);border-radius:14px;padding:56px 24px;text-align:center\">\n        <div style=\"width:44px;height:44px;margin:0 auto 14px;border-radius:12px;border:1px solid var(--forge-border);background:#faf8f5;display:flex;align-items:center;justify-content:center\">\n          <svg class=\"forge-icon\" data-phosphor=\"list\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"color:#c1b8ab\"><path d=\"M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z\"></path></svg>\n        </div>\n        <div style=\"font-size:15px;font-weight:600;color:var(--forge-text)\">还没有资源</div>\n        <div style=\"margin-top:7px;font-size:13px;color:var(--forge-muted);line-height:1.7;max-width:360px;margin-left:auto;margin-right:auto;text-wrap:pretty\">这一页用于管理 webdev 的引用关系。字段确定后再填内容。</div>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isItemLife }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"forge-life-page\" style=\"max-width:1000px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 70px\">\n\n      <sc-if value=\"{{ life.isBranch }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ life.backToTrunk }}\" style=\"display:inline-block;font-size:13px;color:var(--forge-muted);margin-bottom:16px;cursor:pointer\" style-hover=\"color:var(--forge-text)\"><svg class=\"forge-icon\" data-phosphor=\"arrow-left\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z\"></path></svg> {{ life.trunkLink }}</div>\n      </sc-if>\n      <sc-if value=\"{{ life.notBranch }}\" hint-placeholder-val=\"{{ true }}\">\n        <div sc-camel-on-click=\"{{ life.back }}\" style=\"display:inline-block;font-size:13px;color:var(--forge-muted);margin-bottom:16px;cursor:pointer\" style-hover=\"color:var(--forge-text)\"><svg class=\"forge-icon\" data-phosphor=\"arrow-left\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z\"></path></svg> {{ life.backLabel }}</div>\n      </sc-if>\n\n      <div style=\"display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px\">\n        <div style=\"width:150px;height:104px;border-radius:10px;border:1px solid var(--forge-border);background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px);flex:none\"></div>\n        <div style=\"flex:1;min-width:240px\">\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">{{ life.name }}</h1>\n            <div style=\"font-size:12px;color:{{ life.fg }};border:1px solid {{ life.border }};border-radius:6px;padding:3px 10px\">{{ life.state }}</div>\n            \n            <sc-if value=\"{{ life.canExport }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ life.download }}\" aria-label=\"下载交付物\" title=\"下载交付物\" style=\"width:30px;height:30px;flex:none;border:1px solid #a7cfae;background:#fff;border-radius:8px;color:#3f6b45;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\" style-hover=\"background:#f2f7f2;border-color:#5f9a63\">\n                <svg class=\"forge-icon\" data-phosphor=\"download-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z\"></path></svg>\n              </button>\n            </sc-if>\n          </div>\n          <div style=\"margin-top:8px;font-size:14px;color:var(--forge-muted)\">{{ life.path }}</div><sc-if value=\"{{ life.hasLinkHistory }}\" hint-placeholder-val=\"{{ false }}\"><details class=\"forge-task-link-history\"><summary>关联记录</summary><sc-for list=\"{{ life.linkHistory }}\" as=\"version\" hint-placeholder-count=\"0\"><div class=\"forge-task-link-history-entry\"><strong>{{ version.label }}</strong><span>{{ version.name }} · {{ version.sourceVersion }}</span><span>Item · {{ version.id }}</span><span>Run · {{ version.run }}</span></div></sc-for></details></sc-if>\n          <div style=\"margin-top:6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n            <div class=\"forge-item-id-row\"><code title=\"{{ life.id }}\">{{ life.id }}</code><button type=\"button\" class=\"forge-task-link-edit\" title=\"更换关联任务\" aria-label=\"更换关联任务\" sc-camel-on-click=\"{{ life.link.open }}\"><svg class=\"forge-icon\" data-phosphor=\"pencil-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z\"></path></svg></button></div>\n            <sc-if value=\"{{ life.showBranchBadge }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" class=\"forge-life-branch-shortcut\" sc-camel-on-click=\"{{ life.jumpBranch }}\" title=\"点击定位到最近一条分支\">\n                <svg class=\"forge-icon\" data-phosphor=\"git-branch\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M232,64a32,32,0,1,0-40,31v17a8,8,0,0,1-8,8H96a23.84,23.84,0,0,0-8,1.38V95a32,32,0,1,0-16,0v66a32,32,0,1,0,16,0V144a8,8,0,0,1,8-8h88a24,24,0,0,0,24-24V95A32.06,32.06,0,0,0,232,64ZM64,64A16,16,0,1,1,80,80,16,16,0,0,1,64,64ZM96,192a16,16,0,1,1-16-16A16,16,0,0,1,96,192ZM200,80a16,16,0,1,1,16-16A16,16,0,0,1,200,80Z\"></path></svg>{{ life.branchLabel }}\n              </button>\n            </sc-if>\n          </div>\n        </div>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 22px;border:1px solid var(--forge-border);background:#fff;border-radius:10px;padding:12px 16px\">\n          <sc-for list=\"{{ life.stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:baseline;gap:8px;white-space:nowrap\">\n              <div style=\"font-size:12px;color:var(--forge-muted)\">{{ s.k }}</div>\n              <div style=\"font-size:14px;font-weight:600;color:{{ s.fg }}\">{{ s.v }}</div>\n            </div>\n          </sc-for>\n        </div>\n      </div>\n\n      <div class=\"forge-life-history\" style=\"background:#fff;border:1px solid var(--forge-border);border-radius:14px;padding:22px clamp(16px,2.4vw,26px)\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n          <div style=\"font-size:15px;font-weight:600\">完整记录</div>\n          <div style=\"flex:1\"></div>\n          <div sc-camel-on-click=\"{{ life.toggleAll }}\" style=\"font-size:13px;color:var(--forge-accent);cursor:pointer\">{{ life.toggleAllLabel }}</div>\n        </div>\n\n        <sc-for list=\"{{ life.nodes }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <div class=\"forge-life-node\" style=\"position:relative;border-left:1px solid var(--forge-control-border);padding:0 0 18px 26px\">\n            <div style=\"position:absolute;left:-6px;top:3px;width:11px;height:11px;border-radius:50%;background:{{ n.dot }};box-shadow:0 0 0 3px #fff\"></div>\n\n            <!-- history-node-header:start -->\n<div class=\"forge-life-node-header\">\n  <button type=\"button\" class=\"forge-life-node-toggle\" sc-camel-on-click=\"{{ n.toggle }}\" aria-expanded=\"{{ n.expanded }}\" aria-label=\"{{ n.expandLabel }}\">\n    <span class=\"forge-life-node-kind\">{{ n.kind }}</span><strong>{{ n.title }}</strong>\n    <span class=\"forge-life-node-badge\" style=\"color:{{ n.badgeFg }};border-color:{{ n.badgeBorder }}\">{{ n.badge }}</span>\n    <span class=\"forge-life-node-summary\">{{ n.summary }}</span>\n    <span class=\"forge-life-node-chevron\" data-expanded=\"{{ n.expanded }}\"><svg class=\"forge-icon\" data-phosphor=\"caret-down\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z\"></path></svg></span>\n  </button>\n  <sc-if value=\"{{ n.canFork }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" class=\"forge-life-append\" disabled=\"{{ n.appendDisabled }}\" title=\"{{ n.appendHint }}\" sc-camel-on-click=\"{{ n.append }}\">追加修改</button></sc-if>\n</div>\n<!-- history-node-header:end -->\n\n            <div class=\"forge-life-node-layout\" data-branches=\"{{ n.hasForks }}\" data-expanded=\"{{ n.expanded }}\">\n\n            <sc-if value=\"{{ n.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"forge-life-node-body\" style=\"flex:{{ n.bodyFlex }};min-width:280px;margin-top:13px;border:1px solid var(--forge-border);border-radius:10px;background:var(--forge-subtle);padding:15px 17px;display:flex;align-items:flex-start;gap:clamp(14px,2vw,22px);flex-wrap:wrap;align-self:flex-start\">\n                <sc-if value=\"{{ n.hasPreview }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex:1 1 330px;min-width:270px;max-width:430px\">\n                    <div sc-camel-on-click=\"{{ n.zoom }}\" title=\"点击放大查看\" style=\"position:relative;height:214px;border-radius:10px;border:1px solid var(--forge-border);background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px);display:flex;align-items:center;justify-content:center;cursor:zoom-in\" data-comment-anchor=\"fd8e3c8f5f-div\">\n                      <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-muted);background:rgba(255,255,255,.9);border:1px solid var(--forge-border);border-radius:6px;padding:6px 11px\">{{ n.previewCaption }}</div>\n                      <div style=\"position:absolute;bottom:9px;right:9px;height:24px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid var(--forge-control-border);color:var(--forge-muted);font-size:12px;display:flex;align-items:center;gap:5px\">\n                        <svg class=\"forge-icon\" data-phosphor=\"arrows-out-simple\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,48V96a8,8,0,0,1-16,0V67.31l-50.34,50.35a8,8,0,0,1-11.32-11.32L188.69,56H160a8,8,0,0,1,0-16h48A8,8,0,0,1,216,48ZM106.34,138.34,56,188.69V160a8,8,0,0,0-16,0v48a8,8,0,0,0,8,8H96a8,8,0,0,0,0-16H67.31l50.35-50.34a8,8,0,0,0-11.32-11.32Z\"></path></svg>放大\n                      </div>\n                    </div>\n                    <div style=\"margin-top:8px;display:flex;align-items:center;gap:9px\">\n                      <div style=\"flex:1;min-width:0;font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.previewNote }}</div>\n                      <a href=\"{{ n.previewUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"flex:none;font-size:13px;color:var(--forge-accent);white-space:nowrap;text-decoration:none\" style-hover=\"color:var(--forge-accent-hover)\" data-comment-anchor=\"4e8afca14a-a\">新标签打开 <svg class=\"forge-icon\" data-phosphor=\"arrow-up-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z\"></path></svg></a>\n                    </div>\n                  </div>\n                </sc-if>\n                <div style=\"flex:1 1 300px;min-width:260px\">\n                  <div style=\"font-size:12px;color:var(--forge-muted);margin-bottom:6px\">{{ n.bodyLabel }}</div>\n                  <div style=\"font-size:14px;color:var(--forge-text);line-height:1.75;text-wrap:pretty\">{{ n.body }}</div>\n                  <div style=\"margin-top:14px;padding-top:13px;border-top:1px solid var(--forge-border);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px 16px\">\n                    <sc-for list=\"{{ n.meta }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <div style=\"min-width:0\">\n                        <div style=\"font-size:12px;color:var(--forge-muted)\">{{ m.k }}</div>\n                        <div style=\"margin-top:3px;font-size:13px;color:var(--forge-text);overflow-wrap:anywhere\">{{ m.v }}</div>\n                      </div>\n                    </sc-for>\n                  </div>\n\n                  <sc-if value=\"{{ n.canReroll }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:14px;border:1px solid #eabaa8;background:#fdf5f2;border-radius:10px;padding:12px 13px\">\n                      <div style=\"font-size:13px;font-weight:600;color:var(--forge-accent-hover)\">{{ n.rerollTitle }}</div>\n                      <div style=\"margin-top:5px;font-size:12px;color:var(--forge-muted);line-height:1.6;text-wrap:pretty\">{{ n.rerollWhy }}</div>\n                      <div style=\"margin-top:11px;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                        <button sc-camel-on-click=\"{{ n.reroll }}\" style=\"height:32px;border:none;background:var(--forge-accent);color:#fff;border-radius:8px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px\" style-hover=\"background:var(--forge-accent-hover)\">\n                          <svg class=\"forge-icon\" data-phosphor=\"arrow-clockwise\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A95.44,95.44,0,0,1,128,224h-1.32A96,96,0,1,1,195.75,60L224,85.8V56a8,8,0,1,1,16,0Z\"></path></svg>Reroll\n                        </button>\n                        <div sc-camel-on-click=\"{{ n.openRun }}\" style=\"font-size:12px;color:var(--forge-muted);cursor:pointer;white-space:nowrap\" style-hover=\"color:var(--forge-text)\">查看运行详情</div>\n                      </div>\n                    </div>\n                  </sc-if>\n\n                  \n                </div>\n              </div>\n            </sc-if>\n\n            <!-- history-branch-tree:start -->\n<sc-if value=\"{{ n.hasForks }}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"forge-branch-tree\" aria-label=\"{{ n.forkGroupLabel }}\">\n    <div class=\"forge-branch-tree-heading\"><svg class=\"forge-icon\" data-phosphor=\"git-branch\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M232,64a32,32,0,1,0-40,31v17a8,8,0,0,1-8,8H96a23.84,23.84,0,0,0-8,1.38V95a32,32,0,1,0-16,0v66a32,32,0,1,0,16,0V144a8,8,0,0,1,8-8h88a24,24,0,0,0,24-24V95A32.06,32.06,0,0,0,232,64ZM64,64A16,16,0,1,1,80,80,16,16,0,0,1,64,64ZM96,192a16,16,0,1,1-16-16A16,16,0,0,1,96,192ZM200,80a16,16,0,1,1,16-16A16,16,0,0,1,200,80Z\"></path></svg><span>{{ n.forkGroupLabel }}</span></div>\n    <ol class=\"forge-branch-tree-list\" aria-label=\"分支修改树\">\n      <sc-for list=\"{{ n.tree }}\" as=\"node\" hint-placeholder-count=\"0\">\n        <li class=\"forge-branch-tree-node\" data-branch-card=\"{{ node.cardKey }}\" style=\"--tree-depth:{{ node.visualDepth }}\" data-last=\"{{ node.last }}\" data-children=\"{{ node.hasChildren }}\">\n          <div class=\"forge-branch-tree-guides\" aria-hidden=\"true\"><sc-for list=\"{{ node.guides }}\" as=\"guide\" hint-placeholder-count=\"0\"><i style=\"--guide-depth:{{ guide.depth }}\"></i></sc-for></div>\n          <span class=\"forge-branch-tree-elbow\" aria-hidden=\"true\"></span>\n          <div class=\"forge-branch-tree-content\">\n            <div class=\"forge-branch-tree-row\">\n              <button type=\"button\" class=\"forge-branch-tree-toggle\" aria-label=\"{{ node.toggleLabel }}\" aria-expanded=\"{{ node.expanded }}\" aria-controls=\"{{ node.detailsId }}\" sc-camel-on-click=\"{{ node.toggle }}\"><span class=\"forge-life-node-chevron\" data-expanded=\"{{ node.expanded }}\"><svg class=\"forge-icon\" data-phosphor=\"caret-down\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z\"></path></svg></span><strong>{{ node.name }}</strong></button>\n              <span class=\"forge-branch-tree-status\" style=\"color:{{ node.stateFg }};border-color:{{ node.stateBorder }}\"><i style=\"background:{{ node.stateDot }}\"></i>{{ node.stateLabel }}</span>\n              <span class=\"forge-branch-tree-time\">{{ node.created }}</span>\n            </div>\n            <p class=\"forge-branch-tree-origin\">{{ node.origin }}</p>\n            <p class=\"forge-branch-tree-note\">{{ node.description }}</p>\n            <sc-if value=\"{{ node.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"forge-branch-tree-detail\" id=\"{{ node.detailsId }}\">\n                <div class=\"forge-branch-tree-preview\">\n                  <sc-if value=\"{{ node.hasPreviewImage }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ node.previewImage }}\" alt=\"{{ node.name }} · 分支产物预览\" /></sc-if>\n                  <sc-if value=\"{{ node.noPreviewImage }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ node.previewLabel }}</span></sc-if>\n                </div>\n                <ol class=\"forge-branch-tree-stages\" aria-label=\"分支进度\"><sc-for list=\"{{ node.steps }}\" as=\"step\" hint-placeholder-count=\"3\"><li><span data-active=\"{{ step.active }}\" data-complete=\"{{ step.complete }}\" style=\"--step-color:{{ step.fg }}\"><i aria-hidden=\"true\"></i>{{ step.label }}</span><sc-if value=\"{{ step.hasNext }}\" hint-placeholder-val=\"{{ true }}\"><svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></sc-if></li></sc-for></ol>\n                <dl><dt>发起位置</dt><dd>{{ node.sourceWhere }}</dd><dt>源产物</dt><dd>{{ node.sourceVersion }}</dd><dt>源审核结论</dt><dd>{{ node.sourceVerdict }}</dd><dt>创建人</dt><dd>{{ node.creator }}</dd><dt>创建时间</dt><dd>{{ node.createdAt }}</dd><dt>分支 Item</dt><dd><button type=\"button\" class=\"forge-branch-tree-id\" sc-camel-on-click=\"{{ node.openRecord }}\">{{ node.branchItemId }}</button></dd><dt>运行配置</dt><dd>{{ node.configuration }}</dd></dl>\n                <sc-if value=\"{{ node.hasAttachments }}\" hint-placeholder-val=\"{{ false }}\"><ul class=\"forge-branch-tree-images\" aria-label=\"修改参考图片\"><sc-for list=\"{{ node.attachments }}\" as=\"img\" hint-placeholder-count=\"0\"><li><img src=\"{{ img.url }}\" alt=\"{{ img.name }}\" /><span>{{ img.name }}</span></li></sc-for></ul></sc-if>\n                <p class=\"forge-branch-tree-footnote\">独立运行 · 不占用主线轮次 · 通过审核后可关联交付 Item</p>\n              </div>\n            </sc-if>\n            <div class=\"forge-branch-tree-actions\">\n              <button type=\"button\" class=\"forge-life-append\" title=\"{{ node.appendHint }}\" disabled=\"{{ node.appendDisabled }}\" sc-camel-on-click=\"{{ node.append }}\">追加修改</button>\n              <sc-if value=\"{{ node.canOpenRun }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ node.openRun }}\" title=\"{{ node.runId }}\">查看运行 <svg class=\"forge-icon\" data-phosphor=\"arrow-up-right\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z\"></path></svg></button></sc-if>\n              <sc-if value=\"{{ node.canLink }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ node.link }}\">关联任务</button></sc-if>\n              <span class=\"forge-branch-tree-action-spacer\"></span>\n              <button type=\"button\" class=\"forge-branch-tree-icon-action\" aria-label=\"查看分支完整记录\" title=\"查看分支完整记录\" sc-camel-on-click=\"{{ node.openRecord }}\"><svg class=\"forge-icon\" data-phosphor=\"git-branch\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M232,64a32,32,0,1,0-40,31v17a8,8,0,0,1-8,8H96a23.84,23.84,0,0,0-8,1.38V95a32,32,0,1,0-16,0v66a32,32,0,1,0,16,0V144a8,8,0,0,1,8-8h88a24,24,0,0,0,24-24V95A32.06,32.06,0,0,0,232,64ZM64,64A16,16,0,1,1,80,80,16,16,0,0,1,64,64ZM96,192a16,16,0,1,1-16-16A16,16,0,0,1,96,192ZM200,80a16,16,0,1,1,16-16A16,16,0,0,1,200,80Z\"></path></svg></button>\n              <button type=\"button\" class=\"forge-branch-tree-icon-action forge-branch-tree-remove\" aria-label=\"移除分支记录\" title=\"移除分支记录\" sc-camel-on-click=\"{{ node.askDiscard }}\"><svg class=\"forge-icon\" data-phosphor=\"trash\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z\"></path></svg></button>\n            </div>\n            <sc-if value=\"{{ node.discardAsking }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"forge-branch-tree-confirm\" role=\"group\" aria-label=\"确认移除分支记录\"><p>移除此分支及其后续修改的树状记录？原运行和主线保留。</p><div class=\"forge-branch-tree-actions\"><button type=\"button\" sc-camel-on-click=\"{{ node.cancelDiscard }}\">取消</button><button type=\"button\" class=\"forge-branch-tree-remove\" sc-camel-on-click=\"{{ node.discard }}\">确认移除</button></div></div></sc-if>\n          </div>\n        </li>\n      </sc-for>\n    </ol>\n  </section>\n</sc-if>\n<!-- history-branch-tree:end -->\n\n            </div>\n          </div>\n        </sc-for>\n\n        <sc-if value=\"{{ life.canAppend }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:relative;border-left:1px dashed var(--forge-control-border);padding:0 0 4px 26px\">\n            <div style=\"position:absolute;left:-6px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px dashed #c1b8ab;box-sizing:border-box\"></div>\n            <sc-if value=\"{{ life.appendClosed }}\" hint-placeholder-val=\"{{ true }}\">\n              <div sc-camel-on-click=\"{{ life.openAppend }}\" style=\"display:inline-flex;align-items:center;gap:9px;border:1px dashed #d3cabd;background:#fff;border-radius:10px;padding:9px 15px;font-size:13px;color:var(--forge-muted);cursor:pointer\" style-hover=\"border-color:var(--forge-accent);color:var(--forge-accent)\">\n                <span style=\"font-size:15px;line-height:1\"><svg class=\"forge-icon\" data-phosphor=\"plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"></path></svg></span>追加一次修复\n                <span style=\"font-size:12px;color:var(--forge-muted)\">{{ life.quota }}</span>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{ life.appendOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px solid var(--forge-border);border-radius:10px;background:var(--forge-subtle);padding:15px 17px\">\n                <div style=\"font-size:14px;font-weight:600;margin-bottom:3px\">追加一次修复</div>\n                <div style=\"font-size:13px;color:var(--forge-muted);margin-bottom:11px\">以当前最终产物为起点发起新一轮返工，{{ life.quota }}。</div>\n                <textarea sc-camel-on-change=\"{{ life.onText }}\" value=\"{{ life.text }}\" placeholder=\"说明这次需要修改什么：保留什么、改什么、验收标准。\" style=\"width:100%;min-height:96px;resize:vertical;border:1px solid var(--forge-control-border);border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.6;background:#fff;color:var(--forge-text)\"></textarea>\n\n                <div style=\"margin-top:12px;border:1px solid #ece7df;border-radius:10px;padding:13px;background:#fff\">\n                  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap\">\n                    <div style=\"font-size:13px;color:var(--forge-muted)\">参考图片</div>\n                    <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-muted)\">{{ life.imgCount }}</div>\n                    <div style=\"flex:1\"></div>\n                    <div style=\"font-size:12px;color:var(--forge-muted)\">支持 PNG / JPEG / WebP，可粘贴</div>\n                  </div>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n                    <sc-for list=\"{{ life.images }}\" as=\"img\" hint-placeholder-count=\"0\">\n                      <div style=\"position:relative;width:66px;height:66px;border-radius:10px;border:1px solid var(--forge-border);background-color:#f4f1ec;background-image:repeating-linear-gradient(135deg,#eae5dc 0 6px,#f4f1ec 6px 12px)\">\n                        <div sc-camel-on-click=\"{{ img.remove }}\" style=\"position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--forge-control-border);color:var(--forge-muted);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px rgba(34,31,28,.12)\" aria-label=\"移除参考图\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></div>\n                      </div>\n                    </sc-for>\n                    <sc-if value=\"{{ life.canAddImage }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div sc-camel-on-click=\"{{ life.addImage }}\" style=\"width:66px;height:66px;border-radius:8px;border:1px dashed #d3cabd;background:var(--forge-subtle);color:var(--forge-muted);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer\" style-hover=\"border-color:var(--forge-accent);color:var(--forge-accent)\" aria-label=\"添加参考图\"><svg class=\"forge-icon\" data-phosphor=\"plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"></path></svg></div>\n                    </sc-if>\n                  </div>\n                </div>\n\n                <div style=\"display:flex;align-items:center;gap:11px;margin-top:12px;flex-wrap:wrap\">\n                  <div style=\"flex:1;min-width:140px;font-size:13px;color:var(--forge-muted)\">{{ life.appendHint }}</div>\n                  <button sc-camel-on-click=\"{{ life.cancelAppend }}\" style=\"height:38px;border:1px solid var(--forge-control-border);background:#fff;border-radius:10px;padding:0 16px;font-size:13px;color:var(--forge-muted);cursor:pointer\">取消</button>\n                  <sc-if value=\"{{ life.canSubmit }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ life.submitAppend }}\" style=\"height:38px;border:none;background:var(--forge-accent);color:#fff;border-radius:10px;padding:0 18px;font-size:13px;font-weight:600;cursor:pointer\">提交并发起返工</button>\n                  </sc-if>\n                  <sc-if value=\"{{ life.cannotSubmit }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button style=\"height:38px;border:1px solid var(--forge-border);background:#f4f1ec;color:#b3aca3;border-radius:10px;padding:0 18px;font-size:13px;font-weight:600;cursor:not-allowed\">提交并发起返工</button>\n                  </sc-if>\n                </div>\n              </div>\n            </sc-if>\n          </div>\n        </sc-if>\n\n        <div style=\"positi 62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg>\n          <strong>{{ it.workbenchPreviewTitle }}</strong>\n          <p>{{ it.workbenchPreviewHint }}</p>\n          <button sc-camel-on-click=\"{{ it.previewFiles }}\">查看产物文件 <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></button>\n        </div>\n      </sc-if>\n    </sc-if>\n    <sc-if value=\"{{ it.showFiles }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"review-workbench-files\">\n        <div class=\"review-workbench-section-heading\"><h2>产物文件</h2><button sc-camel-on-click=\"{{ it.returnPreview }}\">返回预览 <svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button></div>\n        <sc-for list=\"{{ it.files }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div class=\"review-workbench-file\"><span>{{ f.name }}</span><span>{{ f.size }}</span></div>\n        </sc-for>\n      </div>\n    </sc-if>\n  </section>\n  <aside class=\"review-workbench-panel\" aria-label=\"审核信息与操作\">\n    <div class=\"review-workbench-scroll\">\n      <sc-if value=\"{{ it.notNeedsNote }}\" hint-placeholder-val=\"{{ true }}\">\n      <section class=\"review-workbench-object\">\n        <h2>审核对象</h2>\n        <dl class=\"review-workbench-metadata\">\n          <dt>资产名称</dt><dd>{{ it.shortName }}</dd>\n          <dt>Item ID</dt><dd><div class=\"forge-item-id-row\"><button type=\"button\" class=\"review-workbench-item-link forge-item-id-link\" sc-camel-on-click=\"{{ it.openLife }}\" title=\"{{ it.id }}\"><span>{{ it.id }}</span><svg class=\"forge-icon\" data-phosphor=\"arrow-up-right\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,64V168a8,8,0,0,1-16,0V83.31L69.66,197.66a8,8,0,0,1-11.32-11.32L172.69,72H88a8,8,0,0,1,0-16H192A8,8,0,0,1,200,64Z\"></path></svg></button><button type=\"button\" class=\"forge-task-link-edit\" title=\"更换关联任务\" aria-label=\"更换关联任务\" sc-camel-on-click=\"{{ it.link.open }}\"><svg class=\"forge-icon\" data-phosphor=\"pencil-simple\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z\"></path></svg></button></div></dd>\n          <dt>资产类型</dt><dd>{{ it.assetType }}</dd>\n          <dt>文件格式</dt><dd>{{ it.fileFormat }}</dd>\n          <dt>生成时间</dt><dd>{{ it.generatedAt }}</dd>\n          <dt>提交人</dt><dd>{{ it.submitter }}</dd>\n        </dl>\n        <div class=\"review-workbench-case\">\n          <span>案例标记</span>\n          <div class=\"review-workbench-case-options forge-case-options\" role=\"group\" aria-label=\"案例标记\">\n            <button type=\"button\" class=\"review-workbench-good forge-case-button\" data-case=\"good\" data-selected=\"{{ it.goodCase }}\" aria-pressed=\"{{ it.goodCase }}\" sc-camel-on-click=\"{{ it.markGood }}\"><span class=\"forge-case-icon\"><svg class=\"forge-icon\" data-phosphor=\"check\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"></path></svg></span><span>Good Case</span></button>\n            <button type=\"button\" class=\"review-workbench-bad forge-case-button\" data-case=\"bad\" data-selected=\"{{ it.badCase }}\" aria-pressed=\"{{ it.badCase }}\" sc-camel-on-click=\"{{ it.markBad }}\"><span class=\"forge-case-icon\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></span><span>Bad Case</span></button>\n            <p>仅用于案例沉淀，不影响审核结论。</p>\n          </div>\n        </div>\n      </section>\n      <section class=\"review-workbench-references\">\n        <div class=\"review-workbench-section-heading\"><h2>参考依据</h2><span class=\"review-workbench-ref-count\" data-available=\"{{ it.hasReferences }}\">{{ it.referenceCount }}</span></div>\n        <div class=\"review-workbench-thumbnails\">\n          <sc-for list=\"{{ it.referenceSlots }}\" as=\"ref\" hint-placeholder-count=\"4\">\n            <sc-if value=\"{{ ref.available }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ ref.url }}\" target=\"_blank\" rel=\"noopener\" title=\"{{ ref.name }}\"><img src=\"{{ ref.url }}\" alt=\"{{ ref.name }}\" /></a></sc-if>\n            <sc-if value=\"{{ ref.empty }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"review-workbench-thumbnail-empty\" aria-label=\"未提供参考图\"><svg class=\"forge-icon\" data-phosphor=\"image\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg></div></sc-if>\n          </sc-for>\n        </div>\n        <p class=\"review-workbench-source\">{{ it.referenceSource }}</p>\n      </section>\n<!-- review-skill-session:start -->\n<sc-if value=\"{{ it.skills.available }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"forge-review-skills\" aria-label=\"Skill 评估会话\">\n  <div class=\"forge-delivery-section-heading\"><h2>技能评估</h2><span>演示模式</span></div>\n  <sc-if value=\"{{ it.skills.available }}\" hint-placeholder-val=\"{{ false }}\">\n    <p class=\"forge-delivery-help\">{{ it.skills.count }} 个可用 Skill · 输入 / 或点击选择</p>\n    <div class=\"forge-review-skill-composer\"><input id=\"{{ it.skills.inputId }}\" aria-label=\"Skill 调用命令\" value=\"{{ it.skills.text }}\" sc-camel-on-change=\"{{ it.skills.onText }}\" sc-camel-on-key-down=\"{{ it.skills.onKey }}\" placeholder=\"/3d trajectory 检查模型轨迹\" maxlength=\"1000\" autocomplete=\"off\" /><button type=\"button\" class=\"forge-delivery-primary\" disabled=\"{{ it.skills.disabled }}\" sc-camel-on-click=\"{{ it.skills.invoke }}\">调用</button></div>\n    <div class=\"forge-review-skill-choices\"><sc-for list=\"{{ it.skills.skills }}\" as=\"skill\" hint-placeholder-count=\"0\"><button type=\"button\" aria-pressed=\"{{ skill.selected }}\" sc-camel-on-click=\"{{ skill.pick }}\"><strong>{{ skill.command }}</strong><span>{{ skill.source }}</span></button></sc-for></div>\n    <sc-if value=\"{{ it.skills.error }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ it.skills.error }}</p></sc-if>\n    <p class=\"forge-delivery-help\">仅加载 Skill 和当前 Item / Run；未接入真实评估引擎。</p>\n  </sc-if>\n  <div class=\"forge-review-skill-history\" aria-live=\"polite\"><sc-for list=\"{{ it.skills.history }}\" as=\"entry\" hint-placeholder-count=\"0\"><article><div class=\"forge-delivery-section-heading\"><strong>{{ entry.command }}</strong><time>{{ entry.at }}</time></div><p>已加载 Skill · 演示</p><p class=\"forge-delivery-help\">{{ entry.context }}</p><p class=\"forge-delivery-help\">附加要求：{{ entry.argsLabel }}</p><details><summary>查看本次加载的 Skill</summary><pre>{{ entry.content }}</pre></details><p class=\"forge-delivery-help\">未生成真实评分，正式审核结论未改变。</p></article></sc-for></div>\n</section>\n</sc-if>\n<!-- review-skill-session:end -->\n      <section class=\"review-workbench-history\">\n        <div class=\"review-workbench-section-heading\"><h2>审核记录</h2><button sc-camel-on-click=\"{{ it.openLife }}\">查看全部记录 <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></button></div>\n        <div class=\"review-workbench-timeline\">\n          <div class=\"review-workbench-event\">\n            <div class=\"review-workbench-event-heading\"><time>{{ it.submittedWhen }}</time><span class=\"review-workbench-avatar\" style=\"background:{{ it.authorBg }}\">{{ it.authorInitial }}</span><span>{{ it.submitter }} <span class=\"review-workbench-event-description\">· 提交了 {{ it.artifactVersion }}</span></span></div>\n            <dl class=\"review-workbench-submission\">\n              <dt>Pipeline</dt><dd>{{ it.pipelineLabel }}</dd>\n              <dt>上轮 Prompt</dt><dd class=\"review-workbench-prompt\" title=\"{{ it.promptText }}\">{{ it.promptText }}</dd>\n              <dt>产物</dt><dd><button sc-camel-on-click=\"{{ it.previewFiles }}\">{{ it.artifactSummary }}</button></dd>\n            </dl>\n          </div>\n          <div class=\"review-workbench-event\">\n            <div class=\"review-workbench-event-heading\"><time>待审核</time><span class=\"review-workbench-avatar review-workbench-reviewer\">{{ it.reviewerInitial }}</span><span>Reviewer: {{ it.reviewer }}</span></div>\n            <p class=\"review-workbench-round\">{{ it.round }}</p>\n          </div>\n        </div>\n      </section>\n      </sc-if>\n      <sc-if value=\"{{ it.needsNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <section class=\"review-workbench-rework-form forge-feedback\">\n          <h2 class=\"forge-feedback-title\">要求返工</h2>\n          <p class=\"forge-feedback-context\">{{ it.shortName }} · {{ it.artifactVersion }}<br>{{ it.round }}</p>\n          <div class=\"forge-feedback-field\">\n            <label for=\"forge-rework-note\">返工说明 <span class=\"forge-feedback-required\">*</span></label>\n            <textarea id=\"forge-rework-note\" aria-label=\"返工说明\" aria-required=\"true\" required maxlength=\"5000\" sc-camel-on-change=\"{{ it.onNote }}\" value=\"{{ it.noteText }}\" placeholder=\"说明这一轮要改什么：保留什么、改什么、验收标准。\" aria-describedby=\"forge-rework-hint\"></textarea>\n          </div>\n          <div class=\"forge-feedback-upload-row\">\n            <label class=\"forge-feedback-upload\" data-disabled=\"{{ it.feedback.full }}\"><svg class=\"forge-icon\" data-phosphor=\"paperclip\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M209.66,122.34a8,8,0,0,1,0,11.32l-82.05,82a56,56,0,0,1-79.2-79.21L147.67,35.73a40,40,0,1,1,56.61,56.55L105,193A24,24,0,1,1,71,159L154.3,74.38A8,8,0,1,1,165.7,85.6L82.39,170.31a8,8,0,1,0,11.27,11.36L192.93,81A24,24,0,1,0,159,47L59.76,147.68a40,40,0,1,0,56.53,56.62l82.06-82A8,8,0,0,1,209.66,122.34Z\"></path></svg><span>上传图片</span><input type=\"file\" accept=\"image/png,image/jpeg,image/webp,image/gif\" multiple disabled=\"{{ it.feedback.full }}\" aria-label=\"上传返工参考图片\" sc-camel-on-change=\"{{ it.feedback.upload }}\" /></label>\n            <span class=\"forge-feedback-paste\"><svg class=\"forge-icon\" data-phosphor=\"clipboard\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M200,32H163.74a47.92,47.92,0,0,0-71.48,0H56A16,16,0,0,0,40,48V216a16,16,0,0,0,16,16H200a16,16,0,0,0,16-16V48A16,16,0,0,0,200,32Zm-72,0a32,32,0,0,1,32,32H96A32,32,0,0,1,128,32Zm72,184H56V48H82.75A47.93,47.93,0,0,0,80,64v8a8,8,0,0,0,8,8h80a8,8,0,0,0,8-8V64a47.93,47.93,0,0,0-2.75-16H200Z\"></path></svg> Ctrl/⌘ + V 粘贴图片</span>\n            <span class=\"forge-feedback-count\">{{ it.feedback.count }}</span>\n          </div>\n          <p class=\"forge-feedback-limit\">PNG、JPG、WebP、GIF · 单张不超过 10 MB</p>\n          <div class=\"forge-feedback-attachments\" aria-live=\"polite\">\n            <sc-for list=\"{{ it.feedback.images }}\" as=\"img\" hint-placeholder-count=\"0\">\n              <div class=\"forge-feedback-attachment\">\n                <sc-if value=\"{{ img.ready }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ img.url }}\" alt=\"{{ img.name }}\" /></sc-if>\n                <sc-if value=\"{{ img.loading }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"forge-feedback-image-loading\"><svg class=\"forge-icon\" data-phosphor=\"image\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z\"></path></svg></span></sc-if>\n                <div><strong title=\"{{ img.name }}\">{{ img.name }}</strong><span>{{ img.sizeLabel }}</span></div>\n                <button type=\"button\" sc-camel-on-click=\"{{ img.remove }}\" aria-label=\"{{ img.removeLabel }}\"><svg class=\"forge-icon\" data-phosphor=\"x\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z\"></path></svg></button>\n              </div>\n            </sc-for>\n          </div>\n          <sc-if value=\"{{ it.feedback.hasError }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"forge-feedback-error\" role=\"alert\">{{ it.feedback.error }}</p></sc-if>\n          <div class=\"forge-feedback-submit-context\" id=\"forge-rework-hint\"><strong>提交后创建本轮修复任务</strong><span>{{ it.noteHint }}</span></div>\n        </section>\n      </sc-if>\n    </div>\n    <footer class=\"review-workbench-actions\">\n      <sc-if value=\"{{ it.pending }}\" hint-placeholder-val=\"{{ true }}\">\n        <button class=\"review-workbench-approve\" sc-camel-on-click=\"{{ it.pass }}\">通过审核 <kbd>A</kbd></button>\n        <button class=\"review-workbench-reject\" sc-camel-on-click=\"{{ it.rework }}\">要求返工 <kbd>R</kbd></button>\n      </sc-if>\n      <sc-if value=\"{{ it.needsNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <button class=\"review-workbench-approve\" sc-camel-on-click=\"{{ it.cancelNote }}\">取消返工</button>\n        <button class=\"review-workbench-reject\" sc-camel-on-click=\"{{ it.submitNote }}\" disabled=\"{{ it.cannotSubmitNote }}\">提交返工</button>\n      </sc-if>\n      <sc-if value=\"{{ it.needsReroll }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"review-workbench-reject review-workbench-action-wide\" sc-camel-on-click=\"{{ it.reroll }}\">前往生产配置 Reroll <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></button></sc-if>\n      <sc-if value=\"{{ it.rerolled }}\" hint-placeholder-val=\"{{ false }}\"><p>已发起 Reroll，运行完成后可继续审核。</p></sc-if>\n    </footer>\n  </aside>\n</div>\n<!-- review-workbench:end -->\n            </sc-if>\n          </div>\n        </sc-for>\n      </div>\n      </sc-if>\n\n      <sc-if value=\"{{ review.empty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid var(--forge-border);background:#fff;border-radius:14px;padding:56px 24px;text-align:center\">\n          <div style=\"width:44px;height:44px;margin:0 auto 14px;border-radius:12px;border:1px solid #a7cfae;background:#f2f7f2;display:flex;align-items:center;justify-content:center\">\n            <svg class=\"forge-icon\" data-phosphor=\"check\" width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"color:#4f7a52\"><path d=\"M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z\"></path></svg>\n          </div>\n          <div style=\"font-size:15px;font-weight:600;color:var(--forge-text)\">{{ review.emptyTitle }}</div>\n          <div style=\"margin-top:7px;font-size:13px;color:var(--forge-muted);line-height:1.7;max-width:340px;margin-left:auto;margin-right:auto;text-wrap:pretty\">{{ review.emptyHint }}</div>\n          <div sc-camel-on-click=\"{{ review.emptyGo }}\" style=\"margin-top:15px;display:inline-block;font-size:13px;color:var(--forge-accent);cursor:pointer\">{{ review.emptyCta }}<sc-if value=\"{{ review.emptyCtaForward }}\" hint-placeholder-val=\"{{ false }}\"> <svg class=\"forge-icon\" data-phosphor=\"arrow-right\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z\"></path></svg></sc-if></div>\n        </div>\n      </sc-if>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ isRuns }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"forge-page\" style=\"max-width:1240px;margin:0 auto;padding:26px clamp(16px,2.2vw,28px) 60px\">\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px\">\n        <div>\n          <h1 style=\"margin:0;font-size:25px;font-weight:600;letter-spacing:-0.02em\">运行记录</h1>\n          <div style=\"margin-top:7px;font-size:14px;color:var(--forge-muted)\">{{ runs.subtitle }}</div>\n        </div>\n        <div style=\"flex:1\"></div>\n        <button sc-camel-on-click=\"{{ goPipelines }}\" style=\"height:38px;border:none;background:var(--forge-accent);color:#fff;border-radius:10px;padding:0 17px;font-size:14px;font-weight:600;cursor:pointer\" style-hover=\"background:var(--forge-accent-hover)\"><svg class=\"forge-icon\" data-phosphor=\"plus\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z\"></path></svg> 新建运行</button>\n      </div>\n\n      <sc-if value=\"{{ runs.hasAny }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap\">\n        <div style=\"display:flex;gap:2px;background:var(--forge-border);border-radius:10px;padding:3px\">\n          <sc-for list=\"{{ runs.filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ f.pick }}\" style=\"border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};font-weight:{{ f.weight }};white-space:nowrap;box-shadow:{{ f.shadow }}\">{{ f.label }}</div>\n          </sc-for>\n        </div>\n\n        <div sc-camel-on-click=\"{{ runs.toggleMine }}\" style=\"display:fl ound:#faf8f5;border-bottom:1px solid var(--forge-border);font-size:12px;color:var(--forge-muted);white-space:nowrap\">\n          <div>运行</div>\n          <div>状态</div>\n          <div>Item 进度</div>\n          <div>发起人 / 时间</div>\n          <div>成本</div>\n        </div>\n        </sc-if>\n\n        <sc-for list=\"{{ runs.groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;align-items:center;gap:9px;padding:8px 18px;background:#faf8f5;border-bottom:1px solid var(--forge-border)\">\n          <div style=\"font-size:12px;font-weight:600;color:var(--forge-text)\">{{ g.subject }}</div>\n          <div style=\"font-size:12px;color:var(--forge-muted)\">{{ g.meta }}</div>\n        </div>\n        <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ r.open }}\" style=\"display:grid;grid-template-columns:minmax(0,2fr) clamp(96px,11vw,124px) clamp(172px,18vw,220px) clamp(88px,10vw,104px) clamp(74px,8vw,90px);gap:clamp(8px,1vw,14px);align-items:center;padding:12px 18px;border-bottom:1px solid #f4f0ea;cursor:pointer\" style-hover=\"background:var(--forge-subtle)\">\n            <div style=\"min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                <div style=\"font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.strategy }}</div>\n              </div>\n              <div style=\"margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.pipe }}</div>\n                <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-muted);border:1px solid #ece7df;border-radius:4px;padding:0 5px;white-space:nowrap\">{{ r.ver }}</div>\n              </div>\n              <div style=\"margin-top:5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.meta }}</div>\n            </div>\n            <div>\n              <div style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;color:{{ r.fg }};border:1px solid {{ r.border }};border-radius:6px;padding:2px 10px;white-space:nowrap\">\n                <div style=\"width:5px;height:5px;border-radius:50%;background:{{ r.dot }}\"></div>{{ r.status }}\n              </div>\n            </div>\n            <div style=\"min-width:0\">\n              <div style=\"display:flex;height:6px;border-radius:3px;background:var(--forge-border);overflow:hidden\">\n                <div style=\"width:{{ r.segDone }};background:#5f9a63\"></div>\n                <div style=\"width:{{ r.segRunning }};background:#c8912f\"></div>\n                <div style=\"width:{{ r.segFailed }};background:#a5321f\"></div>\n              </div>\n              <div class=\"forge-run-progress\" style=\"margin-top:5px;font-size:12px;color:var(--forge-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.progress }}</div>\n            </div>\n            <div style=\"min-width:0\">\n              <div style=\"font-size:13px;color:var(--forge-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.owner }}</div>\n              <div style=\"margin-top:5px;font-size:12px;color:var(--forge-muted);white-space:nowrap\">{{ r.when }}</div>\n            </div>\n            <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--forge-text);white-space:nowrap\">{{ r.cost }}</div>\n          </div>\n        </sc-for>\n        </sc-for>\n        <sc-if value=\"{{ runs.empty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:54px 20px;text-align:center\">\n            <div style=\"width
